<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MES To-Be 설계를 위한 품질 모듈 포털 목업">
  <title>MES To-Be Portal</title>
  <link rel="stylesheet" href="./assets/portal.css">
  <script src="./assets/portal.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="MES 모듈 메뉴">
      <div class="sidebar-head">
        <a class="portal-brand" href="#/quality-design/module-management/quality-spec" aria-label="MES 포털 홈">
          <span class="brand-mark">M</span>
          <span><b>MES</b><small>TO-BE PORTAL</small></span>
        </a>
        <button class="sidebar-collapse" id="sidebar-collapse" type="button" aria-label="메뉴 접기" aria-expanded="true">«</button>
        <button class="sidebar-close" id="sidebar-close" type="button" aria-label="메뉴 닫기">✕</button>
      </div>

      <nav class="portal-nav" aria-label="품질 모듈">
        <button class="nav-parent" type="button" data-tree-toggle="quality-management-tree" aria-expanded="true" aria-controls="quality-management-tree">
          <span>품질관리</span><span class="chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="nav-tree open" id="quality-management-tree">
          <button class="nav-subparent" type="button" data-tree-toggle="quality-design-tree" aria-expanded="true" aria-controls="quality-design-tree">
            <span>품질설계</span><span class="chevron" aria-hidden="true">⌄</span>
          </button>
          <div class="nav-tree nav-tree-inner open" id="quality-design-tree">
            <button class="nav-subparent" type="button" data-tree-toggle="module-management-tree" aria-expanded="true" aria-controls="module-management-tree">
              <span>모듈관리</span><span class="chevron" aria-hidden="true">⌄</span>
            </button>
            <div class="nav-tree nav-tree-inner open" id="module-management-tree">
              <a class="nav-link active" href="#/quality-design/module-management/quality-spec" data-route="quality-spec" aria-current="page">
                품질사양 관리
              </a>
            </div>

            <button class="nav-subparent" type="button" data-tree-toggle="feasibility-management-tree" aria-expanded="true" aria-controls="feasibility-management-tree">
              <span>생산가부관리</span><span class="chevron" aria-hidden="true">⌄</span>
            </button>
            <div class="nav-tree nav-tree-inner open" id="feasibility-management-tree">
              <a class="nav-link" href="#/quality-design/feasibility-management/order-unit-weight-error" data-route="order-unit-weight-error">
                주문단중에러관리
              </a>
              <a class="nav-link" href="#/quality-design/feasibility-management/order-consistency" data-route="order-consistency">
                주문정합성관리
              </a>
              <a class="nav-link" href="#/quality-design/feasibility-management/production-feasibility" data-route="production-feasibility">
                생산가부관리
              </a>
            </div>

            <button class="nav-subparent" type="button" data-tree-toggle="result-management-tree" aria-expanded="true" aria-controls="result-management-tree">
              <span>설계결과관리</span><span class="chevron" aria-hidden="true">⌄</span>
            </button>
            <div class="nav-tree nav-tree-inner open" id="result-management-tree">
              <a class="nav-link" href="#/quality-design/result-management/quality-design-result" data-route="quality-design-result">
                품질설계결과
              </a>
            </div>

            <a class="nav-link" href="#/quality-design/simulation" data-route="simulation">
              시뮬레이션
            </a>

            <button class="nav-subparent" type="button" data-tree-toggle="master-data-management-tree" aria-expanded="true" aria-controls="master-data-management-tree">
              <span>기준정보관리</span><span class="chevron" aria-hidden="true">⌄</span>
            </button>
            <div class="nav-tree nav-tree-inner open" id="master-data-management-tree">
              <a class="nav-link" href="#/quality-design/master-data-management/color-submaterial" data-route="color-submaterial">
                칼라부재료관리
              </a>
              <a class="nav-link" href="#/quality-design/master-data-management/color-bom" data-route="color-bom">
                칼라BOM관리
              </a>
            </div>
          </div>

          <a class="nav-link" href="#/quality-judgment" data-route="quality-judgment">
            품질판정
          </a>
        </div>

        <button class="nav-parent" type="button" data-tree-toggle="output-management-tree" aria-expanded="true" aria-controls="output-management-tree">
          <span>출력물관리</span><span class="chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="nav-tree open" id="output-management-tree">
          <a class="nav-link" href="#/output-management/quality-certificate" data-route="quality-certificate">
            품질보증서관리
          </a>
          <a class="nav-link" href="#/output-management/inspection-certificate" data-route="inspection-certificate">
            검사증명서관리
          </a>
          <a class="nav-link" href="#/output-management/tag-management" data-route="tag-management">
            Tag관리
          </a>
        </div>
      </nav>

      <div class="sidebar-foot">
        <span class="mock-badge">MOCK-UP</span>
        <span>TO-BE 설계용 · 로그인 없음</span>
      </div>
    </aside>

    <button class="sidebar-scrim" id="sidebar-scrim" type="button" aria-label="메뉴 닫기" tabindex="-1"></button>

    <div class="workspace">
      <header class="portal-header">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="메뉴 열기" aria-controls="sidebar" aria-expanded="false">
          <span aria-hidden="true">☰</span>
        </button>
        <div class="page-context">
          <div class="breadcrumb" id="breadcrumb" aria-label="현재 위치">
            <span>품질관리</span><span aria-hidden="true">›</span><span>품질설계</span><span aria-hidden="true">›</span><span>모듈관리</span><span aria-hidden="true">›</span>
          </div>
          <h1 id="page-title">품질사양 관리</h1>
        </div>
      </header>

      <main class="main-content" id="main-content">
        <section class="route-view active" id="quality-spec-view" aria-labelledby="page-title">
          <iframe
            id="module-frame"
            title="품질사양 관리 목업"
            src="./modules/quality-spec.html?embed=1"
            loading="eager">
          </iframe>
        </section>

        <section class="route-view" id="quality-design-result-view" aria-labelledby="page-title" hidden>
          <iframe
            id="module-frame-qd"
            title="품질설계결과 목업"
            src="./modules/quality-design.html?embed=1"
            loading="lazy">
          </iframe>
        </section>

        <section class="route-view" id="order-unit-weight-error-view" aria-labelledby="page-title" hidden>
          <iframe
            id="module-frame-owe"
            title="주문단중에러관리 목업"
            src="./modules/order-weight-error.html?embed=1"
            loading="lazy">
          </iframe>
        </section>

        <section class="route-view" id="order-consistency-view" aria-labelledby="page-title" hidden>
          <iframe
            id="module-frame-oc"
            title="주문정합성체크 목업"
            src="./modules/order-consistency.html?embed=1"
            loading="lazy">
          </iframe>
        </section>

        <section class="route-view" id="production-feasibility-view" aria-labelledby="page-title" hidden>
          <iframe
            id="module-frame-pf"
            title="생산가부관리 목업"
            src="./modules/production-feasibility.html?embed=1"
            loading="lazy">
          </iframe>
        </section>

        <section class="route-view" id="quality-judgment-view" aria-labelledby="page-title" hidden>
          <iframe
            id="module-frame-qj"
            title="품질판정 목업"
            src="./modules/quality-judgment.html?embed=1"
            loading="lazy">
          </iframe>
        </section>

        <section class="route-view" id="simulation-view" aria-labelledby="page-title" hidden>
          <iframe
            id="module-frame-sim"
            title="시뮬레이션 목업"
            src="./modules/simulation.html?embed=1"
            loading="lazy">
          </iframe>
        </section>

        <section class="route-view" id="color-submaterial-view" aria-labelledby="page-title" hidden>
          <iframe
            id="module-frame-csm"
            title="칼라부재료관리 목업"
            src="./modules/color-submaterial.html?embed=1"
            loading="lazy">
          </iframe>
        </section>

        <section class="route-view" id="color-bom-view" aria-labelledby="page-title" hidden>
          <iframe
            id="module-frame-cbom"
            title="칼라BOM관리 목업"
            src="./modules/color-bom.html?embed=1"
            loading="lazy">
          </iframe>
        </section>

        <section class="route-view" id="quality-certificate-view" aria-labelledby="page-title" hidden>
          <iframe
            id="module-frame-qc"
            title="품질보증서관리 목업"
            src="./modules/quality-certificate.html?embed=1"
            loading="lazy">
          </iframe>
        </section>

        <section class="route-view" id="inspection-certificate-view" aria-labelledby="page-title" hidden>
          <iframe
            id="module-frame-ic"
            title="검사증명서관리 목업"
            src="./modules/inspection-certificate.html?embed=1"
            loading="lazy">
          </iframe>
        </section>

        <section class="route-view" id="tag-management-view" aria-labelledby="page-title" hidden>
          <iframe
            id="module-frame-tag"
            title="Tag관리 목업"
            src="./modules/tag-management.html?embed=1"
            loading="lazy">
          </iframe>
        </section>
      </main>
    </div>
  </div>

  <noscript>이 포털의 메뉴 전환을 사용하려면 JavaScript를 활성화해 주세요.</noscript>
</body>
</html>
