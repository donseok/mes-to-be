<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q-DESIGN 품질설계</title>
<script>try{if(window.self!==window.top)document.documentElement.classList.add('embedded');}catch(e){document.documentElement.classList.add('embedded');}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   Q-DESIGN — 품질설계 의뢰현황 + 설계결과 통합 목업
   좌: 의뢰현황 목록 / 우: 설계결과(구 탭 9종 → 접기/펼치기 섹션)
   palette·타입은 Q-SPEC 모듈과 동일한 디자인 시스템 사용.
   ============================================================ */
:root{
  --bg:#F5F4F0; --surface:#FFFFFF; --surface-2:#F1F0EB; --surface-3:#E9E7E1;
  --border:#E8E6E1; --border-strong:#D6D2CA;
  --ink:#1C2126; --ink-2:#4A5158; --ink-3:#8A9198;
  --accent:#166578; --accent-strong:#0F4854; --accent-on:#FFFFFF;
  --accent-soft:#E4EEF1; --accent-soft-ink:#0F4854;
  --result:#96610E; --result-soft:#FBF0DC; --result-soft-ink:#7A4F0B;
  --st-draft:#6A7178; --st-draft-bg:#EFEEE9;
  --st-conf:#3F5E8C;  --st-conf-bg:#E7ECF6;
  --st-sent:#276B39;  --st-sent-bg:#E8F2E9;
  --st-fail:#B03A32;  --st-fail-bg:#F7E4E2;
  --edit-bg:#FFF9E8; --edit-bd:#EAD9A8;
  --code-bg:#F1F0EC; --shadow:0 8px 28px rgba(44,40,32,.12);
  --topbar-bg:#FBFAF7; --topbar-ink:#3A4148; --topbar-dim:#7A8188; --focus:#166578;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;font-size:13.5px;line-height:1.5;min-height:100vh}
.mono{font-family:'JetBrains Mono','Consolas',ui-monospace,monospace}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
::placeholder{color:var(--ink-3)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- top bar (단독 실행 시) ---------- */
.topbar{background:var(--topbar-bg);color:var(--topbar-ink);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;height:52px;padding:0 20px;position:sticky;top:0;z-index:30}
.embedded .topbar{display:none}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,#2A7D93 0%,#166578 55%,#96610E 130%);display:inline-flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:12px;color:#fff}
.brand-name{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:15px;letter-spacing:.04em}
.crumb{color:var(--topbar-dim);font-size:12.5px;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--topbar-ink);font-weight:500}
.topbar-right{margin-left:auto}
.mock-flag{font-size:10.5px;letter-spacing:.14em;font-weight:700;color:#0E1622;background:#E2A05B;border-radius:4px;padding:2px 7px}

/* ---------- buttons / inputs / pills ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);color:var(--ink);padding:6px 12px;font-size:12.5px;font-weight:500;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pri{background:var(--accent);border-color:var(--accent);color:var(--accent-on);font-weight:700}
.btn-pri:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-sm{padding:3px 9px;font-size:12px;border-radius:6px}
.inp,select.inp{background:var(--surface);border:1px solid var(--border-strong);border-radius:7px;padding:5px 9px;font-size:12.5px;min-width:0}
select.inp{padding-right:24px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.f-field{display:flex;flex-direction:column;gap:3px}
.f-field label{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--ink-3)}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap .inp{width:100%;padding-right:30px}
.search-clear{position:absolute;right:4px;width:24px;height:24px;border-radius:5px;color:var(--ink-3);display:none;align-items:center;justify-content:center}
.search-clear.on{display:inline-flex}
.search-clear:hover{background:var(--surface-2);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:99px;padding:1.5px 8px;white-space:nowrap}
.pill .pdot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.wait{color:var(--st-draft);background:var(--st-draft-bg)}
.pill.ing{color:var(--accent-soft-ink);background:var(--accent-soft)}
.pill.conf{color:var(--st-sent);background:var(--st-sent-bg)}
.pill.hold{color:var(--result-soft-ink);background:var(--result-soft)}
.code-badge{font-family:'JetBrains Mono',monospace;font-size:11.5px;background:var(--code-bg);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--ink-2);white-space:nowrap}
.urgent-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--st-fail);margin-right:5px;vertical-align:1px}

/* ---------- split layout ---------- */
.split{display:flex;height:calc(100vh - 52px);min-height:0}
.embedded .split{height:100vh}
.lpane{width:var(--lp-w,512px);flex:none;display:flex;flex-direction:column;background:var(--surface);min-height:0}
.rpane{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}

/* ----- 좌우 분할 리사이저 ----- */
.splitter{flex:none;width:7px;cursor:col-resize;background:transparent;position:relative;touch-action:none}
.splitter::before{content:'';position:absolute;inset:0;border-left:1px solid var(--border);left:3px}
.splitter::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:36px;border-radius:3px;background:var(--border-strong)}
.splitter:hover,.splitter:focus-visible{background:var(--accent-soft)}
.splitter:hover::after,.splitter:focus-visible::after,body.resizing .splitter::after{background:var(--accent)}
body.resizing{user-select:none;cursor:col-resize}
body.resizing .lp-scroll,body.resizing .rp-scroll{pointer-events:none}

/* ----- 좌: 의뢰현황 ----- */
.lp-head{padding:12px 14px 0}
.lp-title{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.lp-title h2{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.lp-title .cnt{font-size:11.5px;font-weight:600;color:var(--accent-soft-ink);background:var(--accent-soft);border-radius:99px;padding:1px 8px}
.lp-title .as-of{margin-left:auto;font-size:11px;color:var(--ink-3)}
.lp-filter{display:flex;flex-wrap:wrap;gap:6px 8px;padding:9px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;margin-bottom:9px}
.lp-filter .f-field{flex-direction:row;align-items:center;gap:5px}
.lp-filter .f-field label{white-space:nowrap}
.lp-filter .inp{padding:4px 8px;font-size:12px}
.lp-filter input[type=date].inp{width:118px}
.lp-actions{display:flex;gap:6px;margin-left:auto}
.lp-scroll{flex:1;overflow:auto;min-height:0}
table.list{width:100%;min-width:470px;border-collapse:collapse;font-size:12.5px}
.list th{position:sticky;top:0;z-index:2;text-align:left;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);background:var(--surface-2);padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap;box-shadow:0 1px 0 var(--border)}
.list td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.list .buyer{display:block;max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.list tbody tr{cursor:pointer;transition:background .1s}
.list tbody tr:hover{background:var(--surface-2)}
.list tbody tr:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.list tbody tr.sel{background:var(--accent-soft)}
.list tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.list .ord{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--accent);font-size:12.5px;white-space:nowrap}
.list .sub{display:block;font-size:11px;color:var(--ink-3);margin-top:1px;white-space:nowrap}
.list td.r{text-align:right}.list td.c,.list th.c{text-align:center}
.lp-msg{border-top:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);font-size:11.5px;padding:6px 14px;display:flex;gap:8px;align-items:center}
.lp-msg b{color:var(--accent-soft-ink)}
.lp-msg .pgm-id{margin-left:auto;font-family:'JetBrains Mono',monospace;color:var(--ink-3);font-size:10.5px}

/* ----- 우: 설계결과 ----- */
.rp-scroll{flex:1;overflow:auto;min-height:0;padding:14px 18px 26px}
.rp-empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-3);text-align:center;padding:30px}
.rp-empty .big{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.ord-head{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 16px;margin-bottom:10px}
.oh-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.oh-no{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:17px;letter-spacing:.01em}
.oh-no small{font-size:12px;color:var(--ink-3);font-weight:500}
.oh-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.oh-kv{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}
.oh-kv .kvi{font-size:12px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:baseline;min-width:0}
.oh-kv .kvi b{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.03em;flex:none}
.oh-kv .kvi span{font-weight:500;color:var(--ink)}

/* 섹션 내비게이션 (sticky) */
.sec-nav{position:sticky;top:-14px;z-index:20;display:flex;align-items:center;gap:5px;flex-wrap:wrap;background:var(--bg);padding:8px 0 8px;margin:0 0 4px}
.sec-chip{font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--border-strong);border-radius:99px;padding:3px 11px;white-space:nowrap}
.sec-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.sec-nav .gap{flex:1}
.sec-nav .btn{background:var(--surface)}

/* 아코디언 섹션 */
.acc{background:var(--surface);border:1px solid var(--border);border-radius:11px;margin-bottom:10px;overflow:hidden}
.acc-h{width:100%;display:flex;align-items:center;gap:9px;padding:10px 14px;text-align:left;background:var(--surface)}
.acc-h:hover{background:var(--surface-2)}
.acc-h .chev{flex:none;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:11px;transition:transform .15s}
.acc.open .acc-h .chev{transform:rotate(90deg)}
.acc-h .t{font-size:13.5px;font-weight:700}
.acc-h .sum{font-size:11.5px;color:var(--ink-3);font-weight:400;margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-h .state{margin-left:auto;font-size:11px;color:var(--ink-3);flex:none}
.acc-b{display:none;border-top:1px solid var(--border);padding:13px 14px 14px}
.acc.open .acc-b{display:block}
.acc-save{display:flex;justify-content:flex-end;margin-top:10px}

/* kv 필드 그리드 (공통 섹션 등) */
.kv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:7px 14px}
.kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv>label{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-3)}
.vbox{border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:4px 8px;font-size:12.5px;min-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbox:empty::before{content:'—';color:var(--ink-3)}
.vbox.edit{background:var(--edit-bg);border-color:var(--edit-bd)}
.vbox.b{font-weight:600}
.kv.wide{grid-column:span 2}
@media (max-width:1500px){.kv.wide{grid-column:span 1}}

/* 밴드 테이블 (사양구분 × 항목) */
.tbl-wrap{overflow-x:auto}
table.band{border-collapse:collapse;font-size:12px;width:100%;min-width:640px}
.band th{background:var(--surface-2);color:var(--ink-3);font-size:11px;font-weight:600;border:1px solid var(--border);padding:5px 8px;text-align:center;white-space:nowrap}
.band td{border:1px solid var(--border);padding:4px 8px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.band td.l{text-align:left}
.band td.rowh{background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:11.5px;text-align:left;white-space:nowrap}
.band tr.edit td{background:var(--edit-bg)}
.band tr.edit td.rowh{background:#F4E9C8;color:var(--result-soft-ink)}
.band-title{font-size:12px;font-weight:700;color:var(--ink-2);margin:12px 0 6px;display:flex;align-items:center;gap:8px}
.band-title:first-child{margin-top:0}
.band-title .note{font-weight:400;color:var(--ink-3);font-size:11px}
.subtle-note{font-size:11.5px;color:var(--ink-3);margin-top:8px}
.sec-empty{border:1px dashed var(--border-strong);border-radius:9px;padding:18px;text-align:center;color:var(--ink-3);font-size:12.5px}
.sec-empty b{color:var(--ink-2)}

/* ---------- toast ---------- */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--topbar-bg);color:var(--topbar-ink);border-radius:9px;padding:9px 18px;font-size:13px;font-weight:500;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;animation:toast-in .18s ease;max-width:min(560px,90vw)}
.toast.ok::before{content:"✓";color:#54D183;font-weight:700}
.toast.err::before{content:"!";color:#F08A8A;font-weight:700}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 반응형 ---------- */
@media (max-width:1180px){.lpane{width:440px}}
@media (max-width:960px){
  .split{flex-direction:column;height:auto}
  .embedded .split{height:auto}
  .lpane{width:100%!important;border-bottom:1px solid var(--border)}
  .splitter{display:none}
  .lp-scroll{max-height:44vh}
  .rp-scroll{overflow:visible}
  .sec-nav{top:0}
}
/*__SHAPE_CSS_START__*/
/* assets/shape/shape.css — 설계 형상 섹션. 층 색은 SVG 인라인, 나머지는 모듈 토큰 */
.shape-root{container-type:inline-size}
.shape-warns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.shape-warn{display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:var(--st-fail);background:var(--st-fail-bg);border-radius:99px;padding:2px 9px}
.shape-strip{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.shape-sc{flex:1 1 120px;min-width:120px;border:1px solid var(--border);border-radius:10px;padding:8px 8px 6px;background:var(--surface);cursor:pointer;text-align:left}
.shape-sc:hover{background:var(--surface-2)}
.shape-sc.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);background:var(--surface)}
.shape-sc:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.shape-sc-t{font-weight:700;font-size:11.5px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shape-sc-t small{color:var(--ink-3);font-weight:400;margin-left:4px}
.shape-sc .shape-coil-sm{width:100%;height:56px;display:block}
.shape-sc-g{font-family:'JetBrains Mono','Consolas',ui-monospace,monospace;font-size:11px;color:var(--accent);margin-top:4px;white-space:normal;overflow-wrap:break-word;line-height:1.2}
.shape-sc-d{font-family:'JetBrains Mono','Consolas',ui-monospace,monospace;font-size:10.5px;color:var(--st-fail);white-space:normal;overflow-wrap:break-word;line-height:1.25;min-height:14px}
.shape-arr{align-self:center;color:var(--border-strong);font-size:14px;flex:0 0 auto}
.shape-det{display:grid;grid-template-columns:320px 1fr;gap:14px;margin-top:12px;border-top:1px dashed var(--border);padding-top:12px}
.shape-root.expanded .shape-det{grid-template-columns:1fr}
.shape-root.expanded .shape-coil-lg{max-width:720px;margin:0 auto}
.shape-fig{background:var(--topbar-bg);border:1px solid var(--border);border-radius:10px;padding:8px}
.shape-coil-lg{width:100%;height:auto;display:block;font-family:'Gothic A1','Apple SD Gothic Neo',sans-serif;font-size:10.5px}
.shape-dim{stroke:var(--ink);stroke-width:1}
.shape-lead{stroke:var(--accent);stroke-dasharray:3 2;stroke-width:1}
.shape-cut{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}
.shape-txt{fill:var(--ink)}
.shape-txt-dim{fill:var(--ink-3)}
.shape-txt-acc{fill:var(--accent)}
.shape-txt-onink{fill:var(--accent-on);font-weight:700}
.shape-layer:hover{stroke:var(--accent);stroke-width:1}
.shape-layers{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px;font-size:11px}
.shape-layers li{display:flex;align-items:center;gap:6px}
.shape-layers i{width:12px;height:8px;border-radius:2px;flex:none}
.shape-layers b{margin-left:auto;font-family:'JetBrains Mono','Consolas',ui-monospace,monospace;font-weight:600}
.shape-vals{display:grid;gap:6px;align-content:start}
.shape-det-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:2px}
.shape-det-h b{font-size:12.5px}
.shape-delta{color:var(--st-fail);font-family:'JetBrains Mono','Consolas',ui-monospace,monospace;font-size:11px}
.shape-note{color:var(--ink-3);font-size:11px;margin-left:auto}
.shape-v{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:start;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.shape-v:hover,.shape-v:focus-within{border-color:var(--accent)}
.shape-v:hover .shape-v-f,.shape-v:focus-within .shape-v-f{color:var(--ink);font-weight:600}
.shape-v-k{color:var(--ink-2);font-size:12px}
.shape-v-b{font-size:12.5px}
.shape-n{font-family:'JetBrains Mono','Consolas',ui-monospace,monospace;font-weight:600}
.shape-missing{color:var(--ink-3)}
.shape-badge{display:inline-block;border:1px solid var(--accent);color:var(--accent-soft-ink);background:var(--accent-soft);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle;cursor:pointer;font:inherit;font-size:10.5px}
.shape-badge:hover{background:var(--accent);color:var(--accent-on)}
.shape-badge.pending{border-color:var(--edit-bd);color:var(--result-soft-ink);background:var(--result-soft)}
.shape-badge.pending:hover{background:var(--result);color:var(--accent-on)}
.shape-v-f{color:var(--ink-3);font-size:11px;margin-top:2px}
.shape-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-2);margin-top:10px}
.shape-legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
@container (max-width:720px){
  .shape-det{grid-template-columns:1fr}
  .shape-v{grid-template-columns:1fr}
  .shape-note{margin-left:0}
}
/*__SHAPE_CSS_END__*/
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-mark">M</span><span class="brand-name">MES · Q-DESIGN</span></div>
  <div class="crumb">품질설계 › 설계결과관리 › <b>품질설계결과</b></div>
  <div class="topbar-right"><span class="mock-flag">MOCK-UP</span></div>
</header>

  <!-- ================= 좌: 품질설계 의뢰현황 ================= -->

function kvGrid(items){

    const cls=it[2]==='wide'?' wide':'';const v=it[2]==='b'?`<div class="vbox b">${esc(it[1])}</div>`:`<div class="vbox">${esc(it[1])}</div>`;
    return `<div class="kv${cls}"><label>${esc(it[0])}</label>${v}</div>`;
  }).join('')+`</div>`;
}
function bandTable(groups,rows,opts={}){
  const two=groups.some(g=>g.s);
  let h1=`<tr><th${two?' rowspan="2"':''}>${esc(opts.first||'사양구분')}</th>`;
  let h2='<tr>';
  groups.forEach(g=>{
    if(g.s){h1+=`<th colspan="${g.s.length}">${esc(g.t)}</th>`;g.s.forEach(s=>h2+=`<th>${esc(s)}</th>`);}
    else h1+=`<th${two?' rowspan="2"':''}>${esc(g.t)}</th>`;
  });
  h1+='</tr>';h2+='</tr>';
  const body=rows.map(r=>{
    const edit=opts.editRows&&opts.editRows.includes(r[0]);
    return `<tr${edit?' class="edit"':''}><td class="rowh">${esc(r[0])}</td>`+r.slice(1).map(c=>`<td>${esc(c)}</td>`).join('')+`</tr>`;
  }).join('');
  return `<div class="tbl-wrap"><table class="band"><thead>${h1}${two?h2:''}</thead><tbody>${body}</tbody></table></div>`;
}

(function (g) {
  'use strict';

  const ROUTES = {
    rollingThicknessSet: '#/quality-design/module-management/rolling-thickness-set',

    [ROUTES.rawMaterialGrade]: '원자재강종 관리',
    [ROUTES.lineWidthShrinkage]: '폭수축량 관리',
    [ROUTES.lineWidthMargin]: '폭마진량 관리',
    [ROUTES.processRouting]: '공정라우팅 관리',
    [ROUTES.colorBom]: '칼라BOM 관리',
  };
  // 메뉴만 있고 화면이 없는 기준 — 배지에 '준비 중' 표시
  const PENDING_ROUTES = [ROUTES.lineWidthShrinkage, ROUTES.lineWidthMargin, ROUTES.colorBom];

  // 품명 → 층 스택 (스펙 §2.1)
  const STACKS = {
    G: { type: 'GI', coating: 'zinc', paint: false },
    L: { type: 'GL', coating: 'az', paint: false },
    W: { type: 'GLX', coating: 'am', paint: false },
    '3': { type: 'CCGI', coating: 'zinc', paint: true },
    '4': { type: 'CCLI', coating: 'az', paint: true },
  };
  const COATING_LABEL = { zinc: '아연 도금(Zn)', az: '알루미늄·아연 도금(AZ)', am: '아연·알루미늄·마그네슘 도금(AM)' };
  const CIRCLED = ['①', '②', '③', '④', '⑤'];

  // 문자열에서 첫 숫자. 콤마 제거. 없으면 null.
  function num(v) {
    if (typeof v === 'number') return Number.isFinite(v) ? v : null;
    if (v == null) return null;
    const m = String(v).replace(/,/g, '').match(/-?\d+(?:\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  }
  // [라벨, 값, …] 배열에서 라벨 완전일치 행의 값. 없거나 빈 값이면 null.
  function findRow(rows, label) {
    if (!Array.isArray(rows)) return null;
    const r = rows.find(x => Array.isArray(x) && x[0] === label);
    if (!r) return null;
    const v = r[1];
    return v == null || v === '' ? null : v;
  }
  function ev(kind, opts) { return Object.assign({ kind, ref: null, route: null, note: null }, opts || {}); }
  function val(key, label, value, unit, formula, evidence) {
    const missing = value == null || value === '';
    return {
      key, label,
      value: missing ? null : value,
      unit: unit || null,
      formula: missing ? null : (formula || null),
      evidence: missing ? ev('missing', { note: '설계값 없음' }) : evidence,
    };
  }
  function layer(id, kind, side, thk_um, label) {
    return { id, kind, side, thk_um: thk_um == null ? null : thk_um, label };
  }
  // route.rows 의 한 행 ['1', '1P - PLTCM', 'HD81…'] → {code:'1P', name:'PLTCM'}
  function proc(row) {
    if (!Array.isArray(row) || row[1] == null) return null;
    const parts = String(row[1]).split(' - ');
    return { code: parts[0].trim(), name: (parts[1] || '').trim() };
  }
  function round3(n) { return Math.round(n * 1000) / 1000; }
  function mmToUm(mm) { return mm == null ? null : Math.round(mm * 1000); }

  function buildShapeModel(design, order) {
    const d = design || {}, o = order || {};
    const warnings = [];

    const productType = stack ? stack.type : 'unknown';
    if (!stack) warnings.push('층 정의 없음 · 품명 ' + (o.prd == null || o.prd === '' ? '?' : o.prd));

    const head = d.head || {}, common = d.common || [], cgl = d.cgl || {}, tol = d.tol || {}, post = d.post || {};
    const lines0 = (Array.isArray(cgl.lines) && cgl.lines[0]) || [];
    const pltcm = cgl.pltcm || [], coat = cgl.coat || {};
    const ops0 = (Array.isArray(cgl.ops) && cgl.ops[0]) || [];
    const rows = (d.route && d.route.rows) || [];
    const color = d.color || null;
    const hasPaint = !!(stack && stack.paint);
    if (hasPaint && !color) warnings.push('칼라 품명이지만 칼라제조사양이 없어 칼라 장면을 생략');
    const orderThk = num(o.thk), orderWid = num(o.wid);
    const thkTp = findRow(common, '주문두께구분');
    const isBmt = typeof thkTp === 'string' && thkTp.trim().startsWith('1');

    // ① 원자재 핫코일
    const rawThk = num(lines0[3]), rawWid = num(lines0[6]);
    const raw = {
      id: 'raw', title: '원자재', process: null,
      geometry: { thk_mm: rawThk, wid_mm: rawWid, id_mm: null, weight_t: null },
      layers: [layer('substrate', 'substrate', 'core', mmToUm(rawThk), '핫코일 ' + (head.mat2 || ''))],
      values: [
        val('rmtl_cd', '원자재 코드', lines0[1], null, null, ev('constant', { route: ROUTES.rawMaterialGrade })),
        val('rmtl_thk', '원자재 두께', rawThk, 'mm', '주문두께 × 4, 0.1 mm 반올림 (목업 고정식)', ev('formula', { note: '기준 미연결 · 정식 엔진 연결 후' })),
        val('rmtl_wid', '원자재 폭', rawWid, 'mm', '주문폭 + 3 (목업 고정식)', ev('formula', { note: '기준 미연결 · 정식 엔진 연결 후' })),
        val('rmtl_pref', '원자재 선호도', lines0[2], null, null, ev('constant')),
      ],
      changes: [],
    };

    // ② 압연 PLTCM
    const setThk = num(findRow(pltcm, 'X-Ray Set두께값'));

        val('thk_target', '두께목표 (허용범위)', findRow(pltcm, '두께목표값'), null, '목표 ±0.015 (목업 상수)', ev('constant')),
        val('trim_wid', 'Side Trimming Set', trimWid, 'mm', '주문폭 + 6 (목업 고정식)', ev('formula', { route: ROUTES.lineWidthMargin })),
        val('wid_shrink', '폭수축값', num(findRow(pltcm, '폭수축값')), 'mm', '고정값 (목업 상수)', ev('constant', { route: ROUTES.lineWidthShrinkage })),

      ],

    // ③ 도금 CGL
    const coatThk = num(coat.thk);
    const coatedLayers = [];
    if (stack && stack.coating) coatedLayers.push(layer('coating-top', stack.coating, 'top', coatThk, COATING_LABEL[stack.coating]));

    if (hasPaint && color) {

      if (badge && el.contains(badge)) { e.preventDefault(); if (opts.onNavigate) opts.onNavigate(badge.dataset.route); return; }
      const tab = e.target.closest && e.target.closest('[data-scene]');
      if (tab && el.contains(tab)) select(tab.dataset.scene, true);
    }
    function onDblClick(e) {
      const tab = e.target.closest && e.target.closest('[data-scene]');
      if (tab && el.contains(tab)) { state.expanded = !state.expanded; render(false); }
    }
    function onKey(e) {
      const tab = e.target.closest && e.target.closest('[data-scene]');
      if (!tab || !el.contains(tab)) return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault();
        select(nextSceneId(model, state.sel, e.key === 'ArrowRight' ? 1 : -1), true);
      } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        select(tab.dataset.scene, true);
      }
    }

    el.addEventListener('click', onClick);
    el.addEventListener('dblclick', onDblClick);
    el.addEventListener('keydown', onKey);
    render(false);

    return {
      select: id => select(id, false),
      getSelected: () => state.sel,
      destroy() {
        el.removeEventListener('click', onClick);
        el.removeEventListener('dblclick', onDblClick);
        el.removeEventListener('keydown', onKey);
        el.innerHTML = '';
      },
    };
  }

  g.MesShape = Object.assign(g.MesShape || {}, { mount, nextSceneId });
})(globalThis);
/*__SHAPE_JS_END__*/

/* ---------- 선택 ---------- */
function select(key,scrollTop){
  if(ui.sel===key)return;
  ui.sel=key;
  $$('#q-rows tr').forEach(tr=>{const on=tr.dataset.key===key;tr.classList.toggle('sel',on);tr.setAttribute('aria-selected',on);});
  renderDetail();
  if(scrollTop!==false)$('#rp-scroll').scrollTop=0;
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',e=>{
  const tr=e.target.closest('#q-rows tr');
  if(tr){select(tr.dataset.key);tr.focus({preventScroll:true});return;}
  const goto=e.target.closest('[data-goto]');
  if(goto){
    const id=goto.dataset.goto;
    ui.collapsed.delete(id);
    const sec=$('#sec-'+id);
    if(sec){sec.classList.add('open');$('.acc-h',sec).setAttribute('aria-expanded','true');$('.state',sec).textContent='접기';
      sec.scrollIntoView({behavior:'smooth',block:'start'});}
    return;
  }
  const acch=e.target.closest('.acc-h');
  if(acch){
    const sec=acch.closest('.acc');const id=sec.dataset.sec;
    const open=sec.classList.toggle('open');
    acch.setAttribute('aria-expanded',String(open));
    $('.state',sec).textContent=open?'접기':'펼치기';
    if(open)ui.collapsed.delete(id);else ui.collapsed.add(id);
    return;
  }
  const act=e.target.closest('[data-act]');
  if(act){
    const o=findOrder(ui.sel);if(!o)return;
    switch(act.dataset.act){
      case 'expand-all':ui.collapsed.clear();renderDetail();break;
      case 'collapse-all':SECS.forEach(s=>ui.collapsed.add(s.id));renderDetail();break;
      case 'save':toast('설계결과가 저장되었습니다 (목업)');break;
      case 'confirm':o.st='CONF';renderList();renderDetail();toast(`${o.no}-${o.ln} 품질설계가 확정되었습니다`);break;
      case 'hold':o.st=o.st==='HOLD'?'ING':'HOLD';renderList();renderDetail();
        toast(o.st==='HOLD'?`${o.no}-${o.ln} 보류 처리되었습니다`:'보류가 해제되었습니다 — 설계중 상태로 돌아갑니다');break;
    }
    return;
  }
  const mock=e.target.closest('[data-mock]');
  if(mock){toast(`[${mock.dataset.mock}] — 목업에서는 동작을 제공하지 않습니다`,'err');return;}
  if(e.target.id==='qf-q-clear'){ui.fQ='';$('#qf-q').value='';renderList();$('#qf-q').focus();return;}
  if(e.target.id==='qf-search'){ui.fQ=$('#qf-q').value;renderList();return;}
  if(e.target.id==='qf-reset'){ui.fPrd='';ui.fSt='';ui.fQ='';$('#qf-prd').value='';$('#qf-st').value='';$('#qf-q').value='';renderList();return;}
});

document.addEventListener('focusin',e=>{
  const tr=e.target.closest?.('#q-rows tr');
  if(tr)select(tr.dataset.key);
});
document.addEventListener('keydown',e=>{
  const tr=e.target.closest?.('#q-rows tr');
  if(!tr)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    const sib=e.key==='ArrowDown'?tr.nextElementSibling:tr.previousElementSibling;
    if(sib)sib.focus();
  }else if(e.key==='Enter'){select(tr.dataset.key);}
});
document.addEventListener('change',e=>{
  if(e.target.id==='qf-prd'){ui.fPrd=e.target.value;renderList();}
  else if(e.target.id==='qf-st'){ui.fSt=e.target.value;renderList();}
});
let deb;document.addEventListener('input',e=>{
  if(e.target.id==='qf-q'){clearTimeout(deb);deb=setTimeout(()=>{ui.fQ=e.target.value;renderList();},140);}
});

/* ---------- 좌우 분할 리사이저 ---------- */
const LPW_KEY='qdesign-lpane-w', LPW_DEF=512, LPW_MIN=380;
const lpMax=()=>Math.max(LPW_MIN,Math.min(Math.round(window.innerWidth*0.55),820));
function setLpW(w,save){
  w=Math.max(LPW_MIN,Math.min(lpMax(),Math.round(w)));
  document.documentElement.style.setProperty('--lp-w',w+'px');
  const sp=$('#splitter');
  if(sp){sp.setAttribute('aria-valuemin',LPW_MIN);sp.setAttribute('aria-valuemax',lpMax());sp.setAttribute('aria-valuenow',w);}
  if(save)try{localStorage.setItem(LPW_KEY,String(w));}catch(e){}
  return w;
}
try{const s=parseInt(localStorage.getItem(LPW_KEY),10);if(s)setLpW(s);}catch(e){}
(()=>{
  const sp=$('#splitter');if(!sp)return;
  let sx=0,sw=0;
  sp.addEventListener('pointerdown',e=>{
    sx=e.clientX;sw=$('.lpane').getBoundingClientRect().width;
    document.body.classList.add('resizing');
    sp.setPointerCapture(e.pointerId);
  });
  sp.addEventListener('pointermove',e=>{
    if(!document.body.classList.contains('resizing'))return;
    setLpW(sw+(e.clientX-sx));
  });
  const end=()=>{
    if(!document.body.classList.contains('resizing'))return;
    document.body.classList.remove('resizing');
    setLpW($('.lpane').getBoundingClientRect().width,true);
  };
  sp.addEventListener('pointerup',end);sp.addEventListener('pointercancel',end);
  sp.addEventListener('dblclick',()=>{setLpW(LPW_DEF,true);toast('목록 폭을 기본값(512px)으로 되돌렸습니다');});
  sp.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
      e.preventDefault();
      setLpW($('.lpane').getBoundingClientRect().width+(e.key==='ArrowRight'?24:-24),true);
    }else if(e.key==='Home'){e.preventDefault();setLpW(LPW_DEF,true);}
  });
  window.addEventListener('resize',()=>{
    const cur=$('.lpane').getBoundingClientRect().width;
    if(cur>lpMax())setLpW(lpMax());
  });
})();

/* ---------- init ---------- */
renderList();
select('D260831014-010');
</script>
