<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q-DESIGN 품질설계</title>
<script>try{if(window.self!==window.top)document.documentElement.classList.add('embedded');}catch(e){document.documentElement.classList.add('embedded');}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   Q-DESIGN — 품질설계 의뢰현황 + 설계결과 통합 목업
   좌: 의뢰현황 목록 / 우: 설계결과(구 탭 9종 → 접기/펼치기 섹션)
   palette·타입은 Q-SPEC 모듈과 동일한 디자인 시스템 사용.
   ============================================================ */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EDF1F6; --surface-3:#E3E9F0;
  --border:#D9E0E8; --border-strong:#B9C4D0;
  --ink:#18222F; --ink-2:#4C5A6B; --ink-3:#7C8798;
  --accent:#1D5FBF; --accent-strong:#174C99; --accent-on:#FFFFFF;
  --accent-soft:#E4EDFA; --accent-soft-ink:#174C99;
  --result:#B45309; --result-soft:#F9EFE0; --result-soft-ink:#8F4408;
  --st-draft:#5B6774; --st-draft-bg:#E8ECF1;
  --st-conf:#0E7490;  --st-conf-bg:#DFF2F7;
  --st-sent:#15803D;  --st-sent-bg:#DFF2E5;
  --st-fail:#B91C1C;  --st-fail-bg:#FBE4E4;
  --edit-bg:#FFF9E8; --edit-bd:#EAD9A8;
  --code-bg:#EEF2F7; --shadow:0 8px 28px rgba(23,42,68,.14);
  --topbar-bg:#14202E; --topbar-ink:#D8E1EC; --topbar-dim:#8DA0B5; --focus:#1D5FBF;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;font-size:13.5px;line-height:1.5;min-height:100vh}
.mono{font-family:'IBM Plex Mono','Consolas',ui-monospace,monospace}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
::placeholder{color:var(--ink-3)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- top bar (단독 실행 시) ---------- */
.topbar{background:var(--topbar-bg);color:var(--topbar-ink);display:flex;align-items:center;gap:14px;height:52px;padding:0 20px;position:sticky;top:0;z-index:30}
.embedded .topbar{display:none}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,#2E71D4 0%,#1D5FBF 55%,#B45309 130%);display:inline-flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;color:#fff}
.brand-name{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;letter-spacing:.04em}
.crumb{color:var(--topbar-dim);font-size:12.5px;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--topbar-ink);font-weight:500}
.topbar-right{margin-left:auto}
.mock-flag{font-size:10.5px;letter-spacing:.14em;font-weight:700;color:#0E1622;background:#E2A05B;border-radius:4px;padding:2px 7px}

/* ---------- buttons / inputs / pills ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);color:var(--ink);padding:6px 12px;font-size:12.5px;font-weight:500;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pri{background:var(--accent);border-color:var(--accent);color:var(--accent-on);font-weight:700}
.btn-pri:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-sm{padding:3px 9px;font-size:12px;border-radius:6px}
.inp,select.inp{background:var(--surface);border:1px solid var(--border-strong);border-radius:7px;padding:5px 9px;font-size:12.5px;min-width:0}
select.inp{padding-right:24px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.f-field{display:flex;flex-direction:column;gap:3px}
.f-field label{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--ink-3)}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap .inp{width:100%;padding-right:30px}
.search-clear{position:absolute;right:4px;width:24px;height:24px;border-radius:5px;color:var(--ink-3);display:none;align-items:center;justify-content:center}
.search-clear.on{display:inline-flex}
.search-clear:hover{background:var(--surface-2);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:99px;padding:1.5px 8px;white-space:nowrap}
.pill .pdot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.wait{color:var(--st-draft);background:var(--st-draft-bg)}
.pill.ing{color:var(--accent-soft-ink);background:var(--accent-soft)}
.pill.conf{color:var(--st-sent);background:var(--st-sent-bg)}
.pill.hold{color:var(--result-soft-ink);background:var(--result-soft)}
.code-badge{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:var(--code-bg);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--ink-2);white-space:nowrap}
.urgent-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--st-fail);margin-right:5px;vertical-align:1px}

/* ---------- split layout ---------- */
.split{display:flex;height:calc(100vh - 52px);min-height:0}
.embedded .split{height:100vh}
.lpane{width:512px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surface);min-height:0}
.rpane{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}

/* ----- 좌: 의뢰현황 ----- */
.lp-head{padding:12px 14px 0}
.lp-title{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.lp-title h2{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.lp-title .cnt{font-size:11.5px;font-weight:600;color:var(--accent-soft-ink);background:var(--accent-soft);border-radius:99px;padding:1px 8px}
.lp-title .as-of{margin-left:auto;font-size:11px;color:var(--ink-3)}
.lp-filter{display:flex;flex-wrap:wrap;gap:6px 8px;padding:9px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;margin-bottom:9px}
.lp-filter .f-field{flex-direction:row;align-items:center;gap:5px}
.lp-filter .f-field label{white-space:nowrap}
.lp-filter .inp{padding:4px 8px;font-size:12px}
.lp-filter input[type=date].inp{width:118px}
.lp-actions{display:flex;gap:6px;margin-left:auto}
.lp-scroll{flex:1;overflow:auto;min-height:0}
table.list{width:100%;border-collapse:collapse;font-size:12.5px}
.list th{position:sticky;top:0;z-index:2;text-align:left;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);background:var(--surface-2);padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap;box-shadow:0 1px 0 var(--border)}
.list td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.list .buyer{display:block;max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.list tbody tr{cursor:pointer;transition:background .1s}
.list tbody tr:hover{background:var(--surface-2)}
.list tbody tr:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.list tbody tr.sel{background:var(--accent-soft)}
.list tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.list .ord{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--accent);font-size:12.5px;white-space:nowrap}
.list .sub{display:block;font-size:11px;color:var(--ink-3);margin-top:1px;white-space:nowrap}
.list td.r{text-align:right}.list td.c,.list th.c{text-align:center}
.lp-msg{border-top:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);font-size:11.5px;padding:6px 14px;display:flex;gap:8px;align-items:center}
.lp-msg b{color:var(--accent-soft-ink)}
.lp-msg .pgm-id{margin-left:auto;font-family:'IBM Plex Mono',monospace;color:var(--ink-3);font-size:10.5px}

/* ----- 우: 설계결과 ----- */
.rp-scroll{flex:1;overflow:auto;min-height:0;padding:14px 18px 26px}
.rp-empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-3);text-align:center;padding:30px}
.rp-empty .big{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.ord-head{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 16px;margin-bottom:10px}
.oh-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.oh-no{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:17px;letter-spacing:.01em}
.oh-no small{font-size:12px;color:var(--ink-3);font-weight:500}
.oh-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.oh-kv{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}
.oh-kv .kvi{font-size:12px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:baseline;min-width:0}
.oh-kv .kvi b{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.03em;flex:none}
.oh-kv .kvi span{font-weight:500;color:var(--ink)}

/* 섹션 내비게이션 (sticky) */
.sec-nav{position:sticky;top:-14px;z-index:20;display:flex;align-items:center;gap:5px;flex-wrap:wrap;background:var(--bg);padding:8px 0 8px;margin:0 0 4px}
.sec-chip{font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--border-strong);border-radius:99px;padding:3px 11px;white-space:nowrap}
.sec-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.sec-nav .gap{flex:1}
.sec-nav .btn{background:var(--surface)}

/* 아코디언 섹션 */
.acc{background:var(--surface);border:1px solid var(--border);border-radius:11px;margin-bottom:10px;overflow:hidden}
.acc-h{width:100%;display:flex;align-items:center;gap:9px;padding:10px 14px;text-align:left;background:var(--surface)}
.acc-h:hover{background:var(--surface-2)}
.acc-h .chev{flex:none;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:11px;transition:transform .15s}
.acc.open .acc-h .chev{transform:rotate(90deg)}
.acc-h .t{font-size:13.5px;font-weight:700}
.acc-h .sum{font-size:11.5px;color:var(--ink-3);font-weight:400;margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-h .state{margin-left:auto;font-size:11px;color:var(--ink-3);flex:none}
.acc-b{display:none;border-top:1px solid var(--border);padding:13px 14px 14px}
.acc.open .acc-b{display:block}
.acc-save{display:flex;justify-content:flex-end;margin-top:10px}

/* kv 필드 그리드 (공통 섹션 등) */
.kv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:7px 14px}
.kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv>label{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-3)}
.vbox{border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:4px 8px;font-size:12.5px;min-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbox:empty::before{content:'—';color:var(--ink-3)}
.vbox.edit{background:var(--edit-bg);border-color:var(--edit-bd)}
.vbox.b{font-weight:600}
.kv.wide{grid-column:span 2}
@media (max-width:1500px){.kv.wide{grid-column:span 1}}

/* 밴드 테이블 (사양구분 × 항목) */
.tbl-wrap{overflow-x:auto}
table.band{border-collapse:collapse;font-size:12px;width:100%;min-width:640px}
.band th{background:var(--surface-2);color:var(--ink-3);font-size:11px;font-weight:600;border:1px solid var(--border);padding:5px 8px;text-align:center;white-space:nowrap}
.band td{border:1px solid var(--border);padding:4px 8px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.band td.l{text-align:left}
.band td.rowh{background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:11.5px;text-align:left;white-space:nowrap}
.band tr.edit td{background:var(--edit-bg)}
.band tr.edit td.rowh{background:#F4E9C8;color:var(--result-soft-ink)}
.band-title{font-size:12px;font-weight:700;color:var(--ink-2);margin:12px 0 6px;display:flex;align-items:center;gap:8px}
.band-title:first-child{margin-top:0}
.band-title .note{font-weight:400;color:var(--ink-3);font-size:11px}
.subtle-note{font-size:11.5px;color:var(--ink-3);margin-top:8px}
.sec-empty{border:1px dashed var(--border-strong);border-radius:9px;padding:18px;text-align:center;color:var(--ink-3);font-size:12.5px}
.sec-empty b{color:var(--ink-2)}

/* ---------- toast ---------- */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--topbar-bg);color:var(--topbar-ink);border-radius:9px;padding:9px 18px;font-size:13px;font-weight:500;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;animation:toast-in .18s ease;max-width:min(560px,90vw)}
.toast.ok::before{content:"✓";color:#54D183;font-weight:700}
.toast.err::before{content:"!";color:#F08A8A;font-weight:700}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 반응형 ---------- */
@media (max-width:1180px){.lpane{width:440px}}
@media (max-width:960px){
  .split{flex-direction:column;height:auto}
  .embedded .split{height:auto}
  .lpane{width:100%;border-right:none;border-bottom:1px solid var(--border)}
  .lp-scroll{max-height:44vh}
  .rp-scroll{overflow:visible}
  .sec-nav{top:0}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-mark">M</span><span class="brand-name">MES · Q-DESIGN</span></div>
  <div class="crumb">품질설계 › 모듈관리 › <b>품질설계결과</b></div>
  <div class="topbar-right"><span class="mock-flag">MOCK-UP</span></div>
</header>

<div class="split">

  <!-- ================= 좌: 품질설계 의뢰현황 ================= -->
  <aside class="lpane" aria-label="품질설계 의뢰현황">
    <div class="lp-head">
      <div class="lp-title">
        <h2>품질설계 의뢰현황</h2><span class="cnt" id="q-cnt">0건</span>
        <span class="as-of">의뢰일 기준 · 최신순</span>
      </div>
      <div class="lp-filter" role="search" aria-label="의뢰현황 조회조건">
        <div class="f-field"><label for="qf-from">설계의뢰일자</label>
          <input type="date" class="inp" id="qf-from" value="2026-08-30">
          <span style="color:var(--ink-3)">~</span>
          <input type="date" class="inp" id="qf-to" value="2026-08-31" aria-label="설계의뢰일자 종료일"></div>
        <div class="f-field"><label for="qf-prd">품명</label>
          <select class="inp" id="qf-prd"><option value="">전체</option>
            <option value="3">3 : CCGI</option><option value="4">4 : CCLI</option>
            <option value="G">G : GI</option><option value="L">L : G/L</option><option value="W">W : GLX</option></select></div>
        <div class="f-field"><label for="qf-st">설계상태</label>
          <select class="inp" id="qf-st"><option value="">전체</option>
            <option value="WAIT">미설계</option><option value="ING">설계중</option>
            <option value="CONF">확정</option><option value="HOLD">보류</option></select></div>
        <div class="f-field" style="flex:1 1 100%"><label for="qf-q">키워드</label>
          <div class="search-wrap" style="flex:1"><input class="inp" id="qf-q" type="search" autocomplete="off" placeholder="주문번호·규격약호·최종수요가 검색">
            <button class="search-clear" id="qf-q-clear" aria-label="검색어 지우기">✕</button></div>
          <div class="lp-actions">
            <button class="btn btn-pri btn-sm" id="qf-search">조회</button>
            <button class="btn btn-sm" id="qf-reset">초기화</button>
          </div></div>
      </div>
    </div>
    <div class="lp-scroll">
      <table class="list" aria-label="설계 의뢰 주문 목록">
        <thead><tr>
          <th>주문번호 · 행번</th><th>규격약호</th><th class="c">두께 × 폭</th><th>최종수요가</th><th class="c">설계상태</th>
        </tr></thead>
        <tbody id="q-rows"></tbody>
      </table>
    </div>
    <div class="lp-msg">MESSAGE <b id="q-msg">0건의 Data가 조회되었습니다.</b><span class="pgm-id">C104000010</span></div>
  </aside>

  <!-- ================= 우: 품질설계결과 ================= -->
  <main class="rpane" aria-label="품질설계결과">
    <div class="rp-scroll" id="rp-scroll">
      <div class="rp-empty" id="rp-empty">
        <div><div class="big">왼쪽 의뢰현황에서 주문을 선택하세요</div>
        행을 클릭하거나 ↑↓ 키로 이동하면 해당 주문의 품질설계결과가 여기에 표시됩니다.</div>
      </div>
      <div id="rp-body" hidden></div>
    </div>
  </main>

</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* ============================================================
   Q-DESIGN mock — 데이터는 AS-IS 화면(2026-08-31 조회분) 기준
   ============================================================ */
'use strict';
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtW=n=>n.toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1});
function toast(msg,type='ok'){
  const t=document.createElement('div');t.className=`toast ${type}`;t.textContent=msg;
  $('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .25s';setTimeout(()=>t.remove(),260);},2600);
}

/* ---------- 상태 ---------- */
const ST={WAIT:['미설계','wait'],ING:['설계중','ing'],CONF:['확정','conf'],HOLD:['보류','hold']};
const PRD_NM={'3':'3 : CCGI','4':'4 : CCLI','G':'G : GI','L':'L : G/L','W':'W : GLX'};

/* ---------- seed: 의뢰현황 (AS-IS 조회 화면 데이터) ---------- */
const ORDERS=[

/* ---------- 렌더 헬퍼 ---------- */
function kvGrid(items){
  return `<div class="kv-grid">`+items.map(it=>{
    const cls=it[2]==='wide'?' wide':'';const v=it[2]==='b'?`<div class="vbox b">${esc(it[1])}</div>`:`<div class="vbox">${esc(it[1])}</div>`;
    return `<div class="kv${cls}"><label>${esc(it[0])}</label>${v}</div>`;
  }).join('')+`</div>`;
}
function bandTable(groups,rows,opts={}){
  const two=groups.some(g=>g.s);
  let h1=`<tr><th${two?' rowspan="2"':''}>${esc(opts.first||'사양구분')}</th>`;
  let h2='<tr>';
  groups.forEach(g=>{
    if(g.s){h1+=`<th colspan="${g.s.length}">${esc(g.t)}</th>`;g.s.forEach(s=>h2+=`<th>${esc(s)}</th>`);}
    else h1+=`<th${two?' rowspan="2"':''}>${esc(g.t)}</th>`;
  });
  h1+='</tr>';h2+='</tr>';
  const body=rows.map(r=>{
    const edit=opts.editRows&&opts.editRows.includes(r[0]);
    return `<tr${edit?' class="edit"':''}><td class="rowh">${esc(r[0])}</td>`+r.slice(1).map(c=>`<td>${esc(c)}</td>`).join('')+`</tr>`;
  }).join('');
  return `<div class="tbl-wrap"><table class="band"><thead>${h1}${two?h2:''}</thead><tbody>${body}</tbody></table></div>`;
}

/* ---------- 선택 ---------- */
function select(key,scrollTop){
  if(ui.sel===key)return;
  ui.sel=key;
  $$('#q-rows tr').forEach(tr=>{const on=tr.dataset.key===key;tr.classList.toggle('sel',on);tr.setAttribute('aria-selected',on);});
  renderDetail();
  if(scrollTop!==false)$('#rp-scroll').scrollTop=0;
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',e=>{
  const tr=e.target.closest('#q-rows tr');
  if(tr){select(tr.dataset.key);tr.focus({preventScroll:true});return;}
  const goto=e.target.closest('[data-goto]');
  if(goto){
    const id=goto.dataset.goto;
    ui.collapsed.delete(id);
    const sec=$('#sec-'+id);
    if(sec){sec.classList.add('open');$('.acc-h',sec).setAttribute('aria-expanded','true');$('.state',sec).textContent='접기';
      sec.scrollIntoView({behavior:'smooth',block:'start'});}
    return;
  }
  const acch=e.target.closest('.acc-h');
  if(acch){
    const sec=acch.closest('.acc');const id=sec.dataset.sec;
    const open=sec.classList.toggle('open');
    acch.setAttribute('aria-expanded',String(open));
    $('.state',sec).textContent=open?'접기':'펼치기';
    if(open)ui.collapsed.delete(id);else ui.collapsed.add(id);
    return;
  }
  const act=e.target.closest('[data-act]');
  if(act){
    const o=findOrder(ui.sel);if(!o)return;
    switch(act.dataset.act){
      case 'expand-all':ui.collapsed.clear();renderDetail();break;
      case 'collapse-all':SECS.forEach(s=>ui.collapsed.add(s.id));renderDetail();break;
      case 'save':toast('설계결과가 저장되었습니다 (목업)');break;
      case 'confirm':o.st='CONF';renderList();renderDetail();toast(`${o.no}-${o.ln} 품질설계가 확정되었습니다`);break;
      case 'hold':o.st=o.st==='HOLD'?'ING':'HOLD';renderList();renderDetail();
        toast(o.st==='HOLD'?`${o.no}-${o.ln} 보류 처리되었습니다`:'보류가 해제되었습니다 — 설계중 상태로 돌아갑니다');break;
    }
    return;
  }
  const mock=e.target.closest('[data-mock]');
  if(mock){toast(`[${mock.dataset.mock}] — 목업에서는 동작을 제공하지 않습니다`,'err');return;}
  if(e.target.id==='qf-q-clear'){ui.fQ='';$('#qf-q').value='';renderList();$('#qf-q').focus();return;}
  if(e.target.id==='qf-search'){ui.fQ=$('#qf-q').value;renderList();return;}
  if(e.target.id==='qf-reset'){ui.fPrd='';ui.fSt='';ui.fQ='';$('#qf-prd').value='';$('#qf-st').value='';$('#qf-q').value='';renderList();return;}
});

/* 행 포커스 이동 시에도 상세 갱신 (요구사항: 클릭 또는 포커스) */
document.addEventListener('focusin',e=>{
  const tr=e.target.closest?.('#q-rows tr');
  if(tr)select(tr.dataset.key);
});
document.addEventListener('keydown',e=>{
  const tr=e.target.closest?.('#q-rows tr');
  if(!tr)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    const sib=e.key==='ArrowDown'?tr.nextElementSibling:tr.previousElementSibling;
    if(sib)sib.focus();
  }else if(e.key==='Enter'){select(tr.dataset.key);}
});
document.addEventListener('change',e=>{
  if(e.target.id==='qf-prd'){ui.fPrd=e.target.value;renderList();}
  else if(e.target.id==='qf-st'){ui.fSt=e.target.value;renderList();}
});
let deb;document.addEventListener('input',e=>{
  if(e.target.id==='qf-q'){clearTimeout(deb);deb=setTimeout(()=>{ui.fQ=e.target.value;renderList();},140);}
});

/* ---------- init ---------- */
renderList();
select('D260831014-010');
</script>
