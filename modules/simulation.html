<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시뮬레이션 — MES To-Be</title>
<script>try{if(window.self!==window.top)document.documentElement.classList.add('embedded');}catch(e){document.documentElement.classList.add('embedded');}</script>
<style>
:root{
  --bg:#F5F4F0;--surface:#FFF;--surface-2:#F1F0EB;--surface-3:#E9E7E1;
  --border:#E8E6E1;--border-strong:#D6D2CA;
  --ink:#1C2126;--ink-2:#4A5158;--ink-3:#8A9198;
  --accent:#166578;--accent-strong:#0F4854;--accent-soft:#E4EEF1;--accent-soft-ink:#0F4854;
  --result:#96610E;--result-soft:#FBF0DC;--result-soft-ink:#7A4F0B;
  --code-bg:#F1F0EC;--focus:#166578;
  --st-draft:#6A7178;--st-draft-bg:#EFEEE9;--st-conf:#3F5E8C;--st-conf-bg:#E7ECF6;
  --st-sent:#276B39;--st-sent-bg:#E8F2E9;--st-fail:#B03A32;--st-fail-bg:#F7E4E2;
  --danger:#B03A32;--danger-bg:#F7E4E2;
  --edit-bg:#FFF9E8;--edit-bd:#EAD9A8;
  --topbar-bg:#FBFAF7;--topbar-ink:#3A4148;--topbar-dim:#7A8188;
  --shadow:0 8px 28px rgba(44,40,32,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
[hidden]{display:none!important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.f-spacer{flex:1}
.cell-sub{color:var(--ink-3);font-size:12px}

/* 상단바 — 단독 실행 시에만 */
.topbar{position:sticky;top:0;z-index:30;height:52px;display:flex;align-items:center;gap:12px;
  padding:0 20px;background:var(--topbar-bg);color:var(--topbar-ink)}
.embedded .topbar{display:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700}
.brand-mark{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  background:linear-gradient(135deg,#2f7ae0,#166578);color:#fff;font-size:13px}
.crumb{color:var(--topbar-dim);font-size:12.5px}
@media(max-width:920px){.crumb{display:none}}
.mock-flag{margin-left:auto;background:var(--result);color:#fff;font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:99px;letter-spacing:.04em}

/* 출처 배지 바 */
.srcbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 16px;
  background:var(--surface);border-bottom:1px solid var(--border);font-size:12px}
.embedded .srcbar{position:sticky;top:0;z-index:20}

.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid}
.pill.sent{background:var(--st-sent-bg);border-color:#8ecfa8;color:var(--st-sent)}
.pill.fail{background:var(--st-fail-bg);border-color:#e8a5a5;color:var(--st-fail)}
.pill.warn{background:var(--result-soft);border-color:#e5c795;color:var(--result-soft-ink)}
.pill.draft{background:var(--st-draft-bg);border-color:#c9d2dc;color:var(--st-draft)}
.pill.ac{background:var(--accent-soft);border-color:#a9c5e8;color:var(--accent-soft-ink)}
.pill.gy{background:var(--surface-2);border-color:var(--border-strong);color:var(--ink-2)}

.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:7px;
  padding:5px 11px;font-size:12.5px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn-pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-pri:hover{background:var(--accent-strong)}
.btn-sm{padding:3px 8px;font-size:11.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{border:1px solid var(--border-strong);background:var(--surface);border-radius:7px;
  padding:4px 8px;font-size:12.5px;width:100%}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);outline:none}
.code-badge{font-family:ui-monospace,Menlo,monospace;font-size:11px;border:1px solid var(--border);
  background:var(--code-bg);border-radius:5px;padding:0 5px;color:var(--ink-2)}

/* 3분할 */
.simwrap{display:flex;align-items:stretch;height:calc(100vh - 52px - 33px)}
.embedded .simwrap{height:calc(100vh - 33px)}
.lpane{width:270px;flex:none;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:auto}
.splitter{width:6px;flex:none;background:var(--surface-2);border-left:1px solid var(--border);
  border-right:1px solid var(--border);cursor:col-resize}
.splitter:hover,.splitter:focus{background:var(--accent-soft)}
.cpane{flex:1;min-width:0;overflow:auto;padding:10px}
.rpane{width:290px;flex:none;background:var(--surface);border-left:1px solid var(--border);overflow:auto}
@media(max-width:1100px){
  .simwrap{flex-direction:column;height:auto}
  .lpane,.rpane{width:100%!important;border:none;border-bottom:1px solid var(--border)}
  .splitter{display:none}
}

.sec-h{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--surface-2);
  border-bottom:1px solid var(--border);font-size:12px;font-weight:700;color:var(--ink-2);
  position:sticky;top:0;z-index:5}
.sec-h .n{margin-left:auto;font-weight:500;color:var(--ink-3);font-size:11.5px}
.pad{padding:8px 10px}

/* 케이스 목록 */
.case-row{display:flex;align-items:center;gap:6px;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--border);background:var(--surface);border-radius:7px;
  padding:5px 8px;margin-bottom:4px;font-size:12.5px}
.case-row:hover{background:var(--surface-2)}
.case-row.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}

/* 주문 폼 */
.fr{display:grid;grid-template-columns:1fr 1.15fr;gap:4px 6px;align-items:center;margin-bottom:4px}
.fr label{font-size:11px;color:var(--ink-2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .inp{padding:2px 6px;font-size:12px}
.fr .inp.dirty{background:var(--edit-bg);border-color:var(--edit-bd)}
.req{color:var(--danger);font-weight:700}
.f-hint{font-size:11.5px;color:var(--ink-3);margin:6px 0 0}
details>summary{cursor:pointer;font-size:12px;color:var(--ink-2);margin:6px 0 4px}

/* 액션바 */
.actbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--border);border-radius:9px;padding:7px 10px;margin-bottom:8px}

/* 파이프라인 */
.pipe{display:flex;gap:4px;margin-bottom:10px}
.st{flex:1;min-width:0;border:1px solid var(--border-strong);background:var(--surface);
  border-radius:7px;padding:6px 4px;text-align:center;cursor:pointer;font-size:11px;line-height:1.4}
.st .t{display:block;font-weight:700;font-size:11.5px}
.st .v{display:block;color:var(--ink-2);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st.ok{background:var(--st-sent-bg);border-color:#8ecfa8}
.st.no{background:var(--st-fail-bg);border-color:#e8a5a5}
.st.wa{background:var(--result-soft);border-color:#e5c795}
.st.gy{background:var(--surface-2)}
.st.gh{opacity:.6;border-style:dashed}
.st.on{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}
.st .adv{display:block;font-size:9.5px;color:var(--result-soft-ink);font-weight:700}
@media(max-width:760px){.pipe{flex-wrap:wrap}.st{flex:1 1 30%}}

/* 패널 */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  overflow:hidden;margin-bottom:10px}
.panel-h{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--surface-2);
  border-bottom:1px solid var(--border)}
.panel-h h3{margin:0;font-size:13px}
.panel-h .sub{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.empty{padding:32px 16px;text-align:center;color:var(--ink-3);font-size:12.5px}
.empty .big{font-size:14px;color:var(--ink-2);font-weight:600;margin-bottom:4px}

.pv-ok{background:var(--st-sent-bg);border:1px solid #8ecfa8;color:var(--st-sent);
  border-radius:7px;padding:7px 10px;font-size:12.5px;margin-bottom:6px}
.pv-issue{background:var(--st-fail-bg);border:1px solid #e8a5a5;color:var(--st-fail);
  border-radius:7px;padding:7px 10px;font-size:12.5px;margin-bottom:6px}
.pv-issue.wa{background:var(--result-soft);border-color:#e5c795;color:var(--result-soft-ink)}

/* 표 */
.grid{width:100%;border-collapse:collapse;font-size:12px}
.grid th,.grid td{border-bottom:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top}
.grid thead th{background:var(--surface-2);font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.grid td.c,.grid th.c{text-align:center}
.grid tr.ovr td{background:var(--accent-soft)}
.tbl-scroll{overflow-x:auto}

/* 룰/사양 카드 */
.match-card{border:1px solid var(--border);border-radius:9px;margin-bottom:6px;overflow:hidden}
.match-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:5px 9px;
  background:var(--surface-2);border-bottom:1px solid var(--border);font-size:12px}
.cond-check{padding:5px 9px;font-size:12px}
.cond-check .row{display:flex;gap:6px;align-items:baseline;padding:1px 0;flex-wrap:wrap}
.cc-ok{color:var(--st-sent);font-weight:700}
.cc-no{color:var(--st-fail);font-weight:700}
.m-badge{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px}
.m-badge.hit{background:var(--st-sent-bg);color:var(--st-sent)}
.m-badge.miss{background:var(--surface-3);color:var(--ink-2)}
.m-badge.skip{background:var(--result-soft);color:var(--result-soft-ink)}

/* 설계결과 아코디언 */
.acc{border-bottom:1px solid var(--border)}
.acc-h{display:flex;align-items:center;gap:6px;width:100%;text-align:left;cursor:pointer;
  background:none;border:none;padding:6px 12px;font-size:12.5px;font-weight:700}
.acc-h:hover{background:var(--surface-2)}
.acc-h .s{margin-left:auto;font-weight:400;color:var(--ink-3);font-size:11.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52%}
.acc-b{padding:6px 12px 10px;background:#FAFCFE;border-top:1px solid var(--border)}
.kv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:3px 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:baseline;font-size:12px}
.kv.wide{grid-column:1/-1}
.kv label{color:var(--ink-2);font-size:11.5px}
.val{cursor:pointer;border-bottom:1px dotted var(--accent);color:var(--accent-strong);
  background:none;border-left:none;border-right:none;border-top:none;padding:0;text-align:left;font-size:12px}
.val:hover{background:var(--accent-soft)}
.val.on{background:var(--accent-soft);font-weight:700}
.val.bad{background:var(--st-fail-bg);border-bottom-color:var(--danger);color:var(--danger)}
.band-title{font-size:11.5px;font-weight:700;color:var(--ink-2);margin:8px 0 3px;display:flex;gap:6px;align-items:center}

/* 근거 패널 */
.prv{border-left:3px solid var(--accent);background:var(--accent-soft);padding:6px 9px;
  border-radius:0 6px 6px 0;font-size:12px;margin-bottom:6px;line-height:1.55}
.prv.std{border-color:var(--border-strong);background:var(--surface-2)}
.prv.asis{border-color:var(--result);background:var(--result-soft)}
.jump{color:var(--accent-strong);font-weight:600;cursor:pointer;text-decoration:none}
.jump:hover{text-decoration:underline}
.exp-row{display:flex;gap:6px;align-items:baseline;padding:2px 0;font-size:12px;flex-wrap:wrap}

/* 토스트 */
.toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:80}
.toast{background:var(--topbar-bg);color:#fff;border-radius:8px;padding:8px 12px;font-size:12.5px;
  box-shadow:var(--shadow);max-width:340px}
.toast.err{background:var(--danger)}

/* 모달 */
.modal-back{position:fixed;inset:0;background:rgba(28,26,22,.44);display:none;
  align-items:center;justify-content:center;z-index:70;padding:16px}
.modal-back.on{display:flex}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);
  width:min(720px,100%);max-height:84vh;display:flex;flex-direction:column}
.modal-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);font-weight:700}
.modal-b{padding:10px 14px;overflow:auto}
.icon-btn{margin-left:auto;border:none;background:none;cursor:pointer;font-size:15px;color:var(--ink-2)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-mark">M</span><span>MES · Q-SIM</span></div>
  <div class="crumb">품질설계 › <b>시뮬레이션</b></div>
  <span class="mock-flag">MOCK-UP</span>
</header>

<div class="srcbar">
  <span class="pill gy" id="src-badge">기준 출처 확인 중…</span>
  <span class="pill gy" title="생산범위 시트는 Full Hard(도금 전 원판) 치수 기준이나, 주문두께→Full Hard 환산식이 기준정보에 없습니다">Full Hard 환산: 주문두께 그대로(가정)</span>
  <span class="f-spacer"></span>
  <span class="cell-sub" id="src-detail"></span>
</div>

<div class="simwrap">
  <aside class="lpane" id="lpane" aria-label="검증 케이스와 주문 입력">
    <div class="sec-h">검증 케이스 <span class="n" id="case-cnt">0건</span></div>
    <div class="pad">
      <div style="display:flex;gap:4px;margin-bottom:6px">
        <button class="btn btn-sm" data-action="case-new">＋ 신규</button>
        <button class="btn btn-sm btn-pri" data-action="run-all">전체 재실행</button>
        <button class="btn btn-sm" data-action="reset-all" title="시드로 초기화">초기화</button>
      </div>
      <input class="inp" id="case-q" type="search" placeholder="⌕ 케이스·주문번호" style="margin-bottom:6px">
      <div id="case-list" role="listbox" aria-label="검증 케이스 목록"></div>
    </div>

    <div class="sec-h">주문 입력 <span class="n" id="order-src"></span></div>
    <div class="pad">
      <div class="fr">
        <label for="order-load">OMS 주문 불러오기</label>
        <select class="inp" id="order-load"><option value="">선택…</option></select>
      </div>
      <div id="order-core"></div>
      <details id="order-extra">
        <summary>추가 항목 <span id="order-extra-n">0</span>개</summary>
        <div id="order-extra-body"></div>
      </details>
      <p class="f-hint">빈칸 = 미입력(NULL) · <b>0 은 0 으로 평가</b>됩니다</p>
    </div>

    <div class="sec-h">변경 이력 <span class="n" id="log-cnt">0건</span></div>
    <div class="pad"><div id="log-list"></div></div>
  </aside>

  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="목록 폭 조절 — 드래그 또는 ←/→ 키, 더블클릭 시 기본 폭"></div>

  <main class="cpane" aria-label="시뮬레이션 결과">
    <div class="actbar">
      <b class="mono" id="run-case">—</b>
      <span class="cell-sub" id="run-name"></span>
      <span id="run-badges"></span>
      <span class="f-spacer"></span>
      <button class="btn btn-sm" data-action="promote" disabled>승격</button>
      <button class="btn btn-sm btn-pri" data-action="run">▶ 실행</button>
    </div>
    <nav class="pipe" id="pipe" role="tablist" aria-label="기준 파이프라인 6단계"></nav>
    <section class="panel" id="stage-panel" role="tabpanel"></section>
    <section class="panel" id="expect-panel"></section>
  </main>

  <aside class="rpane" id="rpane" aria-label="근거 추적"></aside>
</div>

<div class="modal-back" id="modal-back" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
    <div class="modal-h"><span id="modal-title"></span><button class="icon-btn" data-action="modal-close" aria-label="닫기">✕</button></div>
    <div class="modal-b" id="modal-body"></div>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="true"></div>

<script>

/*__PLTCM_ENGINE_START__*/

      { key: 'thkMng',  num: false, src: 'order.ORD_THK_MNG_CD' },

      { key: 'wid',     num: true,  src: 'derived.applyWidth' }

function specOrgCd(o){return codeStr(o&&o.SPC_AVR).slice(0,2).toUpperCase();}
function normRtsRule(r,i){
  var keys=['prod','org','spec','use','cust','thkKind','thkMng','coat','thk','wid'],cond={};
  keys.forEach(function(k){var c=(r.cond||{})[k];
    cond[k]=c?{op:c.op||'NOT_CHECK',v1:c.v1==null?'':c.v1,v2:c.v2==null?'':c.v2}:{op:'NOT_CHECK',v1:'',v2:''};});
  return {id:r.id||('TS-'+('00'+(i+1)).slice(-3)),no:r.no,status:r.status||'Y',cond:cond,adj:+r.adj,unit:r.unit||'CRN'};
}
function buildThkCriteria(rts,spc,tol,coat){
  var liveRts=!!(rts&&rts.rules&&rts.rules.length), liveSp=!!(spc&&Array.isArray(spc.rules)),
      liveTol=!!(tol&&Array.isArray(tol.rules)), liveCoat=!!(coat&&Array.isArray(coat.rows));
  var coatMap={};
  if(liveCoat)coat.rows.forEach(function(r){if(codeStr(r.status||'Y')==='Y'&&codeStr(r.code))coatMap[codeStr(r.code)]=Number(r.thkUm);});
  else coatMap=SEED_COAT_THK;
  return {
    setCorrection:{live:liveRts,defs:null,rules:(liveRts?rts.rules:SEED_RTS.rules).map(normRtsRule)},
    spCorrection: {live:liveSp, defs:null,rules:liveSp?spc.rules:SEED_SP_RULES},
    thkTolerance: {live:liveTol,defs:null,rules:liveTol?tol.rules:SEED_TOL_RULES},
    coatThk:      {live:liveCoat,map:coatMap}
  };
}
function masterCodeMap(mc,id){
  if(!Array.isArray(mc))return null;
  var rec=mc.filter(function(r){return r&&String(r.id).toUpperCase()===id;})[0];
  if(!rec||!Array.isArray(rec.codes))return null;
  var m={};rec.codes.forEach(function(c){m[codeStr(c.code)]=c.decode||'';});return m;
}
/* 주문두께구분 기본값 (스펙 4.2): 규격약호관리 두께관리기준을 엔진 매처로 판정. 칼라 품명도 같은 규칙 */
function thkTpFromSpec(order,thkRules){
  var org=specOrgCd(order), alias=ORG_ALIAS[org]||org;
  var table={defs:[{key:'spec',num:false,src:'order.SPC_ORG_CD'}],
    rules:(thkRules||[]).map(function(r){return {id:r.id,no:r.no,status:r.status,thkStd:r.thkStd,
      cond:{spec:{op:r.specOp||'=',v1:r.spec,v2:''}}};})};
  var hits=PltcmThicknessEngine.matchRules(table,{order:{SPC_ORG_CD:alias},request:{},layers:{}},{});
  if(!hits.length)return {tp:'1',found:false,org:org};
  var std=codeStr(hits[0].thkStd).toUpperCase();
  if(std==='BMT')return {tp:'1',found:true,org:org};
  if(std==='TCT')return {tp:'2',found:true,org:org};
  return {tp:'1',found:false,org:org};
}
function defaultThkTp(order,thkRules){return thkTpFromSpec(order,thkRules).tp;}
/* 주문폭을 n 등분 (소수 1자리, 합계 보정) — 시드 주문의 ORD_MIX_WTH 채움용 */
function splitWidths(total,n){
  var each=Math.floor((total/n)*10)/10,out=[],acc=0;
  for(var i=0;i<n-1;i++){out.push(each);acc=+(acc+each).toFixed(1);}
  out.push(+(total-acc).toFixed(1));return out;
}
function readLS(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}}

/* 내장 시드에서 생산가부 셀 초기값 만들기 */
function seedCells(){var c={};SEED_SHEETS.forEach(function(s){
  c[s.key]=s.groups.map(function(g){return g.seed.slice();});});return c;}

var CRIT=null;
function loadCriteria(){
  var oc=readLS(CRIT_KEYS.consistency), pf=readLS(CRIT_KEYS.feasibility),
      ow=readLS(CRIT_KEYS.weight), qs=readLS(CRIT_KEYS.spec);
  var rts=readLS(CRIT_KEYS.rts), sc=readLS(CRIT_KEYS.specCode), mc=readLS(CRIT_KEYS.masterCode),
      spc=readLS(CRIT_KEYS.sp), tol=readLS(CRIT_KEYS.tol), coat=readLS(CRIT_KEYS.coat);
  var live={consistency:!!(oc&&oc.rules&&oc.rules.length),
            feasibility:!!(pf&&pf.cells),
            weight:!!(ow&&ow.min!=null),
            spec:!!(qs&&qs.specs&&qs.specs.length)};
  /* 생산가부: 라이브 셀은 전 시트를 담고 있으므로 내장 시트 정의와 키가 겹치는 것만 채택 */
  var cells=seedCells();
  if(live.feasibility){SEED_SHEETS.forEach(function(s){
    if(pf.cells[s.key]&&pf.cells[s.key].length===s.groups.length)cells[s.key]=pf.cells[s.key];});}
  var n=0;for(var k in live)if(live[k])n++;
  CRIT={
    rules:  live.consistency?oc.rules:SEED_RULES,
    fields: live.consistency?oc.fields:SEED_FIELDS,
    vlabels:live.consistency?(oc.valueLabels||SEED_VLABELS):SEED_VLABELS,
    ruleMeta:SEED_RULEMETA,
    sheets: SEED_SHEETS,
    cells:  cells,
    weight: live.weight?{min:ow.min,max:ow.max,overrides:ow.overrides||{}}
                       :{min:4.0,max:5.0,overrides:{}},
    specs:  live.spec?qs.specs:SEED_SPECS,
    dict:   live.spec?qs.dict:SEED_DICT,
    base:   SEED_BASE,
    live:live, mode:(n===4?'live':(n===0?'fallback':'mixed')), ruleTotal:138
  };
  CRIT.thk=buildThkCriteria(rts,spc,tol,coat);
  CRIT.thkRulesLive=!!(sc&&Array.isArray(sc.thkRules)&&sc.thkRules.length);
  CRIT.thkRules=CRIT.thkRulesLive?sc.thkRules:SEED_THK_RULES;
  CRIT.mngCodes=masterCodeMap(mc,'ORD_THK_MNG_CD')||SEED_MNG_CODES;
  return CRIT;
}

    ' · SP/공차/도금두께 '+((th.spCorrection.live&&th.thkTolerance.live&&th.coatThk.live)?'라이브':'임시 시드');

function fieldLabel(key){
  for(var i=0;i<CRIT.fields.length;i++)if(CRIT.fields[i].key===key)return CRIT.fields[i].label||key;
  return FALLBACK_LABEL[key]||key;
}
function fieldType(key){
  for(var i=0;i<CRIT.fields.length;i++)if(CRIT.fields[i].key===key)return CRIT.fields[i].type||'string';
  return NUM_FIELDS.indexOf(key)>=0?'number':'string';
}
function valueLabel(field,code){
  for(var i=0;i<CRIT.vlabels.length;i++){var v=CRIT.vlabels[i];
    if(v.field===field&&String(v.code)===String(code))return v.label;}
  return null;
}

/* ============================================================
   ④ 생산가부 — 축 매퍼 (신규: 원본 모듈에 없던 변환)
   ============================================================ */
function axisNum(label){if(label==null)return NaN;
  var s=String(label).replace(/[↑↓]/g,'').replace(/,/g,'').trim();
  return s===''?NaN:Number(s);}

/* widths 는 내림차순 라벨. 행 i = [L(i), L(i-1)) — "그 값 이상, 위 행 값 미만" */
function widthRow(widths,W){
  var w=typeof W==='number'?W:axisNum(W);
  if(!isFinite(w))return {row:null,out:'nan'};
  var L=widths.map(axisNum);
  if(w>L[0])return {row:0,out:'above'};
  for(var i=0;i<L.length;i++)if(w>=L[i])return {row:i,out:null};
  return {row:null,out:'below'};
}
/* thicks 는 오름차순. 열 j = [T(j), T(j+1)) */
function thickCol(thicks,T){
  var t=typeof T==='number'?T:axisNum(T);
  if(!isFinite(t))return {col:null,out:'nan'};
  var A=thicks.map(axisNum), last=A.length-1;
  if(t<A[0])return {col:null,out:'below'};
  if(t>A[last])return {col:last,out:'above'};
  for(var j=last;j>=0;j--)if(t>=A[j])return {col:j,out:null};
  return {col:null,out:'below'};
}
var CODE_RE=/^[0-9A-Z]{2}$/;
/* '재질코드(Material Code) = 1A, AA, BA' → 코드 집합. 'EC 외 Code' 같은 자유 텍스트는 fuzzy */
function parseCodes(txt){
  var s=String(txt==null?'':txt), eq=s.indexOf('=');
  if(eq<0)return {codes:[],fuzzy:true};
  var toks=s.slice(eq+1).split(','), codes=[], fuzzy=false;
  for(var i=0;i<toks.length;i++){
    var t=toks[i].trim().toUpperCase();
    if(t==='')continue;
    if(CODE_RE.test(t)){codes.push(t);continue;}
    var head=t.split(/\s+/)[0];
    if(CODE_RE.test(head))codes.push(head);
    fuzzy=true;
  }
  return {codes:codes,fuzzy:fuzzy};
}
function matGroup(sheet,matCd){
  var m=String(matCd==null?'':matCd).trim().toUpperCase();
  if(m==='')return {gi:null,fuzzy:false};
  var fuzzy=false;
  for(var i=0;i<sheet.groups.length;i++){
    var p=parseCodes(sheet.groups[i].codes);
    if(p.fuzzy)fuzzy=true;
    if(p.codes.indexOf(m)>=0)return {gi:i,fuzzy:p.fuzzy};
  }
  return {gi:null,fuzzy:fuzzy};
}
var STATES={'-':'생산불가','P':'생산가능','C':'조건부 생산','X':'생산불가 (검증 완료)'};
function isOverlay(g,w,t){return !!(g.overlay&&w<g.overlay.rows&&t<g.overlay.cols);}

function feasibilityForSheet(sheet,cells,fo){
  var out={sheetKey:sheet.key,sheetTab:sheet.tab,gi:null,groupName:null,
           row:null,col:null,rowLabel:null,colLabel:null,
           state:null,stateName:null,reason:null,flags:[]};
  var mg=matGroup(sheet,fo.MAT_CD);
  if(mg.fuzzy)out.flags.push('codes-fuzzy');
  if(mg.gi==null){out.reason='group-unknown';return out;}
  out.gi=mg.gi;
  var g=sheet.groups[mg.gi];
  out.groupName=g.name;
  var wr=widthRow(g.widths,fo.width);
  if(wr.row==null){out.reason='width-'+wr.out;return out;}
  if(wr.out)out.flags.push('width-'+wr.out);
  out.row=wr.row;out.rowLabel=g.widths[wr.row];
  var tc=thickCol(g.thicks,fo.thick);
  if(tc.col==null){out.reason='thick-'+tc.out;return out;}
  out.col=tc.col;out.colLabel=g.thicks[tc.col];
  if(isOverlay(g,wr.row,tc.col)){out.reason='overlay';return out;}
  var grid=cells[sheet.key];
  if(!grid||!grid[mg.gi]||!grid[mg.gi][wr.row]){out.reason='no-data';return out;}
  out.state=grid[mg.gi][wr.row].charAt(tc.col)||null;
  out.stateName=out.state?(STATES[out.state]||null):null;
  if(tc.out){out.flags.push('thick-'+tc.out);}
  return out;
}
function scanAllSheets(sheets,cells,fo){
  return sheets.map(function(s){return feasibilityForSheet(s,cells,fo);});
}

/* ============================================================
   ② 주문 정합성 — 룰 평가 (원본 modules/order-consistency.html 규칙 그대로)
   ============================================================ */
var ORDINAL_OPS={GT:1,GE:1,LT:1,LE:1,BETWEEN:1};
var NUM_RE=/^-?(\d+(\.\d+)?|\.\d+)$/;
function isNumStr(s){return NUM_RE.test(String(s).trim());}
function isNullVal(v){return v==null||String(v).trim()==='';}

/* state: P 충족 · F 불충족 · N NULL(룰 스킵) · X 형식오류 · T 타입부적합(룰 스킵) */
function evalCond(cond,order){
  var raw=order[cond.field];
  var r={cond:cond,orderValue:raw,pass:false,state:'F'};
  if(cond.op==='IS_NULL'){r.pass=isNullVal(raw);r.state=r.pass?'P':'F';return r;}
  if(cond.op==='NOT_NULL'){r.pass=!isNullVal(raw);r.state=r.pass?'P':'F';return r;}
  if(isNullVal(raw)){r.state='N';return r;}

  var type=fieldType(cond.field), numeric=false, x=null;
  if(type==='number'){
    x=Number(String(raw).trim());
    if(!isFinite(x)){r.state='X';return r;}
    numeric=true;
  }else if(ORDINAL_OPS[cond.op]){
    /* 사전식 문자열 비교 금지 — 양쪽이 숫자 문자열일 때만 숫자로 본다 */
    var cmp=(cond.op==='BETWEEN')?[cond.low,cond.high]:(cond.values||[]);
    var allNum=isNumStr(raw)&&cmp.every(function(v){return isNumStr(v);});
    if(!allNum){r.state='T';return r;}
    x=Number(String(raw).trim());numeric=true;
  }

  var vs=cond.values||[];
  switch(cond.op){
    case 'EQ':  r.pass=numeric?(x===Number(vs[0])):(String(raw)===String(vs[0]));break;
    case 'NE':  r.pass=numeric?(x!==Number(vs[0])):(String(raw)!==String(vs[0]));break;
    case 'IN':  r.pass=vs.some(function(v){return numeric?(x===Number(v)):(String(raw)===String(v));});break;
    case 'NOT_IN':r.pass=!vs.some(function(v){return numeric?(x===Number(v)):(String(raw)===String(v));});break;
    case 'GT':  r.pass=x>Number(vs[0]);break;
    case 'GE':  r.pass=x>=Number(vs[0]);break;
    case 'LT':  r.pass=x<Number(vs[0]);break;
    case 'LE':  r.pass=x<=Number(vs[0]);break;
    case 'BETWEEN':
      r.pass=(cond.lowInclusive?x>=cond.low:x>cond.low)&&
             (cond.highInclusive?x<=cond.high:x<cond.high);break;
    default: r.pass=false;
  }
  r.state=r.pass?'P':'F';
  return r;
}

function evaluateRules(rules,order){
  var fired=[],skipN=0,skipX=0,skipT=0,nullMap={},evaluated=0;
  rules.forEach(function(rule){
    if(rule.enabled===false)return;
    evaluated++;
    var conds=(rule.context||[]).concat(rule.when||[]);
    var results=conds.map(function(c){return evalCond(c,order);});
    var hasX=results.some(function(r){return r.state==='X';});
    var hasT=results.some(function(r){return r.state==='T';});
    var hasF=results.some(function(r){return r.state==='F';});
    var hasN=results.some(function(r){return r.state==='N';});
    if(hasX){skipX++;return;}
    if(hasT){skipT++;return;}
    if(hasN){
      if(!hasF){ /* 미입력 탓에 판정 못 한 것만 집계 */
        skipN++;
        results.forEach(function(r){
          if(r.state!=='N')return;
          var f=r.cond.field;
          nullMap[f]=nullMap[f]||{field:f,label:fieldLabel(f),rules:0,ids:[]};
          nullMap[f].rules++;
          if(nullMap[f].ids.length<8)nullMap[f].ids.push(rule.id);
        });
      }
      return;
    }
    if(results.every(function(r){return r.state==='P';}))fired.push({rule:rule,condResults:results});
  });
  var nullFields=Object.keys(nullMap).map(function(k){return nullMap[k];})
    .sort(function(a,b){return b.rules-a.rules||a.label.localeCompare(b.label,'ko');});
  /* 같은 항목에서 서로 다른 에러코드가 2건 이상이면 동시발화 */
  var byItem={};
  fired.forEach(function(f){var it=(f.rule.target||{}).item||'';(byItem[it]=byItem[it]||[]).push(f);});
  Object.keys(byItem).forEach(function(it){
    var g=byItem[it];if(g.length<2)return;
    var codes={};g.forEach(function(f){codes[(f.rule.error||{}).code]=1;});
    if(Object.keys(codes).length>=2)g.forEach(function(f){f.coGroup=it;});
  });
  var CAT={'누락':0,'사용불가':1,'불필요':2,'한도위반':3,'선택오류':4};
  fired.sort(function(a,b){
    var ca=CAT[(a.rule.error||{}).category], cb=CAT[(b.rule.error||{}).category];
    if(ca==null)ca=9;if(cb==null)cb=9;
    return ca-cb||String(a.rule.id).localeCompare(String(b.rule.id));
  });
  return {fired:fired,skippedByNull:skipN,skippedByFormat:skipX,skippedByType:skipT,
          nullFields:nullFields,evaluated:evaluated};
}

/* ============================================================
   ③ 주문단중
   ============================================================ */
function baseSplitVal(row,col){return Math.round(row/col*100)/100;}
function weightCellVal(st,row,col){
  var key=Number(row).toFixed(1)+'-'+col;
  var o=st.overrides[key];
  return typeof o==='number'?o:baseSplitVal(row,col);
}
function inWeightRange(st,v){
  var lo=Number(st.min),hi=Number(st.max);
  if(!isFinite(lo)||!isFinite(hi))return false;
  return v>=lo-1e-9&&v<=hi+1e-9;
}
function judgeWeight(st,w){
  var out={value:null,pass:false,okSplits:[],reason:null};
  if(w.weight==null){out.reason='weight-null';return out;}
  if(w.split==null){out.reason='split-null';return out;}
  if(w.split===0){out.reason='split-zero';return out;}
  for(var c=2;c<=10;c++)if(inWeightRange(st,weightCellVal(st,w.weight,c)))out.okSplits.push(c);
  out.value=weightCellVal(st,w.weight,w.split);
  out.pass=inWeightRange(st,out.value);
  return out;
}

/* ============================================================
   ⑤ 품질사양 매칭 — 원본 modules/quality-spec.html 규칙 유지
      · 조건 0개 사양은 무조건 매칭 (every() 성질)
      · 오버라이드는 specNo 오름차순, 나중 사양이 이긴다 (우선순위 필드 없음)
   ============================================================ */
function stripQ(s){return String(s==null?'':s).replace(/^['"]|['"]$/g,'').trim();}
function specAttr(o,code){
  if(code==='CUS_CD'||code==='FNL_CUS_CD')return o.cus;
  if(code==='PRD_NM_CD')return o.prd;
  var v=o.attrs[code];return v==null?null:v;
}
function cmpVal(op,ov,val){
  if(ov==null||ov==='')return false;
  var n=parseFloat(ov), sval=stripQ(val);
  switch(op){
    case '=': return String(ov).trim().toUpperCase()===sval.toUpperCase()||
                     (isFinite(n)&&isFinite(parseFloat(sval))&&n===parseFloat(sval));
    case '~': var m=sval.match(/^(-?[\d.]+)\s*~\s*(-?[\d.]+)$/);
              return !!m&&isFinite(n)&&n>=parseFloat(m[1])&&n<=parseFloat(m[2]);
    case '≥': return isFinite(n)&&n>=parseFloat(sval);
    case '≤': return isFinite(n)&&n<=parseFloat(sval);
    case '>': return isFinite(n)&&n>parseFloat(sval);
    case '<': return isFinite(n)&&n<parseFloat(sval);
  }
  return false;
}
function matchSpecs(ctx,o){
  var related=ctx.specs.filter(function(s){return s.cusCd===o.cus&&s.prdNm===o.prd;});
  var evals=related.map(function(s){
    var checks=(s.conds||[]).map(function(c){
      var ov=specAttr(o,c.code);
      return {c:c,ov:ov,pass:c.code?cmpVal(c.op,ov,c.val):false};
    });
    var matched=checks.every(function(ch){return ch.pass;});
    var eligible=(s.status==='확정'||s.status==='전송완료');
    return {s:s,checks:checks,matched:matched,eligible:eligible,applied:matched&&eligible};
  });
  var applied=evals.filter(function(e){return e.applied;})
                   .sort(function(a,b){return a.s.specNo>b.s.specNo?1:-1;});
  var draftHit=evals.filter(function(e){return e.matched&&!e.eligible;});
  var order=[],map={};
  ctx.base.forEach(function(b){
    var d=ctx.dict.filter(function(x){return x.code===b.code;})[0];
    map[b.code]={code:b.code,ko:d?d.ko:b.code,unit:d?d.unit:'',base:b.val,val:b.val,srcs:[]};
    order.push(b.code);
  });
  applied.forEach(function(e){(e.s.results||[]).forEach(function(r){
    var key=r.code||r.ko;
    if(!map[key]){map[key]={code:key,ko:r.ko,unit:r.unit||'',base:'—',val:'',srcs:[]};order.push(key);}
    var row=map[key];
    row.val=(r.op==='='||r.op==='~'?'':r.op+' ')+r.val;
    row.srcs.push(e.s.specNo);
  });});
  var rows=order.map(function(k){return map[k];});
  return {evals:evals,applied:applied,draftHit:draftHit,rows:rows,
          conflicts:rows.filter(function(r){return r.srcs.length>1;})};
}

/* 사양 어휘(BASE_DESIGN 8항목) 중 설계결과 어휘에 의미가 확실히 대응되는 것만 */
var SPEC_TO_DESIGN={CCL_BOM:'head.bom',PACK_CD:'post.pack',
  TOP_THK:'color.sum.thkT',RAW_MTRL:'cgl.lines.적정.1'};
/* 기준이 관장해야 마땅한 설계값만 「미커버」로 본다 — 전수 감시는 잡음 */
var GOVERNED_PATHS=['common.도금량코드','common.조질도','common.주문두께구분',
  'common.두께관리코드','common.폭관리코드','common.포장방법','common.권취방법',
  'head.bom','post.pack','color.sum.thkT','cgl.lines.적정.1'];

function mapSpecOverrides(rows){
  var mapped=[],unmapped=[];
  (rows||[]).forEach(function(r){
    if(!r.srcs||!r.srcs.length)return;
    var p=SPEC_TO_DESIGN[r.code];
    if(p)mapped.push({code:r.code,ko:r.ko,path:p,val:r.val,base:r.base,srcs:r.srcs});
    else unmapped.push({code:r.code,ko:r.ko,val:r.val,base:r.base,srcs:r.srcs});
  });
  return {mapped:mapped,unmapped:unmapped};
}
function anomaly(kind,sev,label,detail,ref){
  return {kind:kind,severity:sev,label:label,detail:detail,ref:ref};
}
function detectAnomalies(ctx){
  var out=[];
  /* 값이 비어 있는데 아무 기준도 지시하지 않은 것 = 진짜 구멍. 개별로 올린다. */
  var stdOnly=[];
  (ctx.designValues||[]).forEach(function(v){
    if(v.prov&&v.prov.length)return;
    var blank=(v.value==null||String(v.value).trim()==='');
    if(blank)out.push(anomaly('uncovered','error','미커버',
      '값이 비어 있고 이를 지시하는 기준도 없습니다.',v.path));
    else stdOnly.push(v.path);
  });
  /* 표준 디폴트만 있는 항목은 한 건으로 묶는다 — 개별로 올리면 매 실행 10건씩 쌓여 잡음이 된다 */
  if(stdOnly.length)
    out.push(anomaly('standard-only','info','표준값만',
      stdOnly.length+'개 항목이 고객 사양 없이 표준 기준값으로만 결정됐습니다: '+
      stdOnly.slice(0,4).join(' · ')+(stdOnly.length>4?' 외 '+(stdOnly.length-4)+'건':''),null));
  ((ctx.specMatch||{}).conflicts||[]).forEach(function(c){
    out.push(anomaly('conflict','warn','충돌',
      (c.ko||c.code)+' — 사양 '+c.srcs.join(' → ')+' (나중 사양이 이깁니다)',c.code));
  });
  (ctx.feasibility||[]).forEach(function(f){
    (f.flags||[]).forEach(function(fl){
      if(fl.indexOf('-above')>0||fl.indexOf('-below')>0)
        out.push(anomaly('range','warn','범위 위반',
          f.sheetTab+' — '+fl+' (생산범위 축을 벗어나 참고값입니다)',f.sheetKey));
    });
  });
  var co=ctx.consistency||{};
  var skipped=(co.skippedByNull||0)+(co.skippedByFormat||0)+(co.skippedByType||0);
  if(skipped>0){
    var causes=(co.nullFields||[]).slice(0,4).map(function(n){return n.label||n.field;});
    out.push(anomaly('unevaluated','warn','미평가',
      skipped+'건의 룰을 판정하지 못했습니다 — 통과가 아닙니다.'+
      (causes.length?' 원인: '+causes.join(' · '):''),null));
  }
  var meta=ctx.ruleMeta||{};
  (co.fired||[]).forEach(function(f){
    var id=f.rule&&f.rule.id;
    if(id&&meta[id]&&meta[id]!=='auto')
      out.push(anomaly('lineage','warn','계보 경고',
        id+' 룰이 '+meta[id]+' 상태입니다 — 이 판정의 근거 자체를 확인해야 합니다.',id));
  });
  if(ctx.missingSheet)
    out.push(anomaly('no-criteria','warn','기준 부재',
      ctx.missingSheet+' 생산범위 시트가 없어 주공정을 판정하지 못했습니다.',ctx.missingSheet));
  mapSpecOverrides((ctx.specMatch||{}).rows).unmapped.forEach(function(u){
    out.push(anomaly('spec-unmapped','warn','사양 미연결',
      (u.ko||u.code)+' — 사양은 '+u.val+' 를 지시하지만 설계결과에 대응 항목이 없습니다.',u.code));
  });
  return out;
}

   파이프라인 ①~⑥ — 차단돼도 멈추지 않는다
   ============================================================ */
var ROUTE_TO_SHEET={'21A000':'2cgl-gi','35A000':'5cgl','27A000':null};
var ROUTE_TO_LINE ={'21A000':'2CGL','35A000':'5CGL','27A000':'7CGL'};
var REQUIRED=['PRD_NM_CD','SPC_AVR','MAT_CD','ORD_EXC_THK','ORD_EXC_WTH','FNL_CUS_CD'];

function stage(no,name,verdict,detail,extra){
  var s={no:no,name:name,verdict:verdict,detail:detail,blocked:false,advisory:false,missingSheet:null};
  if(extra)for(var k in extra)s[k]=extra[k];
  return s;
}
function runPipeline(ctx,order){
  var stages=[];
  var missing=REQUIRED.filter(function(k){return order[k]==null||String(order[k]).trim()==='';});
  stages.push(stage(1,'주문 입력 검증',missing.length?'F':'P',{missing:missing}));

  var co=evaluateRules(ctx.rules,toConsistency(order));
  stages.push(stage(2,'주문 정합성',co.fired.length?'F':'P',co));

  var wj=judgeWeight(ctx.weight,toWeight(order));
  stages.push(stage(3,'주문단중 에러',wj.reason?null:(wj.pass?'P':'F'),wj));

  /* 통과공정을 알아야 주공정 시트를 고를 수 있어 ⑥을 먼저 계산한다 */
  var design=genDetail(toDesign(order));
  var routeNo=design.route.no;
  var mainKey=ROUTE_TO_SHEET[routeNo];
  var missingSheet=mainKey?null:(ROUTE_TO_LINE[routeNo]||routeNo);

  var fo=toFeasibility(order);
  var scan=scanAllSheets(ctx.sheets,ctx.cells,fo);
  var mine=mainKey?scan.filter(function(r){return r.sheetKey===mainKey;})[0]:null;
  var s4=stage(4,'생산 가부',mine?mine.state:null,
    {scan:scan,main:mine,mainLine:ROUTE_TO_LINE[routeNo]||null},{missingSheet:missingSheet});
  s4.blocked=!!(mine&&(mine.state==='-'||mine.state==='X'));
  stages.push(s4);

  var sm=matchSpecs({specs:ctx.specs,dict:ctx.dict,base:ctx.base},toSpecMatch(order));
  stages.push(stage(5,'품질사양 매칭',sm.applied.length?'P':null,sm));
  stages.push(stage(6,'설계값 산출','P',{design:design}));

  var blockedAt=-1;
  for(var i=0;i<stages.length;i++)if(stages[i].blocked){blockedAt=i;break;}
  if(blockedAt>=0)for(var j=blockedAt+1;j<stages.length;j++)stages[j].advisory=true;

  var ovr={};
  mapSpecOverrides(sm.rows).mapped.forEach(function(m){ovr[m.path]=m;});
  var designValues=GOVERNED_PATHS.map(function(p){
    return {path:p,value:pinResolve(design,p),prov:ovr[p]?[{kind:'사양'}]:[]};
  }).filter(function(v){
    /* 도장 제품이 아니면 칼라·BOM 경로는 애초에 감시 대상이 아니다 */
    if(!design.color&&(v.path.indexOf('color.')===0||v.path==='head.bom'))return false;
    return true;
  });

  var anomalies=detectAnomalies({designValues:designValues,specMatch:sm,consistency:co,
    feasibility:mine?[mine]:[],ruleMeta:ctx.ruleMeta,missingSheet:missingSheet});

  return {stages:stages,design:design,specMatch:sm,anomalies:anomalies,
          mainLine:ROUTE_TO_LINE[routeNo]||null,missingSheet:missingSheet,blockedAt:blockedAt};
}

/* ============================================================
   케이스 — pin 조회 · 기대값 합불 · 골든 스냅샷/diff
   ============================================================ */
function isRowArray(v){return Object.prototype.toString.call(v)==='[object Array]'&&
  v.length>0&&Object.prototype.toString.call(v[0])==='[object Array]';}

/* path 문법: <섹션>.<블록>.<라벨>[.<열번호>] — 마지막 마디는 인덱스가 아니라 라벨 */
function pinResolve(d,path){
  var parts=String(path||'').split('.'), cur=d;
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    if(cur==null)return undefined;
    if(isRowArray(cur)){
      var hit=null;
      for(var j=0;j<cur.length;j++)if(String(cur[j][0])===p){hit=cur[j];break;}
      if(!hit)return undefined;
      var nxt=parts[i+1];
      if(nxt!=null&&/^\d+$/.test(nxt)){cur=hit[Number(nxt)];i++;}
      else cur=hit[1];
      continue;
    }
    if(typeof cur!=='object')return undefined;
    cur=cur[p];
  }
  return cur;
}
function pinCompare(op,actual,expected){
  var a=actual==null?'':String(actual).trim(), e=String(expected==null?'':expected).trim();
  if(op==='~')return a.indexOf(e)>=0;
  if(op==='≠')return a!==e;
  var na=parseFloat(a), ne=parseFloat(e);
  if(isFinite(na)&&isFinite(ne)&&a!==''&&e!=='')return na===ne;
  return a===e;
}
function checkPins(d,pins){
  var results=(pins||[]).map(function(p){
    var actual=pinResolve(d,p.path);
    return {pin:p,actual:actual,ok:pinCompare(p.op||'=',actual,p.val)};
  });
  return {results:results,pass:results.filter(function(r){return r.ok;}).length,total:results.length};
}
function checkVerdicts(run,verdicts){
  var results=(verdicts||[]).map(function(v){
    var st=run.stages.filter(function(s){return s.no===v.stage;})[0];
    if(!st)return {verdict:v,actual:null,ok:false};
    if(v.expectErrorCode){
      var codes=((st.detail||{}).fired||[]).map(function(f){return (f.rule.error||{}).code;});
      return {verdict:v,actual:codes,ok:codes.indexOf(v.expectErrorCode)>=0};
    }
    return {verdict:v,actual:st.verdict,ok:st.verdict===v.expect};
  });
  return {results:results,pass:results.filter(function(r){return r.ok;}).length,total:results.length};
}
function goldenSnapshot(d,prefix,acc){
  acc=acc||{};prefix=prefix||'';
  if(d==null)return acc;
  if(isRowArray(d)){
    d.forEach(function(row){
      var head=String(row[0]);
      if(row.length<=3&&(row.length===2||typeof row[2]==='string'&&row[2].length<=4))
        acc[prefix+head]=row[1];
      else for(var c=1;c<row.length;c++)acc[prefix+head+'.'+c]=row[c];
    });
    return acc;
  }
  if(Object.prototype.toString.call(d)==='[object Array]'){
    d.forEach(function(v,i){goldenSnapshot(v,prefix+i+'.',acc);});return acc;
  }
  if(typeof d==='object'){
    for(var k in d)if(d.hasOwnProperty(k))goldenSnapshot(d[k],prefix+k+'.',acc);
    return acc;
  }
  acc[prefix.replace(/\.$/,'')]=d;
  return acc;
}
function goldenDiff(before,after){
  var keys={},out=[],k;
  for(k in before)keys[k]=1;
  for(k in after)keys[k]=1;
  Object.keys(keys).sort().forEach(function(k){
    if(String(before[k])!==String(after[k]))out.push({path:k,before:before[k],after:after[k]});
  });
  return out;
}
function caseStatus(c){
  if((c.pinFail||0)>0||(c.verdictFail||0)>0||(c.goldenDiff||0)>0)return 'FAIL';
  if((c.anomalies||0)>0)return '경고';
  return 'PASS';
}

function computeCase(c){
  var r=runPipeline(CRIT,c.order);
  var pins=checkPins(r.design,c.expect.pins);
  var vers=checkVerdicts(r,c.expect.verdicts);
  var gd=c.expect.golden?goldenDiff(c.expect.golden,goldenSnapshot(r.design)):[];
  c.lastRun={at:Date.now(),
    status:caseStatus({pinFail:pins.total-pins.pass,verdictFail:vers.total-vers.pass,
                       goldenDiff:gd.length,
                       anomalies:r.anomalies.filter(function(a){return a.severity!=='info';}).length}),
    pinPass:pins.pass,pinTotal:pins.total,
    verdictPass:vers.pass,verdictTotal:vers.total,
    goldenDiff:gd,anomalies:r.anomalies};
  return r;
}
function doRun(){
  var c=currentCase();if(!c)return;
  run=computeCase(c);
  ui.stage=run.blockedAt>=0?run.blockedAt+1:6;
  ui.provPath=null;
  saveState();renderAll();
  toast('실행 완료 — '+c.lastRun.status);
}
function runAll(){
  var keep=state.sel,n=0;
  state.cases.forEach(function(c){computeCase(c);n++;});
  state.sel=keep;

function condPhrase(c){
  var v=(c.values||[]).map(function(x){
    var lb=valueLabel(c.field,x);return lb?(x+' ('+lb+')'):String(x);}).join(', ');
  switch(c.op){
    case 'IS_NULL':return '이(가) 비어 있음';
    case 'NOT_NULL':return '이(가) 입력됨';
    case 'IN':return '이(가) ['+v+'] 중 하나';
    case 'NOT_IN':return '이(가) ['+v+'] 에 없음';
    case 'BETWEEN':return '이(가) '+c.low+(c.lowInclusive?' ≤':' <')+' x '+
                          (c.highInclusive?'≤ ':'< ')+c.high;
    case 'GT':return '> '+v; case 'GE':return '≥ '+v;
    case 'LT':return '< '+v; case 'LE':return '≤ '+v;
    case 'NE':return '≠ '+v; default:return '= '+v;
  }
}
function firedCard(f){
  var e=f.rule.error||{};
  var meta=CRIT.ruleMeta[f.rule.id];
  return '<div class="match-card"><div class="match-h">'+
    '<span class="cc-no">✕</span><span class="code-badge">'+esc(e.code)+'</span>'+
    '<span>'+esc(e.message||'')+'</span>'+
    (f.coGroup?'<span class="pill warn">동시발화</span>':'')+
    (meta&&meta!=='auto'?'<span class="pill warn">'+esc(meta)+'</span>':'')+
    '<span class="m-badge miss mono">'+esc(f.rule.id)+'</span></div>'+
    '<div class="cond-check">'+f.condResults.map(function(r){
      var val=r.orderValue;
      var lb=val==null||val===''?null:valueLabel(r.cond.field,val);
      return '<div class="row"><span class="'+(r.pass?'cc-ok':'cc-no')+'">'+(r.pass?'✓':'✕')+'</span>'+
        '<span>'+esc(fieldLabel(r.cond.field))+' '+esc(condPhrase(r.cond))+'</span>'+
        '<span class="cell-sub">주문값: <b class="mono">'+
        (val==null||val===''?'(미입력)':esc(val)+(lb?' ('+esc(lb)+')':''))+'</b></span></div>';
    }).join('')+
    '<div class="cell-sub" style="margin-top:3px">조치: '+esc(e.actor||'미지정')+
    ' · 유형: '+esc(e.category||'')+'</div></div></div>';
}
function specCard(e){
  var badge=e.applied?'<span class="m-badge hit">✓ 적용</span>'
    :e.matched?'<span class="m-badge skip">△ 조건 충족 · 미확정 제외</span>'
    :'<span class="m-badge miss">✕ 조건 불일치</span>';
  return '<div class="match-card"><div class="match-h">'+
    '<span class="mono">'+esc(e.s.specNo)+'</span>'+
    '<span class="pill '+(e.s.status==='확정'?'sent':e.s.status==='전송완료'?'ac':'draft')+'">'+
    esc(e.s.status)+'</span>'+badge+'</div><div class="cond-check">'+
    (e.checks.length?e.checks.map(function(ch){
      return '<div class="row"><span class="'+(ch.pass?'cc-ok':'cc-no')+'">'+(ch.pass?'✓':'✕')+'</span>'+
        '<span>'+esc(ch.c.ko)+' '+esc(ch.c.op)+' <b class="mono">'+esc(ch.c.val)+'</b></span>'+
        '<span class="cell-sub">주문값: <b class="mono">'+
        (ch.ov==null||ch.ov===''?'(없음)':esc(ch.ov))+'</b></span></div>';
    }).join(''):'<div class="cell-sub">조건 없음 — 이 고객사·품명이면 무조건 적용됩니다.</div>')+
    (e.matched&&!e.eligible?'<div class="pv-issue wa" style="margin-top:4px">'+
      '△ 작성중 상태 — 확정·전송 후 실제 설계에 반영됩니다</div>':'')+
    '<div style="margin-top:4px">'+(e.s.results||[]).map(function(r){
      return '<span class="code-badge">'+esc(r.ko)+' '+esc(r.op)+' '+esc(r.val)+'</span> ';
    }).join('')+'</div></div></div>';
}

function kvOf(rows,label){
  for(var i=0;i<rows.length;i++)if(rows[i][0]===label)return rows[i][1];
  return '';
}
function kvGrid(items,sectionId){
  return '<div class="kv-grid">'+items.map(function(it){
    var path=sectionId+'.'+it[0];
    var cls='val'+(ui.provPath===path?' on':'')+(isUncovered(path)?' bad':'');
    return '<div class="kv'+(it[2]==='wide'?' wide':'')+'"><label>'+esc(it[0])+'</label>'+
      '<button type="button" class="'+cls+'" data-action="prov" data-path="'+esc(path)+'">'+
      esc(it[1])+'</button></div>';
  }).join('')+'</div>';
}
function bandTable(groups,rows,first){
  var two=groups.some(function(g){return g.s;});
  var h1='<tr><th'+(two?' rowspan="2"':'')+'>'+esc(first||'사양구분')+'</th>', h2='<tr>';
  groups.forEach(function(g){
    if(g.s){h1+='<th class="c" colspan="'+g.s.length+'">'+esc(g.t)+'</th>';
      g.s.forEach(function(s){h2+='<th class="c">'+esc(s)+'</th>';});}
    else h1+='<th'+(two?' rowspan="2"':'')+'>'+esc(g.t)+'</th>';
  });
  h1+='</tr>';h2+='</tr>';
  var body=rows.map(function(r){
    return '<tr><td><b>'+esc(r[0])+'</b></td>'+r.slice(1).map(function(c){
      return '<td class="c">'+esc(c)+'</td>';}).join('')+'</tr>';
  }).join('');
  return '<div class="tbl-scroll"><table class="grid"><thead>'+h1+(two?h2:'')+'</thead><tbody>'+body+'</tbody></table></div>';
}
function isUncovered(path){
  return !!(run&&run.anomalies.some(function(a){return a.kind==='uncovered'&&a.ref===path;}));
}
function renderDesign(){
  var d=run.design;
  return SECS.map(function(s){
    var open=!!ui.openSec[s.id];
    var an=run.anomalies.filter(function(a){return a.ref&&String(a.ref).indexOf(s.id+'.')===0;});
    return '<div class="acc"><button type="button" class="acc-h" data-action="sec" data-id="'+s.id+'"'+
      ' aria-expanded="'+open+'">'+(open?'▾':'▸')+' '+esc(s.t)+
      (an.length?' <span class="pill fail">이상 '+an.length+'</span>':'')+
      '<span class="s">'+esc(s.sum(d))+'</span></button>'+
      (open?'<div class="acc-b">'+s.body(d)+'</div>':'')+'</div>';
  }).join('');
}

function provFor(path){
  var out=[], c=currentCase();
  if(c.asisSnapshot&&c.asisSnapshot[path]!==undefined)
    out.push({cls:'prv asis',label:'AS-IS 실제값',detail:String(c.asisSnapshot[path])+
      ' · '+(c.baseOrderRef||'')+' 최초 실행 스냅샷',
      jump:'#/quality-design/result-management/quality-design-result'});
  out.push({cls:'prv std',label:'표준 기준값',
    detail:'규격약호 · 품명 · 재질코드에서 산출 (설계 엔진)',jump:null});
  mapSpecOverrides(run.specMatch.rows).mapped.forEach(function(m){
    if(m.path!==path)return;
    out.push({cls:'prv',label:'사양 오버라이드',
      detail:m.srcs.join(' → ')+' → '+m.val+(m.srcs.length>1?' (나중 사양이 이깁니다)':''),
      jump:'#/quality-design/module-management/quality-spec'});
  });
  return out;
}

    (run.anomalies.length?run.anomalies.map(function(a){
      return '<div style="margin-bottom:5px;font-size:12px"><span class="pill '+
        (a.severity==='error'?'fail':a.severity==='info'?'gy':'warn')+'">'+esc(a.label)+
        '</span> '+esc(a.detail)+'</div>';
    }).join(''):'<div class="cell-sub">이상 없음</div>')+'</div>'):'';
  if(!run||!ui.provPath){
    r.innerHTML='<div class="sec-h">근거 추적</div><div class="empty">'+
      '<div class="big">값을 클릭하세요</div>설계결과(⑥)의 밑줄 친 값을 누르면 근거가 여기 쌓입니다.</div>'+anHtml;
    return;
  }
  var layers=provFor(ui.provPath);
  var c=currentCase();
  var pin=(c.expect.pins||[]).filter(function(p){return p.path===ui.provPath;})[0];
  var actual=pinResolve(run.design,ui.provPath);
  r.innerHTML='<div class="sec-h">근거 추적 <span class="n mono">'+esc(ui.provPath)+'</span></div><div class="pad">'+
    layers.map(function(p){
      return '<div class="'+p.cls+'"><b>'+esc(p.label)+'</b><br>'+esc(p.detail)+
        (p.jump?'<br><a class="jump" href="'+esc(p.jump)+'" data-action="jump">↳ 원본 화면 열기 →</a>':'')+'</div>';
    }).join('')+
    '<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:7px;font-size:12px">'+
    '<b>이 값의 기대값</b><br>'+
    (pin?('<span class="mono">'+esc(pin.op||'=')+' '+esc(pin.val)+'</span> '+
          (pinCompare(pin.op||'=',actual,pin.val)?'<span class="pill sent">✓ 일치</span>':'<span class="pill fail">✕ 불일치</span>')+
          ' <button class="btn btn-sm" data-action="pin-del" data-path="'+esc(ui.provPath)+'">해제</button>')
        :('<span class="cell-sub">지정 안 됨</span> '+
          '<button class="btn btn-sm" data-action="pin-add" data-path="'+esc(ui.provPath)+'">현재값을 기대값으로</button>'))+
    '</div></div>'+anHtml;
}

/* ============================================================
   렌더 — 기대값 대조
   ============================================================ */
function expLine(ok,kind,want,actual){
  return '<div class="exp-row"><span class="pill '+(ok?'sent':'fail')+'">'+(ok?'✓':'✕')+'</span>'+
    '<b>'+esc(kind)+'</b> '+esc(want)+
    (ok?'':' → 실제 <span class="mono">'+esc(
      Object.prototype.toString.call(actual)==='[object Array]'?actual.join(','):actual)+'</span>')+'</div>';
}
function renderExpect(){
  var p=$('#expect-panel'), c=currentCase();
  if(!run||!c){p.innerHTML='';return;}
  var pins=checkPins(run.design,c.expect.pins);
  var vers=checkVerdicts(run,c.expect.verdicts);
  var gd=c.lastRun?c.lastRun.goldenDiff:[];
  p.innerHTML='<div class="panel-h"><h3>기대값 대조</h3><span class="sub">핵심 '+
    pins.pass+'/'+pins.total+' · 판정 '+vers.pass+'/'+vers.total+
    (c.expect.golden?' · 골든 diff '+gd.length:' · 골든 없음')+'</span></div><div class="pad">'+
    (vers.total+pins.total===0?'<div class="cell-sub">기대값이 지정되지 않았습니다 — 설계결과의 값을 클릭해 지정하세요.</div>':'')+
    vers.results.map(function(r){
      var v=r.verdict;
      var want=v.expectErrorCode?('에러코드 '+v.expectErrorCode+' 발생'):v.expect;
      return expLine(r.ok,'판정',circled(v.stage)+' '+want,r.actual);}).join('')+
    pins.results.map(function(r){
      return expLine(r.ok,'핵심',(r.pin.label||r.pin.path)+' '+(r.pin.op||'=')+' '+r.pin.val,r.actual);}).join('')+
    (c.expect.golden
      ? (gd.length
          ? '<div class="pv-issue wa" style="margin-top:6px">골든 스냅샷('+fmtDT(c.expect.goldenAt)+
            ' 채택) 대비 <b>'+gd.length+'개 항목</b> 상이 '+
            '<button class="btn btn-sm" data-action="golden-diff">diff 보기</button> '+
            '<button class="btn btn-sm btn-pri" data-action="golden-accept">이 변경 승인 → 골든 갱신</button></div>'
          : '<div class="pv-ok" style="margin-top:6px">골든 스냅샷과 일치합니다.</div>')
      : '<p class="f-hint">골든 스냅샷이 없습니다. '+
        '<button class="btn btn-sm" data-action="golden-set">현재 결과를 골든으로 채택</button></p>')+
    '</div>';
}

function renderAll(){
  renderCaseList();renderOrderForm();renderLog();
  renderBadges();renderPipe();renderStage();renderExpect();renderProv();
}

/* ============================================================
   동작 — 골든 · 승격 · 케이스
   ============================================================ */
function goldenSet(){
  var c=currentCase();
  c.expect.golden=goldenSnapshot(run.design);
  c.expect.goldenAt=Date.now();
  pushLog('골든 채택',c.id,'없음',Object.keys(c.expect.golden).length+'개 항목');
  doRun();
}
function goldenAccept(){
  var c=currentCase();
  var n=(c.lastRun.goldenDiff||[]).length, before=c.expect.goldenAt;
  c.expect.golden=goldenSnapshot(run.design);
  c.expect.goldenAt=Date.now();
  pushLog('골든 갱신',c.id,fmtDT(before)+' 스냅샷',n+'개 항목 변경 승인');
  doRun();
}
function showGoldenDiff(){
  var c=currentCase(), gd=c.lastRun.goldenDiff||[];
  $('#modal-title').textContent=c.id+' — 골든 스냅샷 대비 차이 '+gd.length+'건';
  $('#modal-body').innerHTML='<div class="tbl-scroll"><table class="grid"><thead><tr>'+
    '<th>설계 경로</th><th>골든</th><th>현재</th></tr></thead><tbody>'+
    gd.map(function(x){return '<tr><td class="mono">'+esc(x.path)+'</td>'+
      '<td class="mono">'+esc(x.before)+'</td><td class="mono"><b>'+esc(x.after)+'</b></td></tr>';}).join('')+
    '</tbody></table></div>';
  $('#modal-back').classList.add('on');
  $('#modal-back').setAttribute('aria-hidden','false');
}
function closeModal(){
  $('#modal-back').classList.remove('on');
  $('#modal-back').setAttribute('aria-hidden','true');
}
function promote(){
  var c=currentCase();
  if(!c.lastRun||c.lastRun.status==='FAIL'){toast('FAIL 상태는 승격할 수 없습니다','err');return;}
  pushLog('실제 설계로 승격',c.id,c.lastRun.status,'주문 '+orderKey(c.order)+' 설계결과 반영 요청');
  renderLog();
  toast('승격 요청을 이력에 남겼습니다 — 목업이라 실제 반영은 없습니다');
}
function newCase(){
  var n=state.cases.length+1;
  var id='TC-'+String(100+n);
  var base=orderFromSeed(SEED_ORDERS[0]);
  base.__src='manual';
  state.cases.push({id:id,name:'새 검증 케이스',baseOrderRef:null,order:base,
    expect:{pins:[],verdicts:[],golden:null,goldenAt:null},lastRun:null,author:'목업 사용자'});
  state.sel=id;
  pushLog('케이스 생성',id,'—','신규');
  run=null;renderAll();
  toast(id+' 을 만들었습니다');
}
function jumpTo(hash){
  try{ if(window.self!==window.top){window.top.location.hash=hash;return;} }catch(e){}
  toast('포털에서 열면 해당 화면으로 이동합니다: '+hash);
}

/* ============================================================
   이벤트
   ============================================================ */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');
  if(!el)return;
  var a=el.getAttribute('data-action');
  if(a==='jump'){e.preventDefault();jumpTo(el.getAttribute('href'));return;}
  if(a==='case-pick'){state.sel=el.getAttribute('data-id');run=null;ui.provPath=null;
    var c=currentCase();if(c&&c.lastRun)run=computeCase(c);
    saveState();renderAll();return;}
  if(a==='run'){doRun();return;}
  if(a==='run-all'){runAll();return;}
  if(a==='case-new'){newCase();return;}
  if(a==='reset-all'){
    if(!window.confirm('시드 상태로 되돌립니다. 저장된 케이스와 이력이 사라집니다.'))return;
    state=freshState();run=null;saveState();renderAll();toast('시드로 초기화했습니다');return;}
  if(a==='stage'){ui.stage=Number(el.getAttribute('data-no'));ui.provPath=null;
    renderPipe();renderStage();renderProv();return;}
  if(a==='sec'){var id=el.getAttribute('data-id');ui.openSec[id]=!ui.openSec[id];
    renderStage();return;}
  if(a==='prov'){ui.provPath=el.getAttribute('data-path');renderStage();renderProv();return;}
  if(a==='pin-add'){
    var p=el.getAttribute('data-path'), cc=currentCase();
    var v=pinResolve(run.design,p);
    cc.expect.pins.push({path:p,label:p.split('.').pop(),op:'=',val:String(v)});
    pushLog('기대값 지정',cc.id,'—',p+' = '+v);
    doRun();return;}
  if(a==='pin-del'){
    var p2=el.getAttribute('data-path'), c2=currentCase();
    c2.expect.pins=c2.expect.pins.filter(function(x){return x.path!==p2;});
    pushLog('기대값 해제',c2.id,p2,'—');
    doRun();return;}
  if(a==='golden-set'){goldenSet();return;}
  if(a==='golden-accept'){goldenAccept();return;}
  if(a==='golden-diff'){showGoldenDiff();return;}
  if(a==='modal-close'){closeModal();return;}
  if(a==='promote'){promote();return;}
});
$('#modal-back').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

$('#case-q').addEventListener('input',function(){ui.q=this.value;renderCaseList();});

document.addEventListener('input',function(e){
  var el=e.target.closest('[data-order-field]');
  if(!el)return;
  var c=currentCase();if(!c)return;
  var k=el.getAttribute('data-order-field');
  c.order[k]=el.value;
  c.order.__src='manual';
  el.classList.add('dirty');
  $('#order-src').textContent='직접 입력';
  saveState();
});

$('#order-load').addEventListener('change',function(){
  var v=this.value;if(!v)return;
  var so=SEED_ORDERS.filter(function(o){return o.no+'-'+o.ln===v;})[0];
  if(!so)return;
  var c=currentCase();
  c.order=orderFromSeed(so);
  c.baseOrderRef=orderKey(c.order);
  c.asisSnapshot=null;
  pushLog('주문 불러오기',c.id,'—',v);
  doRun();
  this.value='';
});

/* splitter — 드래그 · ←/→ · 더블클릭 초기화 */
(function(){
  var sp=$('#splitter'), lp=$('#lpane'), dragging=false;
  function setW(w){lp.style.width=Math.max(200,Math.min(520,w))+'px';}
  sp.addEventListener('mousedown',function(e){dragging=true;e.preventDefault();});
  document.addEventListener('mousemove',function(e){
    if(!dragging)return;setW(e.clientX-lp.getBoundingClientRect().left);});
  document.addEventListener('mouseup',function(){dragging=false;});
  sp.addEventListener('dblclick',function(){lp.style.width='270px';});
  sp.addEventListener('keydown',function(e){
    var w=lp.getBoundingClientRect().width;
    if(e.key==='ArrowLeft'){setW(w-20);e.preventDefault();}
    if(e.key==='ArrowRight'){setW(w+20);e.preventDefault();}
  });
})();

/* 파이프라인 바 키보드 이동 */
document.addEventListener('keydown',function(e){
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  var act=document.activeElement;
  if(!act||!act.matches('.st'))return;
  var tabs=$$('.st');
  var i=tabs.indexOf(act);
  var j=e.key==='ArrowLeft'?Math.max(0,i-1):Math.min(tabs.length-1,i+1);
  tabs[j].focus();tabs[j].click();
  e.preventDefault();
});

/* ============================================================
   초기화
   ============================================================ */
(function init(){
  loadCriteria();
  renderSrcBadge();
  state=loadState();
  $('#order-load').innerHTML='<option value="">선택…</option>'+
    SEED_ORDERS.map(function(o){
      var k=o.no+'-'+o.ln;
      return '<option value="'+esc(k)+'">'+esc(k)+' · '+esc(PRD_NM[o.prd]||o.prd)+' · '+
        esc(o.spec)+' · '+o.thk.toFixed(3)+'×'+o.wid.toFixed(0)+'</option>';
    }).join('');
  var c=currentCase();
  if(c){
    run=computeCase(c);
    /* AS-IS 대역 — 최초 실행 결과를 현행 시스템 결과로 간주 */
    state.cases.forEach(function(x){
      if(!x.asisSnapshot&&x.baseOrderRef){
        x.asisSnapshot=goldenSnapshot(genDetail(toDesign(x.order)));
      }
    });
    saveState();
  }
  renderAll();
})();

</script>
