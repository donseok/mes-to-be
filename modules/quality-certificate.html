<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q-CERT 품질보증서관리</title>
<script>try{if(window.self!==window.top)document.documentElement.classList.add('embedded');}catch(e){document.documentElement.classList.add('embedded');}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   Q-CERT — MES 품질보증서관리 1차 화면 목업 (Direction A '스틸 & 페이퍼')
   출하 코일에 대한 품질보증서(성적서) 발행·재발행·회수 관리. 수요가는 가명.
   시드 데이터는 가상 값이며 고객사·제조사는 가명(A/B/C)이다.
   ============================================================ */

:root{
  --bg:#F5F4F0;--surface:#FFFFFF;--surface-2:#F1F0EB;--surface-3:#E9E7E1;
  --border:#E8E6E1;--border-strong:#D6D2CA;
  --ink:#1C2126;--ink-2:#4A5158;--ink-3:#8A9198;
  --accent:#166578;--accent-strong:#0F4854;--accent-on:#FFFFFF;--accent-soft:#E4EEF1;--accent-soft-ink:#0F4854;
  --result:#96610E;--result-soft:#FBF0DC;--result-soft-ink:#7A4F0B;
  --danger:#B03A32;--danger-bg:#F7E4E2;--ok:#276B39;--ok-bg:#E8F2E9;--hold:#3F5E8C;--hold-bg:#E7ECF6;
  --code-bg:#F1F0EC;--scrim:rgba(28,26,22,.44);--shadow:0 8px 28px rgba(44,40,32,.12);
  --topbar-bg:#FBFAF7;--topbar-ink:#3A4148;--topbar-dim:#7A8188;--focus:#166578;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;font-size:13.5px;color:var(--ink);background:var(--bg);line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:is(a,button,input,select):focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.mono{font-family:'JetBrains Mono','Consolas',ui-monospace,monospace}
.topbar{background:var(--topbar-bg);color:var(--topbar-ink);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;height:52px;padding:0 20px;position:sticky;top:0;z-index:30}
.embedded .topbar{display:none}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:12px;color:#fff}
.brand-name{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:15px;letter-spacing:.04em}
.crumb{color:var(--topbar-dim);font-size:12.5px}
.mock{margin-left:auto;font-size:10.5px;letter-spacing:.08em;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--border-strong);color:var(--ink-2)}
.tabs{display:flex;gap:22px;padding:0 26px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:20}
.embedded .tabs{top:0}
.tab{display:flex;align-items:center;gap:7px;height:46px;font-size:14px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--accent);font-weight:800;border-bottom-color:var(--accent)}
.cnt{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:11px;font-weight:700}
.tab.on .cnt{background:var(--accent-soft);color:var(--accent)}
.sc{display:none;padding:18px 26px 28px;flex-direction:column;gap:14px}
.sc.on{display:flex}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px}
.fbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:14px 16px}
.f-field{display:flex;flex-direction:column;gap:5px}
.f-field label{font-size:11px;font-weight:700;color:var(--ink-3)}
.inp{height:38px;padding:0 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);font-size:13px;color:var(--ink);min-width:120px}
.inp:focus{border-color:var(--accent)}
.f-spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-pri{background:var(--accent);border-color:var(--accent);color:var(--accent-on);font-weight:700}
.btn-pri:hover{background:var(--accent-strong)}
.btn-warn{background:var(--result-soft);border-color:#E8C89A;color:var(--result);font-weight:700}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
.meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);padding:0 2px}
.meta b{color:var(--ink)}
.grid{overflow:auto}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-2);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:#FAF9F6}
.tbl tr.row.sel td{background:var(--accent-soft)}
.tbl .num{text-align:right;font-family:'JetBrains Mono',monospace}
.sub{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.lnk{color:var(--accent);font-weight:700;font-family:'JetBrains Mono',monospace}
.code{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;background:var(--code-bg);color:var(--ink-2);font-size:11.5px;font-weight:600;font-family:'JetBrains Mono',monospace}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.no{background:var(--danger-bg);color:var(--danger)}
.pill.warn{background:var(--result-soft);color:var(--result)}
.pill.hold{background:var(--hold-bg);color:var(--hold)}
.pill.dim{background:var(--surface-2);color:var(--ink-2)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.chk{display:inline-flex;gap:4px}
.chk span{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:800;background:var(--ok-bg);color:var(--ok)}
.chk span.x{background:var(--danger-bg);color:var(--danger)}
.chk span.q{background:var(--surface-2);color:var(--ink-3)}
.empty{padding:48px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.empty .big{font-size:16px;font-weight:800;color:var(--ink-2);margin-bottom:6px}
.form{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px 16px;padding:18px}
.form .f-field .inp{min-width:0;width:100%}
.form-foot{display:flex;gap:10px;justify-content:flex-end;padding:0 18px 18px}
.note{font-size:12px;color:var(--ink-3);padding:0 2px}
/* 역할 토글 — 탭 줄 오른쪽. 목업이라 화면에서 바꾸지만 실제로는 로그인 계정의 역할이다 */
.tabs .role{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.tabs .role .inp{height:30px;min-width:0;font-size:12.5px;padding:0 8px;border-radius:8px;font-weight:600;color:var(--ink)}
/* 시험값 정정 모달 */
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:920px;max-width:94vw;max-height:90vh;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);z-index:50;display:none;flex-direction:column;overflow:hidden}
.modal.on{display:flex}
.m-body{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.callout{border:1px solid var(--border);border-left:3px solid var(--result);background:var(--result-soft);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--result-soft-ink);line-height:1.55}
.callout.ok{border-left-color:var(--hold);background:var(--hold-bg);color:var(--hold)}
.callout.no{border-left-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.callout b{font-weight:800}
.corr-tbl th.lock,.corr-tbl td.lock{color:var(--ink-3);background:var(--surface-2)}
.corr-tbl th .lk{display:inline-block;margin-left:4px;font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--ink-3);border:1px solid var(--border-strong);border-radius:5px;padding:0 4px;vertical-align:middle}
.corr-tbl th .min{display:block;font-size:10.5px;color:var(--accent);font-weight:700;margin-top:1px}
.corr-tbl td{vertical-align:top}
.corr-tbl input{width:80px;height:30px;padding:0 8px;border:1px solid var(--border-strong);border-radius:8px;font:inherit;font-size:12.5px;text-align:right;font-family:'JetBrains Mono',monospace;background:var(--surface)}
.corr-tbl input:focus{border-color:var(--accent);outline:none}
.corr-tbl input.chg{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.corr-tbl input.bad{border-color:var(--danger);background:var(--danger-bg)}
.corr-tbl .cur{display:block;font-size:10.5px;color:var(--ink-3);text-align:right;margin-top:2px;font-family:'JetBrains Mono',monospace}
.corr-tbl .err{display:block;font-size:10.5px;color:var(--danger);margin-top:3px;max-width:190px;white-space:normal;line-height:1.35}
.corr-sum{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.corr-sum b{color:var(--ink)}
.corr-sum .bad{color:var(--danger);font-weight:700}
.hist-items{display:flex;flex-wrap:wrap;gap:4px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:var(--surface)}
/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:92vw;background:var(--surface);box-shadow:var(--shadow);z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .18s ease}
.drawer.on{transform:none}
.d-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.d-head h3{margin:0;font-size:15.5px;font-weight:800;flex:1}
.d-close{width:32px;height:32px;border-radius:8px;color:var(--ink-3);font-size:16px}
.d-close:hover{background:var(--surface-2)}
.d-body{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.d-sect h4{margin:0 0 8px;font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:13px}
.kv dt{color:var(--ink-3);margin:0}
.kv dd{margin:0;font-weight:500}
.d-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border)}
table.mini{width:100%;border-collapse:collapse;font-size:12.5px}
.mini th{background:var(--surface-2);font-size:11px;color:var(--ink-2);padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)}
.mini td{padding:7px 10px;border-bottom:1px solid var(--border)}
.mini .num{text-align:right;font-family:'JetBrains Mono',monospace}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.18s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tagcard{border:1.5px solid var(--ink);border-radius:8px;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;background:#fff}
.tagcard b{display:block;font-size:10px;color:var(--ink-3);font-family:'Gothic A1',sans-serif;font-weight:700}
.tagcard .big{grid-column:1/-1;font-size:20px;font-weight:600;letter-spacing:.04em}
.layer{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:10px}
.layer .sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--border-strong)}
.layer .nm{flex:1;font-weight:700}
.layer .th{font-family:'JetBrains Mono',monospace;color:var(--ink-2)}


/* A4 보증서 리포트 — assets/report/report.css 주입 구간 (build/inject_report.py) */
/*__REPORT_CSS_START__*/
/* assets/report/report.css — A4 품질보증서 시트 + 미리보기 오버레이 + 인쇄 스타일
   빌드 시 build/inject_report.py 가 modules/quality-certificate.html 마커 구간에 복사한다.

   화면 미리보기와 인쇄가 같은 규칙을 탄다. 미리보기 전용 CSS를 따로 두면
   "화면과 출력이 다르다"가 반드시 생기므로, 화면에서만 다른 것은 배율·그림자·스크림뿐이다. */

:root{
  /* A4. 시트 높이를 297mm 로 딱 맞추면 렌더러 반올림 때문에 빈 페이지가 한 장 더 나오는
     브라우저가 있어 0.2mm 를 뺀다. 빈 장이 보이면 이 값을 더 줄인다. */
  --rp-sheet-w:210mm; --rp-sheet-h:296.8mm;
  --rp-pad-x:15mm; --rp-pad-y:14mm;
  --rp-ink:#000; --rp-ink-2:#333; --rp-ink-3:#666;
  --rp-line:#000; --rp-line-2:#999; --rp-band:#ECECEC;
  --rp-zoom:1;
}

/* ── 미리보기 오버레이 (화면 전용) ───────────────────────────────────────── */
.rp-overlay{position:fixed;inset:0;z-index:80;background:rgba(28,26,22,.55);display:none;flex-direction:column}
.rp-overlay.on{display:flex}
.rp-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#23282D;color:#fff;flex:0 0 auto}
.rp-bar h3{margin:0;font-size:14px;font-weight:800;letter-spacing:.01em}
.rp-bar .rp-sub{font-size:12px;color:#B9C0C7}
.rp-bar .rp-spacer{flex:1}
.rp-bar label{font-size:11.5px;color:#B9C0C7;display:flex;align-items:center;gap:6px}
.rp-bar input[type=number]{width:62px;height:30px;padding:0 8px;border-radius:8px;border:1px solid #4A5158;background:#161A1E;color:#fff;font:inherit;font-size:12.5px}
.rp-bar button{height:32px;padding:0 14px;border-radius:9px;border:1px solid #4A5158;background:#2E353B;color:#fff;font-size:13px;font-weight:600}
.rp-bar button:hover{background:#3A4147}
.rp-bar button.pri{background:#166578;border-color:#166578;font-weight:800}
.rp-bar button.pri:hover{background:#0F4854}
.rp-scroll{flex:1;overflow:auto;padding:18px 0 28px}
.rp-pages{zoom:var(--rp-zoom);display:flex;flex-direction:column;align-items:center;gap:14px}
.rp-note{color:#C9D0D7;font-size:11.5px;text-align:center;padding:0 16px 10px}

/* 측정 전용 컨테이너. 화면 밖에 두되 레이아웃은 실제와 같은 폭으로 잡아야 높이가 맞는다. */
.rp-measure{position:absolute;left:-10000px;top:0;visibility:hidden;pointer-events:none;zoom:1}
.rp-sheet--measure{height:auto;box-shadow:none}

/* ── A4 시트 ─────────────────────────────────────────────────────────────── */
.rp-sheet{
  position:relative;box-sizing:border-box;
  width:var(--rp-sheet-w);height:var(--rp-sheet-h);
  padding:var(--rp-pad-y) var(--rp-pad-x);
  background:#fff;color:var(--rp-ink);overflow:hidden;
  font-family:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;
  font-size:8.6pt;line-height:1.38;
  display:flex;flex-direction:column;
  box-shadow:0 6px 24px rgba(0,0,0,.35);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.rp-body{flex:1;display:flex;flex-direction:column;min-height:0}
.rp-sheet .mono{font-family:'JetBrains Mono','Consolas',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.rp-sheet .num{text-align:right;font-family:'JetBrains Mono','Consolas',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.rp-sheet .ctr{text-align:center}

/* 머리글 — 모든 장에 반복 */
.rp-head{flex:0 0 auto;border-bottom:1.6pt solid var(--rp-line);padding-bottom:3mm;margin-bottom:4mm}
.rp-head-top{display:flex;align-items:flex-start;gap:8mm}
.rp-maker{flex:0 0 52mm}
.rp-maker b{display:block;font-size:10pt;font-weight:800;letter-spacing:.02em}
.rp-maker span{display:block;font-size:7.4pt;color:var(--rp-ink-3);margin-top:.6mm}
.rp-title{flex:1;text-align:center}
.rp-title b{display:block;font-size:16pt;font-weight:800;letter-spacing:.22em;padding-left:.22em}
.rp-title span{display:block;font-size:7.6pt;color:var(--rp-ink-2);letter-spacing:.06em;margin-top:.8mm}
.rp-stamp{flex:0 0 52mm;display:grid;grid-template-columns:auto 1fr;gap:.6mm 3mm;font-size:7.6pt}
.rp-stamp dt{color:var(--rp-ink-3);margin:0;white-space:nowrap}
.rp-stamp dd{margin:0;text-align:right;font-weight:700}

/* 정보 블록 — 1장에만 */
.rp-info{flex:0 0 auto;margin-bottom:4mm}
.rp-info table{width:100%;border-collapse:collapse;font-size:8.4pt}
.rp-info th,.rp-info td{border:.5pt solid var(--rp-line-2);padding:1.5mm 2.4mm;vertical-align:middle}
.rp-info th{background:var(--rp-band);text-align:left;font-weight:700;width:24mm;white-space:nowrap;color:var(--rp-ink-2)}

.rp-sect{flex:0 0 auto;margin-bottom:4mm}
.rp-sect > h4{margin:0 0 1.6mm;font-size:8.6pt;font-weight:800;letter-spacing:.04em}
.rp-sect > h4 .rp-of{font-weight:400;color:var(--rp-ink-3);font-size:7.6pt;margin-left:2mm}

/* 표 공통 */
.rp-tbl{width:100%;border-collapse:collapse;font-size:8pt;table-layout:fixed}
.rp-tbl th,.rp-tbl td{border:.5pt solid var(--rp-line-2);padding:1.15mm 1.6mm;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-tbl thead th{background:var(--rp-band);font-weight:700;text-align:center;color:var(--rp-ink-2)}
.rp-tbl tfoot td{background:#F6F6F6;font-weight:700}
.rp-tbl .sub{font-size:7pt;color:var(--rp-ink-3)}
.rp-pass{font-weight:800}
.rp-fail{font-weight:800;text-decoration:underline}
.rp-tbl td.wrap{white-space:normal;line-height:1.3}
/* 정정된 값 — 굵게 + ※. 배경색에 의존하지 않아 흑백 인쇄에서도 구분된다 */
.rp-corr{font-weight:800}
.rp-corr sup{font-size:5.6pt;line-height:0;margin-left:.3mm}
/* 정정 재발행 안내 — 1장 정보 블록 아래 */
.rp-notice{flex:0 0 auto;border:.6pt solid var(--rp-line);border-left:2.4pt solid #B03A32;padding:2.2mm 3.5mm;margin-bottom:4mm;font-size:8.2pt;line-height:1.5}
.rp-notice b{font-weight:800}

/* 판정문·서명 — 마지막 장에만 */
.rp-decl{flex:0 0 auto;border:.8pt solid var(--rp-line);padding:3mm 4mm;margin-bottom:4mm;font-size:8.6pt;line-height:1.55}
.rp-decl b{font-weight:800}
.rp-sign{flex:0 0 auto;display:flex;gap:6mm;align-items:flex-end}
.rp-sign-txt{flex:1;font-size:8pt;color:var(--rp-ink-2);line-height:1.6}
.rp-sign-box{flex:0 0 40mm;border:.5pt solid var(--rp-line-2);height:26mm;display:flex;flex-direction:column}

<script>
'use strict';
/* A4 보증서 리포트 — assets/report/*.js 주입 구간 (build/inject_report.py). 전역 MesReport */
/*__REPORT_JS_START__*/
/* assets/report/report-model.js — 품질보증서 문서 모델 + 페이지 분할 (순수 함수, DOM 없음)
   빌드 시 build/inject_report.py 가 modules/quality-certificate.html 마커 구간에 복사한다.

   0단계 리포트 프로토타입의 데이터 레이어다. 양식은 아직 JSON이 아니라 코드에 고정돼 있고
   (1단계에서 양식 스키마로 분리), 여기서는 "발행 목록 1행 → A4 문서 데이터" 변환만 담당한다. */
(function (g) {
  'use strict';

  // ── 규격 기준 ────────────────────────────────────────────────────────────
  // 규격약호에서 강종을 골라 기계적 성질 하한을 정한다. 목업 값이며 실제 KS 표를 옮긴 것이 아니다.
  // min 만 쓰는 이유: 보증서에 싣는 항목이 모두 '이상' 기준이기 때문이다.
  const SPECS = [
    { re: /SGC340|CGC340/, grade: 'SGC340', yp: 245, ts: 340, el: 20 },
    { re: /SGLC570/, grade: 'SGLC570', yp: 560, ts: 570, el: null },
    { re: /SGLCC|CGLCC/, grade: 'SGLCC', yp: 205, ts: 270, el: 20 },
    { re: /SGCC|CGCC/, grade: 'SGCC', yp: 205, ts: 270, el: 20 },
  ];
  const DEFAULT_SPEC = { grade: '일반용', yp: 205, ts: 270, el: 20 };

  // 품명코드 → 도금 종류·최소 부착량(양면, g/㎡). 주문 도금량코드가 시드에 없어 품명 기본값을 쓴다.
  const COATS = {
    G: { code: 'Z12', min: 120, label: '용융아연도금 (Z12)' },
    L: { code: 'AZ150', min: 150, label: '알루미늄아연도금 (AZ150)' },
    W: { code: 'AM90', min: 90, label: '아연알루미늄마그네슘도금 (AM90)' },
    3: { code: 'Z08', min: 80, label: '칼라원판 용융아연도금 (Z08)' },
    4: { code: 'AZ100', min: 100, label: '칼라원판 알루미늄아연도금 (AZ100)' },
  };
  const DEFAULT_COAT = { code: 'Z08', min: 80, label: '용융아연도금 (Z08)' };

  // 상태 → 워터마크. '발행'만 워터마크가 없다.
  const WATERMARKS = { 초안: 'DRAFT', 재발행: 'REISSUE', 회수: 'VOID' };

  const TEST_METHODS = { yp: 'KS B 0802', ts: 'KS B 0802', el: 'KS B 0802', coat: 'KS D 0201' };

  // ── 역할·권한 ────────────────────────────────────────────────────────────
  // 필드 등급은 "어떤 절차로" 고치는가, 역할은 "누가" 그 절차를 밟을 수 있는가다. 두 축은 따로 둔다.
  // 목업이라 역할마다 사람 하나를 고정한다 — 실제로는 로그인 계정의 역할이다.
  const ROLES = {
    user: { label: '현업', name: '김현업' },
    qm:   { label: '품질관리자', name: '박품질' },
    dev:  { label: '개발자', name: '이개발' },
  };
  const PERMISSIONS = {
    preview:  ['user', 'qm', 'dev'],
    issue:    ['user', 'qm', 'dev'],
    request:  ['user', 'qm', 'dev'],   // approve 등급 필드의 변경 '요청'
    correct:  ['qm', 'dev'],           // 시험값 정정
    recall:   ['qm', 'dev'],
    approve:  ['qm', 'dev'],           // 변경 요청 승인·반려 (요청자 본인은 불가)
    reset:    ['dev'],
    template: ['dev'],                 // 양식 관리
  };
  function can(role, action) {
    return (PERMISSIONS[action] || []).indexOf(role) >= 0;
  }
  // '품질관리자·개발자' 같은 안내문용
  function rolesFor(action) {
    return (PERMISSIONS[action] || []).map(function (r) { return ROLES[r].label; }).join('·');
  }

  // ── 필드 편집 등급 ───────────────────────────────────────────────────────
  // 보증서의 값은 "누가 고칠 수 있는가"가 아니라 "어떤 절차로 고칠 수 있는가"로 나눈다.
  //   locked  : 원천 시스템 값. 이 화면에서는 어떤 절차로도 못 고친다 (정정은 원천에서)
  //   correct : 정정 절차(사유 필수 → 현재 버전 회수 → 다음 버전 재발행 → 이력)로만 고친다 — 시험값
  //   approve : 고칠 수 있으나 승인이 필요하다 (다음 단계)
  //   free    : 발행 시 담당자가 자유 입력한다 (다음 단계)
  // 등록되지 않은 필드는 locked 로 본다 — 실수로 열리는 쪽보다 실수로 잠기는 쪽이 안전하다.
  const FIELDS = {
    'cert.no':      { edit: 'locked',  label: '보증서번호', src: '발행 시스템' },
    'order':        { edit: 'locked',  label: '주문번호',   src: '주문' },
    'coils[].no':   { edit: 'locked',  label: '코일번호',   src: '생산실적' },
    'coils[].heat': { edit: 'locked',  label: '용강번호',   src: '생산실적' },
    'coils[].thk':  { edit: 'locked',  label: '두께',       src: '생산실적', unit: 'mm' },
    'coils[].wid':  { edit: 'locked',  label: '폭',         src: '생산실적', unit: 'mm' },
    'coils[].wgt':  { edit: 'locked',  label: '중량',       src: '계량',     unit: 'kg' },
    'coils[].yp':   { edit: 'correct', label: '항복강도',   sym: 'YP',  unit: 'MPa' },
    'coils[].ts':   { edit: 'correct', label: '인장강도',   sym: 'TS',  unit: 'MPa' },
    'coils[].el':   { edit: 'correct', label: '연신율',     sym: 'EL',  unit: '%' },
    'coils[].coat': { edit: 'correct', label: '도금부착량', sym: 'C/W', unit: 'g/㎡' },
    'remark':       { edit: 'free',    label: '비고', max: 200,
                      get: function (r) { return r.remark || ''; }, set: function (r, v) { r.remark = v; } },
    // 표기명은 수요가 마스터(cus)를 덮어쓰는 문서상의 표기다. 비어 있으면 마스터 값.
    'customer.displayName': { edit: 'approve', label: '수요가 표기명',
                      get: function (r) { return r.displayName || r.cus || ''; }, set: function (r, v) { r.displayName = v; } },
  };
  // coils[].<k> 중 correct 등급 — 정정 화면의 열 순서이기도 하다
  const TEST_FIELDS = ['yp', 'ts', 'el', 'coat'];
  const FIELD_LABELS = { yp: '항복강도 YP', ts: '인장강도 TS', el: '연신율 EL', coat: '도금부착량 C/W' };

  function fieldGrade(path) {
    return (FIELDS[path] || {}).edit || 'locked';
  }
  function fieldValue(row, path) {
    const f = FIELDS[path];
    return f && f.get ? f.get(row) : undefined;
  }

  // ── 작은 유틸 ────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 문자열에서 첫 숫자. 콤마 제거. 없으면 null. (shape-model.num 과 같은 규약)
  function num(v) {
    if (typeof v === 'number') return Number.isFinite(v) ? v : null;
    if (v == null) return null;
    const m = String(v).replace(/,/g, '').match(/-?\d+(?:\.\d+)?/);
    return m ? Number(m[0]) : null;
  }

  function comma(n) {
    if (n == null || !Number.isFinite(n)) return '—';
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  // '0.450 × 1490' → { thk: 0.45, wid: 1490 }
  function parseSize(s) {
    const parts = String(s == null ? '' : s).split(/[×x]/);
    return { thk: num(parts[0]), wid: num(parts[1]) };
  }

  // '3 : CCGI · KS3-CGCC' → { code: '3', name: 'CCGI', spec: 'KS3-CGCC' }
  function parsePrd(s) {
    const t = String(s == null ? '' : s);
    const head = t.split('·')[0] || '';
    const tail = t.indexOf('·') >= 0 ? t.slice(t.indexOf('·') + 1) : '';
    const bits = head.split(':');
    return {
      code: (bits[0] || '').trim(),
      name: (bits[1] || '').trim(),
      spec: tail.trim(),
    };
  }

  function specFor(specCode) {
    const t = String(specCode == null ? '' : specCode).toUpperCase();
    for (const s of SPECS) if (s.re.test(t)) return { grade: s.grade, yp: s.yp, ts: s.ts, el: s.el };
    return Object.assign({}, DEFAULT_SPEC);
  }

  function coatFor(prdCode) {
    return Object.assign({}, COATS[prdCode] || DEFAULT_COAT);
  }

  // ── 시드 난수 (문자열 → 재현 가능한 난수열) ───────────────────────────────
  // 같은 보증서번호는 언제 열어도 같은 코일 목록이 나와야 한다. 목업이 매번 달라지면
  // 화면 캡처·검토 기록이 서로 어긋나므로 Math.random 은 쓰지 않는다.
  function hash32(str) {
    let h = 2166136261 >>> 0;
    const s = String(str);
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function rng(seed) {
    let a = hash32(seed) || 1;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 총중량을 n개로 쪼갠다. 10kg 단위로 반올림하고 마지막 코일이 잔차를 흡수해 합이 정확히 total.
  function splitWeight(total, n, rnd) {
    if (n <= 0) return [];
    if (n === 1) return [total];
    const f = [];
    let fs = 0;
    for (let i = 0; i < n; i++) {
      const v = 0.85 + rnd() * 0.3;
      f.push(v);
      fs += v;
    }
    const out = [];
    let acc = 0;
    for (let i = 0; i < n - 1; i++) {
      const v = Math.max(10, Math.round((total * f[i]) / fs / 10) * 10);
      out.push(v);
      acc += v;
    }
    out.push(total - acc);
    return out;
  }

  // 코일 1건의 합격 판정. 정정 뒤에도 같은 식으로 다시 판정한다.
  function judge(c, spec, coat) {
    return c.yp >= spec.yp && c.ts >= spec.ts && (spec.el == null || c.el == null || c.el >= spec.el) && c.coat >= coat.min;
  }

  // ── 문서 모델 ────────────────────────────────────────────────────────────
  // row: 발행 목록 1행. opts.coilCount 를 주면 코일 수를 바꾼다(페이지 분할 확인용 목업 조작).
  // 코일 수를 바꾸면 코일당 평균 중량을 유지한 채 총중량을 다시 계산한다.
  function buildCertDoc(row, opts) {
    const o = opts || {};
    const seedCoils = Math.max(1, num(row.coils) || 1);
    const seedWgt = Math.max(0, num(row.wgt) || 0);
    const n = Math.max(1, Math.min(200, o.coilCount == null ? seedCoils : Math.round(o.coilCount)));
    const total = n === seedCoils ? seedWgt : Math.round((seedWgt / seedCoils) * n / 10) * 10;

    const size = parseSize(row.size);
    const prd = parsePrd(row.prd);
    const spec = specFor(prd.spec);
    const coat = coatFor(prd.code);
    // 시드는 보증서번호만. 버전이 바뀌어도(정정 재발행) 같은 코일 목록에서 출발해야
    // 정정 내역이 그 위에 겹쳐진다. 발행일도 최초 발행일을 써서 코일번호가 흔들리지 않게 한다.
    const rnd = rng(row.no);
    const baseDate = row.firstIssued || row.date;

    const ymd = /^\d{4}-\d{2}-\d{2}$/.test(String(baseDate))
      ? String(baseDate).slice(2).replace(/-/g, '')
      : String(row.no).replace(/\D/g, '').slice(0, 4) + '01';
    const startSeq = 1 + Math.floor(rnd() * 40);
    const weights = splitWeight(total, n, rnd);

    const coils = [];
    for (let i = 0; i < n; i++) {
      const yp = Math.round(spec.yp * (1 + rnd() * 0.22));
      const ts = Math.max(Math.round(spec.ts * (1 + rnd() * 0.18)), Math.round(yp * 1.12));
      const el = spec.el == null ? null : Math.round(spec.el + rnd() * 12);
      const cw = Math.round(coat.min * (1 + rnd() * 0.25));
      const thk = size.thk == null ? null : Math.round((size.thk + (rnd() - 0.5) * 0.008) * 1000) / 1000;
      const wid = size.wid == null ? null : size.wid + Math.round(rnd() * 3);
      coils.push({
        seq: i + 1,
        no: 'C' + ymd + String(startSeq + i).padStart(3, '0'),
        heat: 'H' + ymd.slice(0, 2) + '-' + (8800 + Math.floor(i / 3)),
        thk: thk,
        wid: wid,
        wgt: weights[i],
        yp: yp,
        ts: ts,
        el: el,
        coat: cw,
        pass: true,
      });
      coils[i].pass = judge(coils[i], spec, coat);
    }

    // 정정 오버레이 — row.corrections 는 [{ coil, field, from, to, reason, by, at, fromVer, toVer }].
    // 시간순이므로 같은 코일·항목이 여러 번 정정됐으면 마지막 값이 남는다. 정정된 칸에는
    // corrected 표시를 남겨 출력물에서 ※ 로 드러낸다.
    const corrections = Array.isArray(row.corrections) ? row.corrections : [];
    const changes = Array.isArray(row.changes) ? row.changes : [];
    if (corrections.length) {
      const byCoil = {};
      corrections.forEach(function (c) {
        if (TEST_FIELDS.indexOf(c.field) < 0) return; // correct 등급이 아닌 항목은 무시
        (byCoil[c.coil] = byCoil[c.coil] || {})[c.field] = c;
      });
      coils.forEach(function (c) {
        const cs = byCoil[c.no];
        if (!cs) return;
        c.corrected = {};
        TEST_FIELDS.forEach(function (k) {
          if (!cs[k]) return;
          c.corrected[k] = { from: cs[k].from, to: cs[k].to };
          c[k] = cs[k].to;
        });
        c.pass = judge(c, spec, coat);
      });
    }

    const issued = String(row.date) === '—' || !row.date ? null : String(row.date);
    const doc = {
      no: row.no,
      ver: row.ver,
      status: row.st,
      watermark: WATERMARKS[row.st] || null,
      customer: row.cus,
      po: row.po,
      order: row.ord,
      prd: prd,
      spec: spec,
      coat: coat,
      thk: size.thk,
      wid: size.wid,
      coilCount: n,
      totalWgt: total,
      issued: issued,
      firstIssued: row.firstIssued && row.firstIssued !== issued ? String(row.firstIssued) : null,
      supersedes: row.supersedes || null,
      issuer: row.by,
      coils: coils,
      corrections: corrections,
      changes: changes,
      // 출력물에 찍히는 수요가 이름. approve 절차로 바뀌었으면 ※
      customerDisplay: FIELDS['customer.displayName'].get(row),
      customerChanged: changes.some(function (c) { return c.field === 'customer.displayName'; }),
      // 3항 '정정·변경 내역' — 시험값 정정과 필드 변경을 시간순으로 합친다
      revisions: corrections.map(function (c) {
        return { kind: 'correct', coil: c.coil, label: FIELD_LABELS[c.field] || c.field, from: c.from, to: c.to,
          reason: c.reason, by: c.by, at: c.at, fromVer: c.fromVer, toVer: c.toVer };
      }).concat(changes.map(function (c) {
        return { kind: 'change', coil: null, label: c.label, from: c.from, to: c.to,
          reason: c.reason, by: '요청 ' + c.requestedBy + ' · 승인 ' + c.approvedBy, at: c.at, fromVer: c.fromVer, toVer: c.toVer };
      })).sort(function (a, b) { return String(a.at) < String(b.at) ? -1 : String(a.at) > String(b.at) ? 1 : 0; }),
      criteria: [
        { name: '항복강도', sym: 'YP', unit: 'MPa', limit: spec.yp + ' 이상', method: TEST_METHODS.yp },
        { name: '인장강도', sym: 'TS', unit: 'MPa', limit: spec.ts + ' 이상', method: TEST_METHODS.ts },
        { name: '연신율', sym: 'EL', unit: '%', limit: spec.el == null ? '규정 없음' : spec.el + ' 이상', method: TEST_METHODS.el },
        { name: '도금부착량(양면)', sym: 'C/W', unit: 'g/㎡', limit: coat.min + ' 이상', method: TEST_METHODS.coat },
      ],
    };
    doc.docId = row.no + '-' + row.ver;
    // 발행본 식별용 지문. 0단계에서는 표시만 하고 검증 화면은 없다(2단계).
    doc.fingerprint = hash32(JSON.stringify([doc.docId, doc.totalWgt, coils.map(function (c) { return [c.no, c.yp, c.ts, c.el, c.coat]; })]))
      .toString(16).padStart(8, '0').toUpperCase();
    return doc;
  }

  // ── 시험값 정정 ──────────────────────────────────────────────────────────
  // items: [{ coil, field, to }]. 현재 값과 같은 항목은 '변경 없음'으로 걸러낸다(오류가 아니다).
  // 반환: { ok, changed: [{coil, field, from, to}], errors: [{coil, field, to, reason}] }
  //
  // 규격 미달 값은 여기서 막는다. 불합격 코일은 보증서에 실을 수 없으므로, 그런 경우는
  // 값을 고치는 문제가 아니라 코일을 빼고 재발행하는 별도 절차다.
  function validateCorrections(doc, items) {
    const changed = [];
    const errors = [];
    const pending = {}; // coil → { field: to } 교차 검증용
    (items || []).forEach(function (it) {
      const path = 'coils[].' + it.field;
      const coil = doc.coils.find(function (c) { return c.no === it.coil; });
      if (!coil) { errors.push({ coil: it.coil, field: it.field, to: it.to, reason: '코일 ' + it.coil + ' 이(가) 이 보증서에 없습니다' }); return; }
      const grade = fieldGrade(path);
      if (grade !== 'correct') {
        const f = FIELDS[path] || {};
        errors.push({ coil: it.coil, field: it.field, to: it.to,
          reason: (f.label || it.field) + ' 은(는) ' + (grade === 'locked' ? (f.src ? f.src + ' 값이라 ' : '') + '이 화면에서 정정할 수 없습니다' : '정정 절차 대상이 아닙니다') });
        return;
      }
      const f = FIELDS[path];
      const v = num(it.to);
      if (v == null) { errors.push({ coil: it.coil, field: it.field, to: it.to, reason: f.sym + ' 값이 숫자가 아닙니다' }); return; }
      if (it.field === 'el' && doc.spec.el == null) { errors.push({ coil: it.coil, field: it.field, to: it.to, reason: '강종 ' + doc.spec.grade + ' 은 연신율 규정이 없어 보증 항목이 아닙니다' }); return; }
      if (v === coil[it.field]) return; // 변경 없음
      const min = it.field === 'coat' ? doc.coat.min : doc.spec[it.field];
      if (v < min) { errors.push({ coil: it.coil, field: it.field, to: v, reason: f.sym + ' ' + v + ' < 기준 ' + min + ' — 규격 미달 값은 보증서에 실을 수 없습니다 (코일 제외 후 재발행은 별도 절차)' }); return; }
      (pending[it.coil] = pending[it.coil] || {})[it.field] = v;
      changed.push({ coil: it.coil, field: it.field, from: coil[it.field], to: v });

      const yp = pending[no].yp != null ? pending[no].yp : coil.yp;
      const ts = pending[no].ts != null ? pending[no].ts : coil.ts;

      }
    });
    return { ok: errors.length === 0 && changed.length > 0, changed: changed, errors: errors };

  // 정정 적용 — 순수 함수. 저장은 호출자가 한다.
  // 현재 버전은 회수되고(supersededBy), 다음 버전이 재발행된다(supersedes, corrections 누적).
  // req: { items, reason, by, at }  →  { recalled, reissued, history }
  function applyCorrection(row, req) {
    if (!/^(발행|재발행)$/.test(String(row.st))) throw new Error('발행·재발행 상태만 정정할 수 있습니다 (현재: ' + row.st + ')');

    const v = validateCorrections(doc, req.items);

    const at = req.at || new Date().toISOString().slice(0, 16);
    const date = String(at).slice(0, 10);
    const by = req.by || '품질관리자';
    const nextVer = 'v' + ((num(row.ver) || 1) + 1);
    const entries = v.changed.map(function (c) {
      return { coil: c.coil, field: c.field, from: c.from, to: c.to, reason: reason, by: by, at: at, fromVer: row.ver, toVer: nextVer };
    });
    const reissued = Object.assign({}, row, {
      id: row.no + '-' + nextVer,
      ver: nextVer,
      st: '재발행',
      date: date,
      by: by,
      firstIssued: row.firstIssued || row.date,
      supersedes: row.ver,
      supersededBy: null,
      corrections: (row.corrections || []).concat(entries),
    });
    const recalled = Object.assign({}, row, {
      st: '회수',
      supersededBy: nextVer,
      recallReason: '시험값 정정 → ' + nextVer + ' 재발행',
    });
    const history = { kind: 'correct', at: at, by: by, no: row.no, fromVer: row.ver, toVer: nextVer, reason: reason, items: v.changed };
    return { recalled: recalled, reissued: reissued, history: history };
  }

  // ── approve 등급 필드 변경: 요청 → 승인/반려 ─────────────────────────────
  // 요청은 누구나 낼 수 있지만 문서는 승인 전까지 그대로다. 승인되면 시험값 정정과 같은
  // 메커니즘으로 현재 버전을 회수하고 다음 버전을 재발행한다 — 발행된 문서가 바뀌면 언제나 새 버전이다.
  // req: { field, to, reason, by, role, at }  →  요청 객체(status '대기'). id 는 저장소가 붙인다.
  function requestFieldChange(row, req) {
    const path = String(req && req.field || '');
    const f = FIELDS[path];
    const grade = fieldGrade(path);
    if (grade !== 'approve') throw new Error(((f && f.label) || path) + ' 은(는) 승인 절차 대상이 아닙니다 (등급: ' + grade + ')');
    if (!can(req.role, 'request')) throw new Error('변경 요청은 ' + rolesFor('request') + ' 권한입니다');
    if (!/^(발행|재발행)$/.test(String(row.st))) throw new Error('발행·재발행 상태만 변경 요청할 수 있습니다 (현재: ' + row.st + ')');
    if (row.pending) throw new Error('승인 대기 중인 요청이 이미 있습니다: ' + row.pending);
    const from = String(f.get(row));
    const to = String(req.to == null ? '' : req.to).trim();
    if (!to) throw new Error('새 ' + f.label + ' 을(를) 입력하세요');
    if (to === from) throw new Error('현재 값과 같습니다');
    const reason = String(req.reason || '').trim();
    if (!reason) throw new Error('사유는 필수입니다');
    return { rowId: row.id, no: row.no, ver: row.ver, field: path, label: f.label, from: from, to: to,
      reason: reason, by: req.by, role: req.role, at: req.at || new Date().toISOString().slice(0, 16), status: '대기' };
  }

  function assertApprover(request, appr) {
    if (!can(appr && appr.role, 'approve')) throw new Error('승인·반려는 ' + rolesFor('approve') + ' 권한입니다');
    if (appr.by === request.by) throw new Error('요청자 본인은 승인·반려할 수 없습니다 (요청 ' + request.by + ')');
    if (request.status !== '대기') throw new Error('이미 처리된 요청입니다 (' + request.status + ')');
  }

  // 승인 — 순수 함수. appr: { by, role, at } → { recalled, reissued, history, request }
  function applyFieldChange(row, request, appr) {
    assertApprover(request, appr);
    if (row.id !== request.rowId) throw new Error('요청 대상(' + request.rowId + ')과 다른 행입니다: ' + row.id);
    if (!/^(발행|재발행)$/.test(String(row.st))) throw new Error('발행·재발행 상태만 변경할 수 있습니다 (현재: ' + row.st + ')');
    const f = FIELDS[request.field];
    const at = appr.at || new Date().toISOString().slice(0, 16);
    const nextVer = 'v' + ((num(row.ver) || 1) + 1);
    const entry = { field: request.field, label: f.label, from: request.from, to: request.to, reason: request.reason,
      requestedBy: request.by, approvedBy: appr.by, at: at, fromVer: row.ver, toVer: nextVer };
    const reissued = Object.assign({}, row, {
      id: row.no + '-' + nextVer, ver: nextVer, st: '재발행', date: String(at).slice(0, 10), by: appr.by,
      firstIssued: row.firstIssued || row.date, supersedes: row.ver, supersededBy: null, pending: null,
      changes: (row.changes || []).concat(entry),
    });
    f.set(reissued, request.to);
    const recalled = Object.assign({}, row, { st: '회수', supersededBy: nextVer, pending: null,
      recallReason: f.label + ' 변경 → ' + nextVer + ' 재발행' });
    const history = { kind: 'change', at: at, by: appr.by, no: row.no, fromVer: row.ver, toVer: nextVer,
      reason: request.reason, items: [{ field: request.field, label: f.label, from: request.from, to: request.to, requestedBy: request.by }] };
    const done = Object.assign({}, request, { status: '승인', approvedBy: appr.by, approvedAt: at, toVer: nextVer });
    return { recalled: recalled, reissued: reissued, history: history, request: done };
  }

  // 반려 — 문서는 그대로, 요청만 닫힌다. appr: { by, role, at, reason }
  function rejectFieldChange(request, appr) {
    assertApprover(request, appr);
    const why = String(appr.reason || '').trim();
    if (!why) throw new Error('반려 사유는 필수입니다');
    return Object.assign({}, request, { status: '반려', approvedBy: appr.by, approvedAt: appr.at || new Date().toISOString().slice(0, 16), rejectReason: why });
  }

  // ── 페이지 분할 ──────────────────────────────────────────────────────────
  // 측정된 높이만 받는 순수 함수. 실제 DOM 측정은 report-doc.js 가 하고 여기로 넘긴다.
  // blocks: [{ id, kind:'block', h } | { id, kind:'table', headH, footH, rowHs:[…] }]
  // 반환: 페이지 배열. 각 페이지는 조각 배열 [{ id, kind, from, to, last }]
  //
  // 표는 페이지마다 헤더(headH)를 다시 그리고 소계 행(footH) 자리를 남긴다 — 표가 잘려도
  // 각 페이지가 그 자체로 읽히도록 하는 게 성적서의 기본 요구다.
  function paginate(blocks, pageH) {
    const pages = [];
    let cur = [];
    let used = 0;
    function flush() {
      if (cur.length) pages.push(cur);
      cur = [];
      used = 0;
    }
    for (const b of blocks) {
      if (b.kind === 'table') {
        const rowHs = b.rowHs || [];
        if (!rowHs.length) continue;
        let i = 0;
        while (i < rowHs.length) {
          let avail = pageH - used;
          // 헤더 + 1행 + 소계가 안 들어가면 다음 장으로. 빈 페이지에서도 안 들어가면
          // 무한 루프를 막기 위해 넘치더라도 1행은 올린다.
          if (avail < b.headH + rowHs[i] + b.footH && cur.length) {
            flush();
            avail = pageH;
          }
          let h = b.headH;
          let j = i;
          while (j < rowHs.length && h + rowHs[j] + b.footH <= avail) {
            h += rowHs[j];
            j++;
          }
          if (j === i) j = i + 1; // 최소 1행 보장
          cur.push({ id: b.id, kind: 'table', from: i, to: j, last: j >= rowHs.length });
          used += h + b.footH;
          i = j;
          if (i < rowHs.length) flush();
        }
      } else {
        if (b.h > pageH - used && cur.length) flush();
        cur.push({ id: b.id, kind: 'block' });
        used += b.h;
      }
    }
    flush();
    return pages.length ? pages : [[]];
  }

  g.MesReport = Object.assign(g.MesReport || {}, {
    buildCertDoc, paginate, specFor, coatFor, parseSize, parsePrd,
    validateCorrections, applyCorrection, fieldGrade, fieldValue, judge,
    requestFieldChange, applyFieldChange, rejectFieldChange, can, rolesFor,
    esc, num, comma, splitWeight, rng, hash32,
    SPECS, COATS, WATERMARKS, FIELDS, TEST_FIELDS, FIELD_LABELS, ROLES, PERMISSIONS,
  });
})(globalThis);

/* assets/report/report-doc.js — 문서 모델 → A4 DOM, 실측 페이지 분할, 미리보기·인쇄
   빌드 시 build/inject_report.py 가 modules/quality-certificate.html 마커 구간에 복사한다.

   왜 CSS 만으로 안 되는가: 크롬은 @page 안의 여백 상자(@bottom-right 등)를 지원하지 않아
   'N / M' 페이지 번호를 CSS 로 찍을 수 없고, 장마다 소계를 넣는 것도 CSS 로는 불가능하다.
   그래서 (1) 숨은 컨테이너에 전부 그려 높이를 재고 (2) 순수 함수로 장을 나눈 뒤

(function (g) {
  'use strict';

  const ROOT_ID = 'rp-root';
  const MAKER = '(주)목업제철 광양공장';
  const MAKER_EN = 'MOCKUP STEEL CO., LTD.';

  let state = null; // { row, doc, sheetPxW }

  function M() { return g.MesReport; }
  function esc(s) { return M().esc(s); }
  function comma(n) { return M().comma(n); }
  function fx(n, d) { return n == null || !Number.isFinite(n) ? '—' : n.toFixed(d); }

  // offsetHeight 는 마진을 빼고 센다. 블록 사이 간격도 장 높이를 먹으므로 마진까지 더한다.
  function outerH(el) {
    if (!el) return 0;
    const cs = getComputedStyle(el);
    return el.offsetHeight + parseFloat(cs.marginTop || 0) + parseFloat(cs.marginBottom || 0);
  }

  // ── 조각별 HTML ──────────────────────────────────────────────────────────
  function headHtml(doc, pageNo, pageCount) {
    return '<div class="rp-head"><div class="rp-head-top">'
      + '<div class="rp-maker"><b>' + esc(MAKER) + '</b><span>' + esc(MAKER_EN) + '</span></div>'
      + '<div class="rp-title"><b>품질보증서</b><span>QUALITY GUARANTEE CERTIFICATE</span></div>'
      + '<dl class="rp-stamp">'
      + '<dt>보증서번호</dt><dd class="mono">' + esc(doc.no) + ' ' + esc(doc.ver) + '</dd>'
      + '<dt>발행일</dt><dd class="mono">' + esc(doc.issued || '미발행') + '</dd>'
      + (doc.firstIssued ? '<dt>최초 발행</dt><dd class="mono">' + esc(doc.firstIssued) + ' (' + esc(doc.supersedes || '') + ')</dd>' : '')
      + '<dt>페이지</dt><dd class="mono">' + pageNo + ' / ' + pageCount + '</dd>'
      + '</dl></div></div>';
  }

  function infoHtml(doc) {
    const size = fx(doc.thk, 3) + ' × ' + (doc.wid == null ? '—' : comma(doc.wid));
    return '<div class="rp-info"><table>'
      + '<tr><th>수요가</th><td' + (doc.customerChanged ? ' class="rp-corr"' : '') + '>' + esc(doc.customerDisplay) + (doc.customerChanged ? '<sup>※</sup>' : '') + '</td>'
      + '<th>주문번호</th><td class="mono">' + esc(doc.order) + '</td></tr>'
      + '<tr><th>발주번호(PO)</th><td class="mono">' + esc(doc.po) + '</td>'
      + '<th>품명 · 규격</th><td>' + esc(doc.prd.name) + ' · ' + esc(doc.prd.spec) + '</td></tr>'
      + '<tr><th>주문 치수 (mm)</th><td class="mono">' + esc(size) + '</td>'
      + '<th>도금 종류</th><td>' + esc(doc.coat.label) + '</td></tr>'
      + '<tr><th>수량 · 중량</th><td class="mono">' + doc.coilCount + ' 코일 · ' + comma(doc.totalWgt) + ' kg</td>'
      + '<th>발행 담당</th><td>' + esc(doc.issuer) + '</td></tr>'
      + '</table></div>';
  }

  function criteriaHtml(doc) {
    let h = '<div class="rp-sect"><h4>1. 보증 기준<span class="rp-of">강종 ' + esc(doc.spec.grade) + ' · 주문 사양 기준</span></h4>'
      + '<table class="rp-tbl"><colgroup><col style="width:46mm"><col style="width:18mm"><col style="width:20mm"><col style="width:44mm"><col></colgroup>'
      + '<thead><tr><th>항목</th><th>기호</th><th>단위</th><th>규격 기준</th><th>시험 방법</th></tr></thead><tbody>';
    doc.criteria.forEach(function (c) {
      h += '<tr><td>' + esc(c.name) + '</td><td class="ctr mono">' + esc(c.sym) + '</td>'
        + '<td class="ctr">' + esc(c.unit) + '</td><td class="ctr mono">' + esc(c.limit) + '</td>'
        + '<td class="ctr mono">' + esc(c.method) + '</td></tr>';
    });
    return h + '</tbody></table></div>';
  }

  // 정정 재발행일 때만. 읽는 사람이 첫 장에서 바로 알아야 한다.
  function noticeHtml(doc) {
    if (!doc.revisions.length) return '';
    const parts = [];
    if (doc.corrections.length) parts.push('시험값 ' + doc.corrections.length + '건');
    if (doc.changes.length) parts.push('표기 ' + doc.changes.length + '건');
    return '<div class="rp-notice"><b>정정 재발행</b> — 본 보증서는 ' + esc(doc.supersedes || '이전 버전')
      + (doc.firstIssued ? ' (' + esc(doc.firstIssued) + ' 최초 발행)' : '') + '의 ' + parts.join(' · ') + '을 정정·변경하여 재발행한 것입니다. '
      + '바뀐 값은 <b>※</b> 로 표시하며 상세는 <span class="rp-nb">3항 정정·변경 내역</span>에 있습니다. 이전 버전은 회수되었습니다.</div>';
  }

  const CORR_COLS = '<colgroup><col style="width:27mm"><col style="width:28mm"><col style="width:16mm"><col style="width:16mm">'
    + '<col><col style="width:36mm"><col style="width:16mm"></colgroup>';

  function corrHeadHtml(doc) {
    return '<h4>3. 정정·변경 내역<span class="rp-of">' + doc.revisions.length + '건</span></h4>';
  }

  function corrTableHtml(doc, from, to) {
    const rows = doc.revisions.slice(from, to);
    let h = '<table class="rp-tbl">' + CORR_COLS
      + '<thead><tr><th>대상</th><th>항목</th><th>변경 전</th><th>변경 후</th><th>사유</th><th>처리자 · 일시</th><th>버전</th></tr></thead><tbody>';
    rows.forEach(function (c) {
      const isNum = c.kind === 'correct';
      h += '<tr><td class="mono">' + (c.coil ? esc(c.coil) : '<span class="sub">문서</span>') + '</td><td>' + esc(c.label) + '</td>'
        + '<td class="' + (isNum ? 'num' : 'wrap') + '">' + (isNum ? comma(c.from) : esc(c.from)) + '</td>'
        + '<td class="' + (isNum ? 'num' : 'wrap') + ' rp-corr">' + (isNum ? comma(c.to) : esc(c.to)) + '</td>'
        + '<td class="wrap">' + esc(c.reason) + '</td>'
        + '<td class="wrap">' + esc(c.by).replace(' · ', '<br>') + '<br><span class="mono rp-nb">' + esc(String(c.at || '').replace('T', ' ')) + '</span></td>'
        + '<td class="ctr mono">' + esc(c.fromVer) + '→' + esc(c.toVer) + '</td></tr>';
    });
    return h + '</tbody></table>';
  }

  // 폭 합계 180mm = A4 210mm - 좌우 여백 15mm×2
  const COILS_COLS = '<colgroup><col style="width:11mm"><col style="width:26mm"><col style="width:20mm">'
    + '<col style="width:16mm"><col style="width:14mm"><col style="width:20mm"><col style="width:13mm">'
    + '<col style="width:13mm"><col style="width:11mm"><col style="width:19mm"><col></colgroup>';

  function coilsHeadHtml(doc) {
    return '<h4>2. 코일별 시험 성적<span class="rp-of">총 ' + doc.coilCount + ' 코일</span></h4>';
  }

  function coilsTableHtml(doc, from, to, last) {
    const rows = doc.coils.slice(from, to);
    let sub = 0;
    rows.forEach(function (c) { sub += c.wgt; });
    let acc = 0;
    for (let i = 0; i < to; i++) acc += doc.coils[i].wgt;

    let h = '<table class="rp-tbl">' + COILS_COLS
      + '<thead><tr><th>No.</th><th>코일번호</th><th>용강번호</th><th>두께<br>(mm)</th><th>폭<br>(mm)</th>'
      + '<th>중량<br>(kg)</th><th>YP<br>(MPa)</th><th>TS<br>(MPa)</th><th>EL<br>(%)</th>'
      + '<th>도금부착량<br>(g/㎡)</th><th>판정</th></tr></thead><tbody>';
    rows.forEach(function (c) {
      // 정정된 칸은 ※ 를 붙여 원본 성적과 구분한다 — 상세는 3항
      const tv = function (k, txt) {
        const m = c.corrected && c.corrected[k];
        return '<td class="num' + (m ? ' rp-corr' : '') + '">' + txt + (m ? '<sup>※</sup>' : '') + '</td>';
      };
      h += '<tr><td class="ctr mono">' + c.seq + '</td>'
        + '<td class="mono">' + esc(c.no) + '</td>'
        + '<td class="mono">' + esc(c.heat) + '</td>'
        + '<td class="num">' + fx(c.thk, 3) + '</td>'
        + '<td class="num">' + comma(c.wid) + '</td>'
        + '<td class="num">' + comma(c.wgt) + '</td>'
        + tv('yp', comma(c.yp))
        + tv('ts', comma(c.ts))
        + tv('el', c.el == null ? '—' : comma(c.el))
        + tv('coat', comma(c.coat))
        + '<td class="ctr ' + (c.pass ? 'rp-pass' : 'rp-fail') + '">' + (c.pass ? '합격' : '불합격') + '</td></tr>';
    });
    h += '</tbody><tfoot><tr>'
      + '<td colspan="5">' + (last ? '총계 — 전체 ' + doc.coilCount + ' 코일' : '이 장 소계 — ' + rows.length + ' 코일')
      + '</td><td class="num">' + comma(last ? doc.totalWgt : sub) + '</td>'
      + '<td colspan="5" class="ctr">' + (last ? '이상 ' + doc.coilCount + ' 코일 전량 합격' : '누계 ' + comma(acc) + ' kg · 다음 장에 계속')
      + '</td></tr></tfoot></table>';
    return h;
  }

  function signHtml(doc) {
    return '<div class="rp-decl">위 제품은 <b>' + esc(doc.prd.spec) + '</b> 및 주문 사양(' + esc(doc.po)
      + ')의 요구사항에 따라 시험한 결과 <b>적합</b>함을 보증합니다.<br>'
      + '본 성적값은 각 코일의 대표 시험편 측정값이며, 시험 방법은 1항 보증 기준에 따른다.</div>'
      + '<div class="rp-sign"><div class="rp-sign-txt">'
      + '문서 지문 <span class="mono">' + esc(doc.fingerprint) + '</span><br>'
      + '재발행·회수 이력은 품질보증서관리 화면에서 확인할 수 있습니다.'
      + '</div>'
      + '<div class="rp-sign-box"><b>검사 책임자</b><i>서명 / 직인</i></div>'
      + '<div class="rp-sign-box"><b>품질보증 책임자</b><i>서명 / 직인</i></div>'
      + '</div>';
  }

  function footHtml(doc, pageNo, pageCount) {
    return '<div class="rp-foot"><span>문서 <b class="mono">' + esc(doc.docId) + '</b></span>'
      + '<span>지문 <b class="mono">' + esc(doc.fingerprint) + '</b></span>'
      + '<span class="rp-spacer"></span>'
      + '<span>상태 <b>' + esc(doc.status) + '</b></span>'
      + '<span><b class="mono">' + pageNo + ' / ' + pageCount + '</b></span></div>';
  }

  function wmHtml(doc) {
    return doc.watermark ? '<div class="rp-wm"><span>' + esc(doc.watermark) + '</span></div>' : '';
  }

  // ── 측정 → 분할 → 렌더 ───────────────────────────────────────────────────
  function measure(doc, host) {
    // 1) 머리글·바닥글만 넣은 실제 높이의 시트에서 본문 가용 높이를 잰다(단위 환산 없이 정확).
    host.innerHTML = '<div class="rp-sheet">' + headHtml(doc, 1, 1)
      + '<div class="rp-body" id="rp-m-body"></div>' + footHtml(doc, 1, 1) + '</div>';
    const bodyH = host.querySelector('#rp-m-body').offsetHeight;
    const sheetPxW = host.querySelector('.rp-sheet').offsetWidth;

    // 2) 높이 제한 없는 시트에 모든 조각을 그려 각각의 높이를 잰다.
    host.innerHTML = '<div class="rp-sheet rp-sheet--measure"><div class="rp-body">'
      + '<div id="rp-m-info">' + infoHtml(doc) + '</div>'
      + '<div id="rp-m-notice">' + noticeHtml(doc) + '</div>'
      + '<div id="rp-m-crit">' + criteriaHtml(doc) + '</div>'
      + '<div class="rp-sect" id="rp-m-coils">' + coilsHeadHtml(doc) + coilsTableHtml(doc, 0, doc.coils.length, true) + '</div>'
      + (doc.revisions.length ? '<div class="rp-sect" id="rp-m-corr">' + corrHeadHtml(doc) + corrTableHtml(doc, 0, doc.revisions.length) + '</div>' : '')
      + '<div id="rp-m-sign">' + signHtml(doc) + '</div>'
      + '</div></div>';
    const coilSect = host.querySelector('#rp-m-coils');
    const csCs = getComputedStyle(coilSect);
    const rowHs = Array.prototype.map.call(coilSect.querySelectorAll('tbody tr'), function (tr) { return tr.offsetHeight; });
    const noticeEl = host.querySelector('#rp-m-notice').firstElementChild;
    const corrSect = host.querySelector('#rp-m-corr');
    const corrBlock = corrSect ? {
      id: 'corr', kind: 'table',
      headH: outerH(corrSect.querySelector('h4')) + corrSect.querySelector('thead').offsetHeight,
      footH: parseFloat(getComputedStyle(corrSect).marginBottom || 0),
      rowHs: Array.prototype.map.call(corrSect.querySelectorAll('tbody tr'), function (tr) { return tr.offsetHeight; }),
    } : null;

    return {
      bodyH: bodyH,
      sheetPxW: sheetPxW,
      blocks: [
        { id: 'info', kind: 'block', h: outerH(host.querySelector('#rp-m-info').firstElementChild) },
        noticeEl ? { id: 'notice', kind: 'block', h: outerH(noticeEl) } : null,
        { id: 'crit', kind: 'block', h: outerH(host.querySelector('#rp-m-crit').firstElementChild) },
        {
          id: 'coils', kind: 'table',
          headH: outerH(coilSect.querySelector('h4')) + coilSect.querySelector('thead').offsetHeight,
          footH: coilSect.querySelector('tfoot').offsetHeight + parseFloat(csCs.marginBottom || 0),
          rowHs: rowHs,
        },
        corrBlock,
        {
          id: 'sign', kind: 'block',
          h: outerH(host.querySelector('.rp-decl')) + outerH(host.querySelector('.rp-sign')),
        },
      ].filter(Boolean),
    };
  }

  function renderPages(doc, pages) {
    const total = pages.length;
    return pages.map(function (pieces, i) {
      let body = '';
      pieces.forEach(function (p) {
        if (p.id === 'info') body += infoHtml(doc);
        else if (p.id === 'notice') body += noticeHtml(doc);
        else if (p.id === 'crit') body += criteriaHtml(doc);
        else if (p.id === 'corr') {
          body += '<div class="rp-sect">' + (p.from === 0 ? corrHeadHtml(doc)
            : '<h4>3. 정정·변경 내역<span class="rp-of">' + (p.from + 1) + ' ~ ' + p.to + ' / ' + doc.revisions.length + '건 (이어서)</span></h4>')
            + corrTableHtml(doc, p.from, p.to) + '</div>';
        }
        else if (p.id === 'sign') body += signHtml(doc);
        else if (p.id === 'coils') {
          body += '<div class="rp-sect">' + (p.from === 0 ? coilsHeadHtml(doc)
            : '<h4>2. 코일별 시험 성적<span class="rp-of">' + (p.from + 1) + ' ~ ' + p.to + ' / ' + doc.coilCount + ' 코일 (이어서)</span></h4>')
            + coilsTableHtml(doc, p.from, p.to, p.last) + '</div>';
        }
      });
      return '<div class="rp-sheet">' + wmHtml(doc) + '<span class="rp-mock">MOCK-UP</span>'
        + headHtml(doc, i + 1, total) + '<div class="rp-body">' + body + '</div>'
        + footHtml(doc, i + 1, total) + '</div>';
    }).join('');
  }

  // ── 오버레이 ─────────────────────────────────────────────────────────────
  function root() {
    let el = document.getElementById(ROOT_ID);
    if (el) return el;
    el = document.createElement('div');
    el.id = ROOT_ID;
    el.className = 'rp-overlay';
    el.innerHTML = '<div class="rp-bar">'
      + '<h3 id="rp-ttl">품질보증서</h3><span class="rp-sub" id="rp-sub"></span>'
      + '<span class="rp-spacer"></span>'
      + '<label title="페이지 분할을 확인하기 위한 목업 조작입니다. 코일당 평균 중량은 유지한 채 총중량을 다시 계산합니다.">코일 수(목업) <input type="number" id="rp-n" min="1" max="200" step="1"></label>'
      + '<button type="button" id="rp-close">닫기</button>'
      + '<button type="button" class="pri" id="rp-print">인쇄 · PDF 저장</button>'
      + '</div>'
      + '<div class="rp-scroll"><div class="rp-pages" id="rp-pages"></div>'
      + '<p class="rp-note">브라우저 인쇄 대화상자에서 <b>용지 A4 · 배율 100% · 여백 없음 · 머리글/바닥글 끄기</b>로 인쇄하거나 «PDF로 저장»을 고르세요. 이 문서는 목업 시드로 생성된 표본입니다.</p>'
      + '</div><div class="rp-measure" id="rp-measure" aria-hidden="true"></div>';
    document.body.appendChild(el);
    el.addEventListener('click', function (e) {
      if (e.target.closest('#rp-close')) close();
      else if (e.target.closest('#rp-print')) printNow();
    });
    el.querySelector('#rp-n').addEventListener('change', function (e) {
      const v = Math.max(1, Math.min(200, Math.round(Number(e.target.value) || 1)));
      e.target.value = v;
      if (state) draw(state.row, v);
    });
    window.addEventListener('resize', fit);
    return el;
  }

  function draw(row, coilCount) {
    const el = root();
    const doc = M().buildCertDoc(row, { coilCount: coilCount });
    const host = el.querySelector('#rp-measure');
    const m = measure(doc, host);
    host.innerHTML = '';
    const pages = M().paginate(m.blocks, m.bodyH);
    el.querySelector('#rp-pages').innerHTML = renderPages(doc, pages);
    el.querySelector('#rp-ttl').textContent = doc.no + ' ' + doc.ver + ' 품질보증서';
    el.querySelector('#rp-sub').textContent = doc.customer + ' · ' + doc.coilCount + ' 코일 · ' + pages.length + '장'
      + (doc.watermark ? ' · ' + doc.watermark : '');
    el.querySelector('#rp-n').value = doc.coilCount;
    state = { row: row, doc: doc, sheetPxW: m.sheetPxW, pageCount: pages.length };
    fit();
    return state;
  }

  // A4 폭이 모듈 패널보다 넓으면 화면에서만 축소한다. 인쇄에는 영향이 없다(@media print 에서 zoom:1).
  function fit() {
    const el = document.getElementById(ROOT_ID);
    if (!el || !el.classList.contains('on') || !state) return;
    const avail = el.querySelector('.rp-scroll').clientWidth - 36;
    const z = Math.min(1, Math.max(0.25, avail / state.sheetPxW));
    el.style.setProperty('--rp-zoom', String(Math.round(z * 1000) / 1000));
  }

  function open(row, autoPrint) {
    const el = root();
    el.classList.add('on');
    document.body.classList.add('rp-on');
    document.body.style.overflow = 'hidden';
    draw(row, null);
    el.querySelector('#rp-print').focus();

    // 웹폰트가 측정 뒤에 도착하면 행 높이가 달라져 장 나눔이 어긋난다(마지막 행이 잘리거나
    // 빈 장이 생긴다). 폰트가 준비되면 같은 코일 수로 한 번 더 그린 뒤 인쇄한다.
    const fonts = document.fonts;
    if (fonts && fonts.ready && fonts.status !== 'loaded') {
      fonts.ready.then(function () {
        if (!isOpen()) return;
        draw(row, state ? state.doc.coilCount : null);
        if (autoPrint) printNow();
      });
    } else if (autoPrint) {
      setTimeout(printNow, 60);
    }
    return state;
  }

  function close() {
    const el = document.getElementById(ROOT_ID);
    if (!el) return;
    el.classList.remove('on');
    document.body.classList.remove('rp-on');
    document.body.style.overflow = '';
    state = null;
  }

  function isOpen() {
    const el = document.getElementById(ROOT_ID);
    return !!(el && el.classList.contains('on'));
  }

  // 포털에서는 이 모듈이 같은 출처의 srcdoc iframe 안에서 돈다. 프레임 안에서 부른
  // window.print() 는 그 프레임 문서만 인쇄한다(크롬·엣지·파이어폭스).
  function printNow() {
    if (!isOpen()) return;
    try { window.focus(); } catch (e) { /* 무시 */ }
    window.print();
  }

  g.MesReport = Object.assign(g.MesReport || {}, {
    open, close, isOpen, printNow, draw,
    _internal: { measure, renderPages, headHtml, infoHtml, noticeHtml, criteriaHtml, coilsTableHtml, corrTableHtml, signHtml, footHtml, outerH },
  });
})(globalThis);

    setRole:function(r){if(MesReport.ROLES[r]){st.role=r;write();}},

  if(r.pending){
    var q=null;repo.requests().forEach(function(x){if(x.id===r.pending)q=x;});
    if(q)h+='<div class="d-sect"><div class="callout"><b>승인 대기</b> '+esc(q.id)+' — '+esc(q.label)+' «'+esc(q.from)+'» → «'+esc(q.to)+'» · 요청 '+esc(q.by)+'. 승인되면 '+nextVer(r)+' 로 재발행됩니다. <span class="lnk" data-tab-go="appr">승인 대기 탭 →</span></div></div>';
  }
  if(d.revisions.length){
    h+='<div class="d-sect"><h4>정정·변경 이력 ('+d.revisions.length+'건)</h4><table class="mini"><tr><th>버전</th><th>대상</th><th>항목</th><th class="num">전 → 후</th></tr>';
    d.revisions.forEach(function(c){h+='<tr><td class="mono">'+esc(c.fromVer)+'→'+esc(c.toVer)+'</td><td class="mono">'+(c.coil?esc(c.coil):'<span class="sub">문서</span>')+'</td><td>'+esc(c.label)+'</td><td class="num" style="white-space:normal">'+esc(c.from)+' → <b>'+esc(c.to)+'</b></td></tr>';});
    h+='</table><div class="note" style="margin-top:8px">사유·처리자·일시는 «정정·변경 이력» 탭과 재발행본 3항에 있습니다.</div></div>';
  }
  return h;
}

// ── 시험값 정정 ────────────────────────────────────────────────────────────
// 시험값(YP·TS·EL·도금량)은 correct 등급 — 사유를 남기고 현재 버전을 회수한 뒤 다음 버전으로
// 재발행하는 절차로만 고친다. 두께·폭·중량은 locked — 원천(생산실적·계량)에서 정정한다.
var corr={row:null,doc:null,mode:null}; // mode: 'correct' | 'change' — 같은 모달 껍데기를 쓴다
var CHG_REASONS=['수요가 요청','상호·사업장 변경','오기 정정','기타'];
var REASONS=['시험기 보정 반영','전사(입력) 오류','재시험 결과 반영','기타'];
function localNow(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());}
function nextVer(r){return 'v'+((MesReport.num(r.ver)||1)+1);}
function openCorrection(id){
  var r=rowById(id);if(!r)return;
  if(!MesReport.can(curRole(),'correct')){toast('시험값 정정은 '+MesReport.rolesFor('correct')+' 권한입니다');return;}
  if(!/^(발행|재발행)$/.test(r.st)){toast('발행·재발행 상태만 정정할 수 있습니다');return;}
  corr.row=r;corr.doc=MesReport.buildCertDoc(r);corr.mode='correct';
  var d=corr.doc,F=MesReport.FIELDS,nv=nextVer(r);
  $('#corr-title').textContent='시험값 정정 — '+r.no+' '+r.ver+' → '+nv;
  var h='<div class="callout">시험값은 <b>정정 절차로만</b> 고칩니다. 저장하면 <b>'+esc(r.ver)+' 은 회수</b>되고 정정된 값으로 <b>'+nv+' 가 재발행</b>됩니다. '
    +'정정 내역(전·후·사유·정정자·일시)은 재발행본의 3항에 인쇄되고 정정된 칸에는 ※ 가 붙습니다. '
    +'두께·폭·중량은 생산실적·계량 값이라 이 화면에서 고칠 수 없습니다 — 원천에서 정정하세요.</div>';
  h+='<div class="grid"><table class="mini corr-tbl"><thead><tr><th>코일번호</th>';
  ['thk','wid','wgt'].forEach(function(k){var f=F['coils[].'+k];h+='<th class="lock num" title="'+esc(f.src)+' 값 — 이 화면에서 정정 불가">'+esc(f.label)+' <span class="lk">잠금</span></th>';});
  MesReport.TEST_FIELDS.forEach(function(k){var f=F['coils[].'+k];var min=k==='coat'?d.coat.min:d.spec[k];
    h+='<th class="num">'+esc(f.sym)+' <span class="sub" style="display:inline">('+esc(f.unit)+')</span><span class="min">'+(min==null?'규정 없음':'기준 ≥ '+min)+'</span></th>';});
  h+='</tr></thead><tbody>';
  d.coils.forEach(function(c){
    h+='<tr><td class="mono">'+esc(c.no)+'<span class="sub">'+esc(c.heat)+'</span></td>'
      +'<td class="lock num mono">'+(c.thk==null?'—':c.thk.toFixed(3))+'</td><td class="lock num mono">'+MesReport.comma(c.wid)+'</td><td class="lock num mono">'+MesReport.comma(c.wgt)+'</td>';
    MesReport.TEST_FIELDS.forEach(function(k){
      var noRule=k==='el'&&d.spec.el==null;
      h+='<td class="num">'+(noRule?'<span class="sub">규정 없음</span>'
        :'<input type="number" step="1" class="ci" data-coil="'+esc(c.no)+'" data-field="'+k+'" data-cur="'+c[k]+'" value="'+c[k]+'" aria-label="'+esc(c.no)+' '+esc(F['coils[].'+k].label)+'">'
         +'<span class="cur">현재 '+c[k]+(c.corrected&&c.corrected[k]?' ※':'')+'</span>')+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="form" style="padding:0;grid-template-columns:220px 1fr"><div class="f-field"><label>정정 사유 (필수)</label><select class="inp" id="corr-cat">'
    +REASONS.map(function(x){return '<option>'+esc(x)+'</option>';}).join('')+'</select></div>'
    +'<div class="f-field"><label>상세</label><input class="inp" id="corr-txt" placeholder="예) 9/15 인장시험기 교정 후 재산출" maxlength="120" autocomplete="off"></div></div>';
  h+='<div class="note">정정자 <b>'+esc(curUser())+'</b> ('+esc(MesReport.ROLES[curRole()].label)+') · 정정 일시 '+localNow().replace('T',' ')+'</div>';
  $('#corr-body').innerHTML=h;
  closeDrawer();
  $('#corr').classList.add('on');$('#corr').setAttribute('aria-hidden','false');$('#scrim').classList.add('on');
  corrValidate();
  var first=$('#corr .ci');if(first)first.focus();
}
function corrItems(){
  // 비운 칸은 '변경 없음'으로 본다 — 새 값을 치려고 지운 순간마다 오류를 내지 않기 위해
  return $$('#corr .ci').map(function(i){var cur=i.getAttribute('data-cur');return {coil:i.getAttribute('data-coil'),field:i.getAttribute('data-field'),to:i.value===''?cur:i.value,cur:cur,el:i};});
}
function corrReason(){var c=$('#corr-cat'),t=$('#corr-txt');if(!c)return '';var x=(t&&t.value.trim())||'';return c.value+(x?' — '+x:'');}
function corrValidate(){
  if(corr.mode==='change'){chgValidate();return;}
  if(!corr.doc)return;
  var items=corrItems();
  var v=MesReport.validateCorrections(corr.doc,items.map(function(i){return {coil:i.coil,field:i.field,to:i.to};}));
  items.forEach(function(i){
    var err=null;v.errors.forEach(function(e){if(e.coil===i.coil&&e.field===i.field)err=e;});
    var chg=String(i.to)!==String(i.cur);
    i.el.classList.toggle('chg',chg&&!err);i.el.classList.toggle('bad',!!err);
    var old=i.el.parentNode.querySelector('.err');if(old)old.remove();
    if(err){var sp=document.createElement('span');sp.className='err';sp.textContent=err.reason;i.el.parentNode.appendChild(sp);}
    i.el.title=err?err.reason:'';
  });
  var ok=v.ok&&!!corrReason();
  $('#corr-sum').innerHTML='변경 <b>'+v.changed.length+'건</b>'+(v.errors.length?' · <span class="bad">오류 '+v.errors.length+'건</span>':'')
    +(!v.changed.length&&!v.errors.length?' — 정정할 값을 입력하세요':'');
  $('#corr-submit').disabled=!ok;
  $('#corr-submit').textContent=nextVer(corr.row)+' 로 정정 재발행';
}
function corrSubmit(){
  if(!corr.row||$('#corr-submit').disabled)return;
  if(corr.mode==='change'){chgSubmit();return;}
  var items=corrItems().map(function(i){return {coil:i.coil,field:i.field,to:i.to};});
  var res;
  try{res=repo.correct(corr.row.id,{items:items,reason:corrReason(),by:curUser(),at:localNow()});}
  catch(e){toast(e.message);return;}
  ROWS=repo.rows();
  closeCorrection();renderTable();renderHistory();
  toast(res.reissued.no+' '+res.recalled.ver+' 회수 → '+res.reissued.ver+' 재발행 · '+res.history.items.length+'건 정정');
  MesReport.open(res.reissued,false);
}
function closeCorrection(){$('#corr').classList.remove('on');$('#corr').setAttribute('aria-hidden','true');$('#scrim').classList.remove('on');corr.row=null;corr.doc=null;corr.mode=null;}

// ── 표기명 변경 요청 (approve 등급) ────────────────────────────────────────
// 요청은 누구나, 승인은 품질관리자·개발자, 요청자 본인은 승인 불가. 승인되면 회수/재발행.
function openChange(id){
  var r=rowById(id);if(!r)return;
  var role=curRole();
  if(!MesReport.can(role,'request')){toast('변경 요청은 '+MesReport.rolesFor('request')+' 권한입니다');return;}
  if(!/^(발행|재발행)$/.test(r.st)){toast('발행·재발행 상태만 변경 요청할 수 있습니다');return;}
  if(r.pending){toast('승인 대기 중인 요청이 있습니다: '+r.pending);return;}
  corr.row=r;corr.doc=null;corr.mode='change';
  var F=MesReport.FIELDS['customer.displayName'],cur=F.get(r);
  $('#corr-title').textContent='표기명 변경 요청 — '+r.no+' '+r.ver;
  var h='<div class="callout">수요가 표기명은 <b>approve 등급</b>입니다. 요청하면 <b>승인 대기</b>가 되고 '+esc(MesReport.rolesFor('approve'))
    +'가 승인하면 <b>'+esc(r.ver)+' 회수 → '+nextVer(r)+' 재발행</b>됩니다. 승인 전까지 문서는 그대로입니다. <b>요청자 본인은 승인할 수 없습니다.</b></div>';
  h+='<div class="form" style="padding:0">'
    +'<div class="f-field"><label>현재 표기명</label><input class="inp" value="'+esc(cur)+'" disabled></div>'
    +'<div class="f-field"><label>새 표기명</label><input class="inp" id="chg-to" placeholder="예) 수요가 A 주식회사 부산공장" maxlength="60" autocomplete="off"></div>'
    +'<div class="f-field"><label>사유 (필수)</label><select class="inp" id="corr-cat">'+CHG_REASONS.map(function(x){return '<option>'+esc(x)+'</option>';}).join('')+'</select></div>'
    +'<div class="f-field"><label>상세</label><input class="inp" id="corr-txt" placeholder="예) 수요가 공문 2026-09-15" maxlength="120" autocomplete="off"></div></div>';
  h+='<div class="note">요청자 <b>'+esc(curUser())+'</b> ('+esc(MesReport.ROLES[role].label)+') · '+localNow().replace('T',' ')+'</div>';
  $('#corr-body').innerHTML=h;
  closeDrawer();
  $('#corr').classList.add('on');$('#corr').setAttribute('aria-hidden','false');$('#scrim').classList.add('on');
  chgValidate();
  $('#chg-to').focus();
}
function chgValidate(){
  if(!corr.row)return;
  var to=($('#chg-to').value||'').trim(),cur=MesReport.FIELDS['customer.displayName'].get(corr.row);
  var err=!to?'새 표기명을 입력하세요':to===cur?'현재 값과 같습니다':'';
  $('#corr-sum').innerHTML=err?'<span class="bad">'+esc(err)+'</span>':'변경 <b>1건</b> · '+esc(cur)+' → <b>'+esc(to)+'</b>';
  $('#corr-submit').disabled=!!err||!corrReason();
  $('#corr-submit').textContent='승인 요청';
}
function chgSubmit(){
  var q;
  try{q=repo.request(corr.row.id,{field:'customer.displayName',to:$('#chg-to').value,reason:corrReason(),by:curUser(),role:curRole(),at:localNow()});}
  catch(e){toast(e.message);return;}
  closeCorrection();renderTable();renderApprovals();
  toast(q.no+' '+q.ver+' 표기명 변경 요청 '+q.id+' — 승인 대기');
  setTab('appr');
}
function renderApprovals(){
  var Q=repo.requests(),role=curRole(),me=curUser();
  var wait=Q.filter(function(q){return q.status==='대기';});
  $('#cnt-appr').textContent=wait.length;
  $('#appr-meta').innerHTML='승인 대기 <b>'+wait.length+'건</b> · 전체 '+Q.length+'건 · 승인·반려는 <b>'+esc(MesReport.rolesFor('approve'))+'</b>, 요청자 본인 제외 · 현재 <b>'+esc(MesReport.ROLES[role].label)+' '+esc(me)+'</b>';
  if(!Q.length){$('#appr-grid').innerHTML='<div class="empty"><div class="big">승인 대기 요청이 없습니다</div>발행 목록에서 보증서를 열고 «표기명 변경 요청»을 내면 여기에 쌓입니다</div>';return;}
  var h='<table class="tbl"><thead><tr><th>요청 일시</th><th>보증서</th><th>항목</th><th>현재 → 요청</th><th>사유</th><th>요청자</th><th>상태</th><th></th></tr></thead><tbody>';
  Q.forEach(function(q){
    var ok=MesReport.can(role,'approve')&&q.by!==me;
    var tip=!MesReport.can(role,'approve')?'승인·반려는 '+MesReport.rolesFor('approve')+' 권한입니다':q.by===me?'요청자 본인은 승인·반려할 수 없습니다':'';
    h+='<tr><td class="mono">'+esc(String(q.at).replace('T',' '))+'</td>'
      +'<td><span class="lnk" data-open="'+esc(q.rowId)+'">'+esc(q.no)+'</span><span class="sub">'+esc(q.ver)+(q.toVer?' → '+esc(q.toVer):'')+'</span></td>'
      +'<td>'+esc(q.label)+'</td>'
      +'<td style="white-space:normal;max-width:240px">'+esc(q.from)+' → <b>'+esc(q.to)+'</b></td>'
      +'<td style="white-space:normal;max-width:220px">'+esc(q.reason)+(q.rejectReason?'<span class="sub">반려: '+esc(q.rejectReason)+'</span>':'')+'</td>'
      +'<td>'+esc(q.by)+'</td>'
      +'<td>'+pill(q.status)+(q.approvedBy?'<span class="sub">'+esc(q.approvedBy)+' · '+esc(String(q.approvedAt).replace('T',' '))+'</span>':'')+'</td>'
      +'<td>'+(q.status==='대기'
        ?'<button class="btn btn-sm btn-pri" data-appr="ok" data-req="'+esc(q.id)+'"'+(ok?'':' disabled title="'+esc(tip)+'"')+'>승인</button> '
         +'<button class="btn btn-sm btn-warn" data-appr="no" data-req="'+esc(q.id)+'"'+(ok?'':' disabled title="'+esc(tip)+'"')+'>반려</button>'
        :'')+'</td></tr>';
  });
  $('#appr-grid').innerHTML=h+'</tbody></table>';
}
// 역할 토글 — 옵션은 모델의 ROLES 에서 만든다
function renderRole(){
  var el=$('#role');
  el.innerHTML=Object.keys(MesReport.ROLES).map(function(k){var R=MesReport.ROLES[k];return '<option value="'+k+'">'+esc(R.label)+' · '+esc(R.name)+'</option>';}).join('');
  el.value=curRole();
}
function onRoleChange(){
  var R=MesReport.ROLES[curRole()];
  renderTable();renderHistory();renderApprovals();renderTemplateGate();
  if(sel)openDrawer(sel);
  toast('역할 전환: '+R.label+' · '+R.name);
}
// 양식 관리는 개발자 권한 — 표준 템플릿·필드 등급은 개발자가, 현업은 파생 양식만(다음 단계)
var TMPL_HTML=null;
function renderTemplateGate(){
  var box=$('#sc-hist .card');if(TMPL_HTML==null)TMPL_HTML=box.innerHTML;
  var role=curRole();
  box.innerHTML=MesReport.can(role,'template')?TMPL_HTML
    :'<div class="empty"><div class="big">양식 관리는 '+esc(MesReport.rolesFor('template'))+' 권한입니다</div>현재 역할 '+esc(MesReport.ROLES[role].label)+' · 표준 템플릿과 필드 편집 등급은 개발자가 관리하고, 현업은 파생 양식만 다룹니다 (다음 단계)</div>';
}
function renderHistory(){
  var H=repo.history();
  $('#cnt-corr').textContent=H.length;
  $('#corr-meta').innerHTML='정정·변경 재발행 <b>'+H.length+'건</b> · 이 브라우저에 저장됨';
  var rb=$('[data-action="reset-seed"]');rb.disabled=!MesReport.can(curRole(),'reset');rb.title=rb.disabled?'시드 초기화는 '+MesReport.rolesFor('reset')+' 권한입니다':'';
  if(!H.length){$('#corr-grid').innerHTML='<div class="empty"><div class="big">정정·변경 이력이 없습니다</div>«시험값 정정»을 실행하거나 «표기명 변경 요청»이 승인되면 여기에 남습니다</div>';return;}
  var h='<table class="tbl"><thead><tr><th>일시</th><th>구분</th><th>보증서</th><th>버전</th><th>처리자</th><th>사유</th><th>항목</th></tr></thead><tbody>';
  H.forEach(function(e){
    h+='<tr><td class="mono">'+esc(String(e.at).replace('T',' '))+'</td>'
      +'<td>'+(e.kind==='change'?'<span class="pill acc">표기 변경</span>':'<span class="pill hold">시험값 정정</span>')+'</td>'
      +'<td><span class="lnk" data-open="'+esc(e.no+'-'+e.toVer)+'">'+esc(e.no)+'</span></td>'
      +'<td class="mono">'+esc(e.fromVer)+' → '+esc(e.toVer)+'</td><td>'+esc(e.by)+'</td>'
      +'<td style="white-space:normal;max-width:280px">'+esc(e.reason)+'</td>'
      +'<td><div class="hist-items">'+e.items.map(function(i){return i.coil?'<span class="code">'+esc(i.coil)+' '+esc((FIELD_LABEL[i.field]||i.field).split(' ').pop())+' '+i.from+'→'+i.to+'</span>'
        :'<span class="code">'+esc(i.label)+' '+esc(i.from)+'→'+esc(i.to)+' · 요청 '+esc(i.requestedBy||'')+'</span>';}).join('')+'</div></td></tr>';
  });
  $('#corr-grid').innerHTML=h+'</tbody></table>';
}
renderRole();
renderTable();
renderHistory();
renderApprovals();
renderTemplateGate();
</script>
</body>
</html>
