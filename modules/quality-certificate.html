<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q-CERT 품질보증서관리</title>
<script>try{if(window.self!==window.top)document.documentElement.classList.add('embedded');}catch(e){document.documentElement.classList.add('embedded');}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   Q-CERT — MES 품질보증서관리 1차 화면 목업 (Direction A '스틸 & 페이퍼')
   출하 코일에 대한 품질보증서(성적서) 발행·재발행·회수 관리. 수요가는 가명.
   시드 데이터는 가상 값이며 고객사·제조사는 가명(A/B/C)이다.
   ============================================================ */

:root{
  --bg:#F5F4F0;--surface:#FFFFFF;--surface-2:#F1F0EB;--surface-3:#E9E7E1;
  --border:#E8E6E1;--border-strong:#D6D2CA;
  --ink:#1C2126;--ink-2:#4A5158;--ink-3:#8A9198;
  --accent:#166578;--accent-strong:#0F4854;--accent-on:#FFFFFF;--accent-soft:#E4EEF1;--accent-soft-ink:#0F4854;
  --result:#96610E;--result-soft:#FBF0DC;--result-soft-ink:#7A4F0B;
  --danger:#B03A32;--danger-bg:#F7E4E2;--ok:#276B39;--ok-bg:#E8F2E9;--hold:#3F5E8C;--hold-bg:#E7ECF6;
  --code-bg:#F1F0EC;--scrim:rgba(28,26,22,.44);--shadow:0 8px 28px rgba(44,40,32,.12);
  --topbar-bg:#FBFAF7;--topbar-ink:#3A4148;--topbar-dim:#7A8188;--focus:#166578;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;font-size:13.5px;color:var(--ink);background:var(--bg);line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:is(a,button,input,select):focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.mono{font-family:'JetBrains Mono','Consolas',ui-monospace,monospace}
.topbar{background:var(--topbar-bg);color:var(--topbar-ink);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;height:52px;padding:0 20px;position:sticky;top:0;z-index:30}
.embedded .topbar{display:none}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:12px;color:#fff}
.brand-name{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:15px;letter-spacing:.04em}
.crumb{color:var(--topbar-dim);font-size:12.5px}
.mock{margin-left:auto;font-size:10.5px;letter-spacing:.08em;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--border-strong);color:var(--ink-2)}
.tabs{display:flex;gap:22px;padding:0 26px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:20}
.embedded .tabs{top:0}
.tab{display:flex;align-items:center;gap:7px;height:46px;font-size:14px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--accent);font-weight:800;border-bottom-color:var(--accent)}
.cnt{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:11px;font-weight:700}
.tab.on .cnt{background:var(--accent-soft);color:var(--accent)}
.sc{display:none;padding:18px 26px 28px;flex-direction:column;gap:14px}
.sc.on{display:flex}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px}
.fbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:14px 16px}
.f-field{display:flex;flex-direction:column;gap:5px}
.f-field label{font-size:11px;font-weight:700;color:var(--ink-3)}
.inp{height:38px;padding:0 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);font-size:13px;color:var(--ink);min-width:120px}
.inp:focus{border-color:var(--accent)}
.f-spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-pri{background:var(--accent);border-color:var(--accent);color:var(--accent-on);font-weight:700}
.btn-pri:hover{background:var(--accent-strong)}
.btn-warn{background:var(--result-soft);border-color:#E8C89A;color:var(--result);font-weight:700}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
.meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);padding:0 2px}
.meta b{color:var(--ink)}
.grid{overflow:auto}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-2);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:#FAF9F6}
.tbl tr.row.sel td{background:var(--accent-soft)}
.tbl .num{text-align:right;font-family:'JetBrains Mono',monospace}
.sub{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.lnk{color:var(--accent);font-weight:700;font-family:'JetBrains Mono',monospace}
.code{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;background:var(--code-bg);color:var(--ink-2);font-size:11.5px;font-weight:600;font-family:'JetBrains Mono',monospace}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.no{background:var(--danger-bg);color:var(--danger)}
.pill.warn{background:var(--result-soft);color:var(--result)}
.pill.hold{background:var(--hold-bg);color:var(--hold)}
.pill.dim{background:var(--surface-2);color:var(--ink-2)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.chk{display:inline-flex;gap:4px}
.chk span{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:800;background:var(--ok-bg);color:var(--ok)}
.chk span.x{background:var(--danger-bg);color:var(--danger)}
.chk span.q{background:var(--surface-2);color:var(--ink-3)}
.empty{padding:48px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.empty .big{font-size:16px;font-weight:800;color:var(--ink-2);margin-bottom:6px}
.form{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px 16px;padding:18px}
.form .f-field .inp{min-width:0;width:100%}
.form-foot{display:flex;gap:10px;justify-content:flex-end;padding:0 18px 18px}
.note{font-size:12px;color:var(--ink-3);padding:0 2px}
/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:92vw;background:var(--surface);box-shadow:var(--shadow);z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .18s ease}
.drawer.on{transform:none}
.d-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.d-head h3{margin:0;font-size:15.5px;font-weight:800;flex:1}
.d-close{width:32px;height:32px;border-radius:8px;color:var(--ink-3);font-size:16px}
.d-close:hover{background:var(--surface-2)}
.d-body{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.d-sect h4{margin:0 0 8px;font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:13px}
.kv dt{color:var(--ink-3);margin:0}
.kv dd{margin:0;font-weight:500}
.d-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border)}
table.mini{width:100%;border-collapse:collapse;font-size:12.5px}
.mini th{background:var(--surface-2);font-size:11px;color:var(--ink-2);padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)}
.mini td{padding:7px 10px;border-bottom:1px solid var(--border)}
.mini .num{text-align:right;font-family:'JetBrains Mono',monospace}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.18s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tagcard{border:1.5px solid var(--ink);border-radius:8px;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;background:#fff}
.tagcard b{display:block;font-size:10px;color:var(--ink-3);font-family:'Gothic A1',sans-serif;font-weight:700}
.tagcard .big{grid-column:1/-1;font-size:20px;font-weight:600;letter-spacing:.04em}
.layer{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:10px}
.layer .sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--border-strong)}
.layer .nm{flex:1;font-weight:700}
.layer .th{font-family:'JetBrains Mono',monospace;color:var(--ink-2)}


/* A4 보증서 리포트 — assets/report/report.css 주입 구간 (build/inject_report.py) */
/*__REPORT_CSS_START__*/
/* assets/report/report.css — A4 품질보증서 시트 + 미리보기 오버레이 + 인쇄 스타일
   빌드 시 build/inject_report.py 가 modules/quality-certificate.html 마커 구간에 복사한다.

   화면 미리보기와 인쇄가 같은 규칙을 탄다. 미리보기 전용 CSS를 따로 두면
   "화면과 출력이 다르다"가 반드시 생기므로, 화면에서만 다른 것은 배율·그림자·스크림뿐이다. */

:root{
  /* A4. 시트 높이를 297mm 로 딱 맞추면 렌더러 반올림 때문에 빈 페이지가 한 장 더 나오는
     브라우저가 있어 0.2mm 를 뺀다. 빈 장이 보이면 이 값을 더 줄인다. */
  --rp-sheet-w:210mm; --rp-sheet-h:296.8mm;
  --rp-pad-x:15mm; --rp-pad-y:14mm;
  --rp-ink:#000; --rp-ink-2:#333; --rp-ink-3:#666;
  --rp-line:#000; --rp-line-2:#999; --rp-band:#ECECEC;
  --rp-zoom:1;
}

/* ── 미리보기 오버레이 (화면 전용) ───────────────────────────────────────── */
.rp-overlay{position:fixed;inset:0;z-index:80;background:rgba(28,26,22,.55);display:none;flex-direction:column}
.rp-overlay.on{display:flex}
.rp-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#23282D;color:#fff;flex:0 0 auto}
.rp-bar h3{margin:0;font-size:14px;font-weight:800;letter-spacing:.01em}
.rp-bar .rp-sub{font-size:12px;color:#B9C0C7}
.rp-bar .rp-spacer{flex:1}
.rp-bar label{font-size:11.5px;color:#B9C0C7;display:flex;align-items:center;gap:6px}
.rp-bar input[type=number]{width:62px;height:30px;padding:0 8px;border-radius:8px;border:1px solid #4A5158;background:#161A1E;color:#fff;font:inherit;font-size:12.5px}
.rp-bar button{height:32px;padding:0 14px;border-radius:9px;border:1px solid #4A5158;background:#2E353B;color:#fff;font-size:13px;font-weight:600}
.rp-bar button:hover{background:#3A4147}
.rp-bar button.pri{background:#166578;border-color:#166578;font-weight:800}
.rp-bar button.pri:hover{background:#0F4854}
.rp-scroll{flex:1;overflow:auto;padding:18px 0 28px}
.rp-pages{zoom:var(--rp-zoom);display:flex;flex-direction:column;align-items:center;gap:14px}
.rp-note{color:#C9D0D7;font-size:11.5px;text-align:center;padding:0 16px 10px}

/* 측정 전용 컨테이너. 화면 밖에 두되 레이아웃은 실제와 같은 폭으로 잡아야 높이가 맞는다. */
.rp-measure{position:absolute;left:-10000px;top:0;visibility:hidden;pointer-events:none;zoom:1}
.rp-sheet--measure{height:auto;box-shadow:none}

/* ── A4 시트 ─────────────────────────────────────────────────────────────── */
.rp-sheet{
  position:relative;box-sizing:border-box;
  width:var(--rp-sheet-w);height:var(--rp-sheet-h);
  padding:var(--rp-pad-y) var(--rp-pad-x);
  background:#fff;color:var(--rp-ink);overflow:hidden;
  font-family:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;
  font-size:8.6pt;line-height:1.38;
  display:flex;flex-direction:column;
  box-shadow:0 6px 24px rgba(0,0,0,.35);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.rp-body{flex:1;display:flex;flex-direction:column;min-height:0}
.rp-sheet .mono{font-family:'JetBrains Mono','Consolas',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.rp-sheet .num{text-align:right;font-family:'JetBrains Mono','Consolas',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.rp-sheet .ctr{text-align:center}

/* 머리글 — 모든 장에 반복 */
.rp-head{flex:0 0 auto;border-bottom:1.6pt solid var(--rp-line);padding-bottom:3mm;margin-bottom:4mm}
.rp-head-top{display:flex;align-items:flex-start;gap:8mm}
.rp-maker{flex:0 0 52mm}
.rp-maker b{display:block;font-size:10pt;font-weight:800;letter-spacing:.02em}
.rp-maker span{display:block;font-size:7.4pt;color:var(--rp-ink-3);margin-top:.6mm}
.rp-title{flex:1;text-align:center}
.rp-title b{display:block;font-size:16pt;font-weight:800;letter-spacing:.22em;padding-left:.22em}
.rp-title span{display:block;font-size:7.6pt;color:var(--rp-ink-2);letter-spacing:.06em;margin-top:.8mm}
.rp-stamp{flex:0 0 52mm;display:grid;grid-template-columns:auto 1fr;gap:.6mm 3mm;font-size:7.6pt}
.rp-stamp dt{color:var(--rp-ink-3);margin:0;white-space:nowrap}
.rp-stamp dd{margin:0;text-align:right;font-weight:700}

/* 정보 블록 — 1장에만 */
.rp-info{flex:0 0 auto;margin-bottom:4mm}
.rp-info table{width:100%;border-collapse:collapse;font-size:8.4pt}
.rp-info th,.rp-info td{border:.5pt solid var(--rp-line-2);padding:1.5mm 2.4mm;vertical-align:middle}
.rp-info th{background:var(--rp-band);text-align:left;font-weight:700;width:24mm;white-space:nowrap;color:var(--rp-ink-2)}

.rp-sect{flex:0 0 auto;margin-bottom:4mm}
.rp-sect > h4{margin:0 0 1.6mm;font-size:8.6pt;font-weight:800;letter-spacing:.04em}
.rp-sect > h4 .rp-of{font-weight:400;color:var(--rp-ink-3);font-size:7.6pt;margin-left:2mm}

/* 표 공통 */
.rp-tbl{width:100%;border-collapse:collapse;font-size:8pt;table-layout:fixed}
.rp-tbl th,.rp-tbl td{border:.5pt solid var(--rp-line-2);padding:1.15mm 1.6mm;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-tbl thead th{background:var(--rp-band);font-weight:700;text-align:center;color:var(--rp-ink-2)}
.rp-tbl tfoot td{background:#F6F6F6;font-weight:700}
.rp-tbl .sub{font-size:7pt;color:var(--rp-ink-3)}
.rp-pass{font-weight:800}
.rp-fail{font-weight:800;text-decoration:underline}

/* 판정문·서명 — 마지막 장에만 */
.rp-decl{flex:0 0 auto;border:.8pt solid var(--rp-line);padding:3mm 4mm;margin-bottom:4mm;font-size:8.6pt;line-height:1.55}
.rp-decl b{font-weight:800}
.rp-sign{flex:0 0 auto;display:flex;gap:6mm;align-items:flex-end}
.rp-sign-txt{flex:1;font-size:8pt;color:var(--rp-ink-2);line-height:1.6}
.rp-sign-box{flex:0 0 40mm;border:.5pt solid var(--rp-line-2);height:26mm;display:flex;flex-direction:column}
.rp-sign-box b{display:block;background:var(--rp-band);border-bottom:.5pt solid var(--rp-line-2);padding:1.2mm 0;text-align:center;font-size:7.6pt;font-weight:700;color:var(--rp-ink-2)}
.rp-sign-box i{flex:1;display:grid;place-items:center;font-style:normal;font-size:7.4pt;color:var(--rp-ink-3)}

/* 바닥글 — 모든 장에 반복 */
.rp-foot{flex:0 0 auto;margin-top:auto;padding-top:2.4mm;border-top:.5pt solid var(--rp-line-2);display:flex;align-items:baseline;gap:6mm;font-size:7pt;color:var(--rp-ink-3)}
.rp-foot .rp-spacer{flex:1}
.rp-foot b{font-weight:700;color:var(--rp-ink-2)}

/* 워터마크 */
.rp-wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0}
.rp-wm span{font-size:72pt;font-weight:800;letter-spacing:.18em;color:rgba(176,58,50,.13);transform:rotate(-24deg);white-space:nowrap}
.rp-sheet > *{position:relative;z-index:1}

/* 목업 표시 — 실제 발행본과 헷갈리지 않게 모든 장에 남긴다 */
.rp-mock{position:absolute;right:var(--rp-pad-x);top:calc(var(--rp-pad-y) / 2);font-size:6.6pt;letter-spacing:.14em;font-weight:800;color:#B03A32;z-index:2}

/* ── 인쇄 ────────────────────────────────────────────────────────────────── */
@page{size:A4;margin:0}
@media print{
  /* 미리보기가 열려 있을 때만 화면을 리포트로 바꾼다. 닫힌 상태의 Ctrl+P 는 건드리지 않는다. */
  body.rp-on{margin:0!important;padding:0!important;background:#fff!important;height:auto!important}
  body.rp-on > *:not(#rp-root){display:none!important}
  body.rp-on #rp-root{position:static!important;display:block!important;inset:auto!important;background:none!important}
  body.rp-on #rp-root .rp-bar,
  body.rp-on #rp-root .rp-note,
  body.rp-on #rp-root .rp-measure{display:none!important}
  body.rp-on .rp-scroll{overflow:visible!important;padding:0!important}
  body.rp-on .rp-pages{zoom:1!important;display:block!important;gap:0!important}
  body.rp-on .rp-sheet{box-shadow:none!important;margin:0!important;break-after:page;page-break-after:always}
  body.rp-on .rp-sheet:last-child{break-after:auto;page-break-after:auto}
}
/*__REPORT_CSS_END__*/
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">M</span><span class="brand-name">Q-CERT</span></div>
  <span class="crumb">출력물관리 › 품질보증서관리</span>
  <span class="mock">MOCK-UP</span>
</header>
<nav class="tabs" role="tablist">
  <button class="tab on" role="tab" data-tab="list" aria-selected="true">발행 목록 <span class="cnt">9</span></button>
  <button class="tab" role="tab" data-tab="reg" aria-selected="false">발행 요청</button>
  <button class="tab" role="tab" data-tab="hist" aria-selected="false">양식 관리</button>
</nav>
<main>
<section class="sc on" id="sc-list">
  <div class="card fbar">
    <div class="f-field"><label>발행일(부터)</label><input class="inp" type="date" value="2026-08-25"></div>

<script>
'use strict';
/* A4 보증서 리포트 — assets/report/*.js 주입 구간 (build/inject_report.py). 전역 MesReport */
/*__REPORT_JS_START__*/
/* assets/report/report-model.js — 품질보증서 문서 모델 + 페이지 분할 (순수 함수, DOM 없음)
   빌드 시 build/inject_report.py 가 modules/quality-certificate.html 마커 구간에 복사한다.

   0단계 리포트 프로토타입의 데이터 레이어다. 양식은 아직 JSON이 아니라 코드에 고정돼 있고
   (1단계에서 양식 스키마로 분리), 여기서는 "발행 목록 1행 → A4 문서 데이터" 변환만 담당한다. */
(function (g) {
  'use strict';

  // ── 규격 기준 ────────────────────────────────────────────────────────────
  // 규격약호에서 강종을 골라 기계적 성질 하한을 정한다. 목업 값이며 실제 KS 표를 옮긴 것이 아니다.
  // min 만 쓰는 이유: 보증서에 싣는 항목이 모두 '이상' 기준이기 때문이다.
  const SPECS = [
    { re: /SGC340|CGC340/, grade: 'SGC340', yp: 245, ts: 340, el: 20 },
    { re: /SGLC570/, grade: 'SGLC570', yp: 560, ts: 570, el: null },
    { re: /SGLCC|CGLCC/, grade: 'SGLCC', yp: 205, ts: 270, el: 20 },
    { re: /SGCC|CGCC/, grade: 'SGCC', yp: 205, ts: 270, el: 20 },
  ];
  const DEFAULT_SPEC = { grade: '일반용', yp: 205, ts: 270, el: 20 };

  // 품명코드 → 도금 종류·최소 부착량(양면, g/㎡). 주문 도금량코드가 시드에 없어 품명 기본값을 쓴다.
  const COATS = {
    G: { code: 'Z12', min: 120, label: '용융아연도금 (Z12)' },
    L: { code: 'AZ150', min: 150, label: '알루미늄아연도금 (AZ150)' },
    W: { code: 'AM90', min: 90, label: '아연알루미늄마그네슘도금 (AM90)' },
    3: { code: 'Z08', min: 80, label: '칼라원판 용융아연도금 (Z08)' },
    4: { code: 'AZ100', min: 100, label: '칼라원판 알루미늄아연도금 (AZ100)' },
  };
  const DEFAULT_COAT = { code: 'Z08', min: 80, label: '용융아연도금 (Z08)' };

  // 상태 → 워터마크. '발행'만 워터마크가 없다.
  const WATERMARKS = { 초안: 'DRAFT', 재발행: 'REISSUE', 회수: 'VOID' };

  const TEST_METHODS = { yp: 'KS B 0802', ts: 'KS B 0802', el: 'KS B 0802', coat: 'KS D 0201' };

  // ── 작은 유틸 ────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 문자열에서 첫 숫자. 콤마 제거. 없으면 null. (shape-model.num 과 같은 규약)
  function num(v) {
    if (typeof v === 'number') return Number.isFinite(v) ? v : null;
    if (v == null) return null;
    const m = String(v).replace(/,/g, '').match(/-?\d+(?:\.\d+)?/);
    return m ? Number(m[0]) : null;
  }

  function comma(n) {
    if (n == null || !Number.isFinite(n)) return '—';
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  function parseSize(s) {

    return { thk: num(parts[0]), wid: num(parts[1]) };
  }

  // '3 : CCGI · KS3-CGCC' → { code: '3', name: 'CCGI', spec: 'KS3-CGCC' }
  function parsePrd(s) {
    const t = String(s == null ? '' : s);
    const head = t.split('·')[0] || '';
    const tail = t.indexOf('·') >= 0 ? t.slice(t.indexOf('·') + 1) : '';
    const bits = head.split(':');
    return {
      code: (bits[0] || '').trim(),
      name: (bits[1] || '').trim(),
      spec: tail.trim(),
    };
  }

  function specFor(specCode) {
    const t = String(specCode == null ? '' : specCode).toUpperCase();
    for (const s of SPECS) if (s.re.test(t)) return { grade: s.grade, yp: s.yp, ts: s.ts, el: s.el };
    return Object.assign({}, DEFAULT_SPEC);
  }

  function coatFor(prdCode) {
    return Object.assign({}, COATS[prdCode] || DEFAULT_COAT);
  }

  // ── 시드 난수 (문자열 → 재현 가능한 난수열) ───────────────────────────────
  // 같은 보증서번호는 언제 열어도 같은 코일 목록이 나와야 한다. 목업이 매번 달라지면
  // 화면 캡처·검토 기록이 서로 어긋나므로 Math.random 은 쓰지 않는다.
  function hash32(str) {
    let h = 2166136261 >>> 0;
    const s = String(str);
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function rng(seed) {
    let a = hash32(seed) || 1;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 총중량을 n개로 쪼갠다. 10kg 단위로 반올림하고 마지막 코일이 잔차를 흡수해 합이 정확히 total.
  function splitWeight(total, n, rnd) {
    if (n <= 0) return [];
    if (n === 1) return [total];
    const f = [];
    let fs = 0;
    for (let i = 0; i < n; i++) {
      const v = 0.85 + rnd() * 0.3;
      f.push(v);
      fs += v;
    }
    const out = [];
    let acc = 0;
    for (let i = 0; i < n - 1; i++) {
      const v = Math.max(10, Math.round((total * f[i]) / fs / 10) * 10);
      out.push(v);
      acc += v;
    }
    out.push(total - acc);
    return out;
  }

  // ── 문서 모델 ────────────────────────────────────────────────────────────
  // row: 발행 목록 1행. opts.coilCount 를 주면 코일 수를 바꾼다(페이지 분할 확인용 목업 조작).
  // 코일 수를 바꾸면 코일당 평균 중량을 유지한 채 총중량을 다시 계산한다.
  function buildCertDoc(row, opts) {
    const o = opts || {};
    const seedCoils = Math.max(1, num(row.coils) || 1);
    const seedWgt = Math.max(0, num(row.wgt) || 0);
    const n = Math.max(1, Math.min(200, o.coilCount == null ? seedCoils : Math.round(o.coilCount)));
    const total = n === seedCoils ? seedWgt : Math.round((seedWgt / seedCoils) * n / 10) * 10;

    const size = parseSize(row.size);
    const prd = parsePrd(row.prd);
    const spec = specFor(prd.spec);
    const coat = coatFor(prd.code);
    const rnd = rng(row.no + '|' + row.ver);

    const ymd = /^\d{4}-\d{2}-\d{2}$/.test(String(row.date))
      ? String(row.date).slice(2).replace(/-/g, '')
      : String(row.no).replace(/\D/g, '').slice(0, 4) + '01';
    const startSeq = 1 + Math.floor(rnd() * 40);
    const weights = splitWeight(total, n, rnd);

    const coils = [];
    for (let i = 0; i < n; i++) {
      const yp = Math.round(spec.yp * (1 + rnd() * 0.22));
      const ts = Math.max(Math.round(spec.ts * (1 + rnd() * 0.18)), Math.round(yp * 1.12));
      const el = spec.el == null ? null : Math.round(spec.el + rnd() * 12);
      const cw = Math.round(coat.min * (1 + rnd() * 0.25));
      const thk = size.thk == null ? null : Math.round((size.thk + (rnd() - 0.5) * 0.008) * 1000) / 1000;
      const wid = size.wid == null ? null : size.wid + Math.round(rnd() * 3);
      coils.push({
        seq: i + 1,

        heat: 'H' + ymd.slice(0, 2) + '-' + (8800 + Math.floor(i / 3)),
        thk: thk,
        wid: wid,
        wgt: weights[i],
        yp: yp,
        ts: ts,
        el: el,
        coat: cw,
        pass: yp >= spec.yp && ts >= spec.ts && (el == null || el >= spec.el) && cw >= coat.min,
      });
    }

    const issued = String(row.date) === '—' || !row.date ? null : String(row.date);
    const doc = {
      no: row.no,
      ver: row.ver,
      status: row.st,
      watermark: WATERMARKS[row.st] || null,
      customer: row.cus,
      po: row.po,
      order: row.ord,
      prd: prd,
      spec: spec,
      coat: coat,
      thk: size.thk,
      wid: size.wid,
      coilCount: n,
      totalWgt: total,
      issued: issued,
      issuer: row.by,
      coils: coils,
      criteria: [
        { name: '항복강도', sym: 'YP', unit: 'MPa', limit: spec.yp + ' 이상', method: TEST_METHODS.yp },
        { name: '인장강도', sym: 'TS', unit: 'MPa', limit: spec.ts + ' 이상', method: TEST_METHODS.ts },
        { name: '연신율', sym: 'EL', unit: '%', limit: spec.el == null ? '규정 없음' : spec.el + ' 이상', method: TEST_METHODS.el },
        { name: '도금부착량(양면)', sym: 'C/W', unit: 'g/㎡', limit: coat.min + ' 이상', method: TEST_METHODS.coat },
      ],
    };
    doc.docId = row.no + '-' + row.ver;
    // 발행본 식별용 지문. 0단계에서는 표시만 하고 검증 화면은 없다(2단계).
    doc.fingerprint = hash32(JSON.stringify([doc.docId, doc.totalWgt, coils.map(function (c) { return [c.no, c.yp, c.ts, c.el, c.coat]; })]))
      .toString(16).padStart(8, '0').toUpperCase();
    return doc;
  }

  // ── 페이지 분할 ──────────────────────────────────────────────────────────
  // 측정된 높이만 받는 순수 함수. 실제 DOM 측정은 report-doc.js 가 하고 여기로 넘긴다.
  // blocks: [{ id, kind:'block', h } | { id, kind:'table', headH, footH, rowHs:[…] }]
  // 반환: 페이지 배열. 각 페이지는 조각 배열 [{ id, kind, from, to, last }]
  //
  // 표는 페이지마다 헤더(headH)를 다시 그리고 소계 행(footH) 자리를 남긴다 — 표가 잘려도
  // 각 페이지가 그 자체로 읽히도록 하는 게 성적서의 기본 요구다.
  function paginate(blocks, pageH) {
    const pages = [];
    let cur = [];
    let used = 0;
    function flush() {
      if (cur.length) pages.push(cur);
      cur = [];
      used = 0;
    }
    for (const b of blocks) {
      if (b.kind === 'table') {
        const rowHs = b.rowHs || [];
        if (!rowHs.length) continue;
        let i = 0;
        while (i < rowHs.length) {
          let avail = pageH - used;
          // 헤더 + 1행 + 소계가 안 들어가면 다음 장으로. 빈 페이지에서도 안 들어가면
          // 무한 루프를 막기 위해 넘치더라도 1행은 올린다.
          if (avail < b.headH + rowHs[i] + b.footH && cur.length) {
            flush();
            avail = pageH;
          }
          let h = b.headH;
          let j = i;
          while (j < rowHs.length && h + rowHs[j] + b.footH <= avail) {
            h += rowHs[j];
            j++;
          }
          if (j === i) j = i + 1; // 최소 1행 보장
          cur.push({ id: b.id, kind: 'table', from: i, to: j, last: j >= rowHs.length });
          used += h + b.footH;
          i = j;
          if (i < rowHs.length) flush();
        }
      } else {
        if (b.h > pageH - used && cur.length) flush();
        cur.push({ id: b.id, kind: 'block' });
        used += b.h;
      }
    }
    flush();
    return pages.length ? pages : [[]];
  }

  g.MesReport = Object.assign(g.MesReport || {}, {
    buildCertDoc, paginate, specFor, coatFor, parseSize, parsePrd,
    esc, num, comma, splitWeight, rng, hash32,
    SPECS, COATS, WATERMARKS,
  });
})(globalThis);

/* assets/report/report-doc.js — 문서 모델 → A4 DOM, 실측 페이지 분할, 미리보기·인쇄
   빌드 시 build/inject_report.py 가 modules/quality-certificate.html 마커 구간에 복사한다.

   왜 CSS 만으로 안 되는가: 크롬은 @page 안의 여백 상자(@bottom-right 등)를 지원하지 않아
   'N / M' 페이지 번호를 CSS 로 찍을 수 없고, 장마다 소계를 넣는 것도 CSS 로는 불가능하다.
   그래서 (1) 숨은 컨테이너에 전부 그려 높이를 재고 (2) 순수 함수로 장을 나눈 뒤

(function (g) {

  const ROOT_ID = 'rp-root';
  const MAKER = '(주)목업제철 광양공장';

  // ── 조각별 HTML ──────────────────────────────────────────────────────────
  function headHtml(doc, pageNo, pageCount) {

      + '<div class="rp-maker"><b>' + esc(MAKER) + '</b><span>' + esc(MAKER_EN) + '</span></div>'
      + '<div class="rp-title"><b>품질보증서</b><span>QUALITY GUARANTEE CERTIFICATE</span></div>'
      + '<dl class="rp-stamp">'
      + '<dt>보증서번호</dt><dd class="mono">' + esc(doc.no) + ' ' + esc(doc.ver) + '</dd>'
      + '<dt>발행일</dt><dd class="mono">' + esc(doc.issued || '미발행') + '</dd>'
      + '<dt>페이지</dt><dd class="mono">' + pageNo + ' / ' + pageCount + '</dd>'
      + '</dl></div></div>';
  }

  function infoHtml(doc) {

    return '<div class="rp-info"><table>'
      + '<tr><th>수요가</th><td>' + esc(doc.customer) + '</td>'
      + '<th>주문번호</th><td class="mono">' + esc(doc.order) + '</td></tr>'
      + '<tr><th>발주번호(PO)</th><td class="mono">' + esc(doc.po) + '</td>'
      + '<th>품명 · 규격</th><td>' + esc(doc.prd.name) + ' · ' + esc(doc.prd.spec) + '</td></tr>'
      + '<tr><th>주문 치수 (mm)</th><td class="mono">' + esc(size) + '</td>'
      + '<th>도금 종류</th><td>' + esc(doc.coat.label) + '</td></tr>'
      + '<tr><th>수량 · 중량</th><td class="mono">' + doc.coilCount + ' 코일 · ' + comma(doc.totalWgt) + ' kg</td>'
      + '<th>발행 담당</th><td>' + esc(doc.issuer) + '</td></tr>'
      + '</table></div>';
  }

  function criteriaHtml(doc) {
    let h = '<div class="rp-sect"><h4>1. 보증 기준<span class="rp-of">강종 ' + esc(doc.spec.grade) + ' · 주문 사양 기준</span></h4>'
      + '<table class="rp-tbl"><colgroup><col style="width:46mm"><col style="width:18mm"><col style="width:20mm"><col style="width:44mm"><col></colgroup>'
      + '<thead><tr><th>항목</th><th>기호</th><th>단위</th><th>규격 기준</th><th>시험 방법</th></tr></thead><tbody>';
    doc.criteria.forEach(function (c) {
      h += '<tr><td>' + esc(c.name) + '</td><td class="ctr mono">' + esc(c.sym) + '</td>'
        + '<td class="ctr">' + esc(c.unit) + '</td><td class="ctr mono">' + esc(c.limit) + '</td>'

  var h='';
  DETAIL.sections.forEach(function(s){
    h+='<div class="d-sect"><h4>'+esc(s.h)+'</h4><dl class="kv">'+s.f.map(function(f){return '<dt>'+esc(f.l)+'</dt><dd>'+(f.t==='pill'?pill(r[f.k]):f.t==='mono'?'<span class="mono">'+esc(r[f.k])+'</span>':esc(r[f.k]));}).join('')+'</dl></div>';
  });
  if(typeof extraDetail==='function')h+=extraDetail(r);
  $('#d-body').innerHTML=h;
  $('#d-foot').innerHTML=DETAIL.actions.map(function(a){return '<button class="btn'+(a.pri?' btn-pri':a.warn?' btn-warn':'')+'" data-act="'+esc(a.k)+'">'+esc(a.l)+'</button>';}).join('');
  $('#drawer').classList.add('on');$('#drawer').setAttribute('aria-hidden','false');$('#scrim').classList.add('on');
}
function closeDrawer(){$('#drawer').classList.remove('on');$('#drawer').setAttribute('aria-hidden','true');$('#scrim').classList.remove('on');sel=null;renderTable();}
function setTab(k){
  $$('.tab').forEach(function(t){var on=t.getAttribute('data-tab')===k;t.classList.toggle('on',on);t.setAttribute('aria-selected',on?'true':'false');});
  $$('.sc').forEach(function(p){p.classList.toggle('on',p.id==='sc-'+k);});
}
document.addEventListener('click',function(e){
  var t=e.target.closest('.tab');if(t){setTab(t.getAttribute('data-tab'));return;}
  var row=e.target.closest('tr.row');if(row){openDrawer(row.getAttribute('data-id'));return;}
  if(e.target.closest('#d-close')||e.target.closest('#scrim')){closeDrawer();return;}
  var a=e.target.closest('[data-act]');if(a){
    var act=a.getAttribute('data-act');
    if(act==='preview'||act==='issue'){openReport(sel,act==='issue');return;}
    toast(a.textContent.trim()+' — 목업에서는 반영되지 않습니다');return;}
  var ps=e.target.closest('[data-action="print-sel"]');if(ps){openReport(sel,false);return;}
  var b=e.target.closest('[data-action="reset"]');if(b){if($('#f-q'))$('#f-q').value='';if($('#f-st'))$('#f-st').value='';renderTable();return;}
  var s=e.target.closest('[data-action="search"]');if(s){renderTable();return;}
  var m=e.target.closest('[data-action="msg"]');if(m){toast(m.getAttribute('data-msg')||m.textContent.trim());return;}
});
document.addEventListener('input',function(e){if(e.target.id==='f-q')renderTable();});
document.addEventListener('change',function(e){if(e.target.id==='f-st')renderTable();});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(MesReport.isOpen()){MesReport.close();return;}
  if($('#drawer').classList.contains('on'))closeDrawer();
});
var STATUS={"발행": {"cls": "ok"}, "초안": {"cls": "warn"}, "재발행": {"cls": "hold"}, "회수": {"cls": "no"}};
var STATUS_KEY="st";
// drawer 요약과 A4 보증서가 다른 값을 보이면 안 되므로 같은 모델에서 뽑는다.
function extraDetail(r){
  var d=MesReport.buildCertDoc(r);
  var keys=['yp','ts','el','coat'];
  var h='<div class="d-sect"><h4>보증 항목 (강종 '+esc(d.spec.grade)+')</h4>'
    +'<table class="mini"><tr><th>항목</th><th>기준</th><th class="num">대표값</th></tr>';
  d.criteria.forEach(function(c,i){
    var k=keys[i],sum=0,n=0;
    d.coils.forEach(function(x){if(x[k]!=null){sum+=x[k];n++;}});
    h+='<tr><td>'+esc(c.name)+' <span class="sub">'+esc(c.sym)+' · '+esc(c.unit)+'</span></td>'
      +'<td class="mono">'+esc(c.limit)+'</td><td class="num">'+(n?Math.round(sum/n):'—')+'</td></tr>';
  });
  return h+'</table><div class="note" style="margin-top:8px">'+d.coilCount
    +'개 코일의 평균값입니다. 코일별 성적은 «미리보기»에서 A4 보증서로 확인합니다.</div></div>';
}
renderTable();
</script>
</body>
</html>
